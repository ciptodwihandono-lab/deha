# Menyusun ulang daftar jenis Indonesia (Survei KEHATI) dari GBIF lalu menyimpannya ke cabang yang sama.
name: Perbarui daftar jenis dari GBIF
on:
  workflow_dispatch:
  push:
    branches: [claude/relaxed-bardeen-277ku4]
    paths: ['tools/gbif_jenis.py', '.github/workflows/jenis-gbif.yml']
permissions:
  contents: write
concurrency:
  group: jenis-gbif
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Ambil data GBIF
        run: python3 tools/gbif_jenis.py
      - name: Simpan hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/survei-kehati/data
          git diff --cached --quiet && exit 0
          git commit -m "Daftar jenis Indonesia dari GBIF ($(date +%F))"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
