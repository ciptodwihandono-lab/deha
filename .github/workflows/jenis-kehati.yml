# Menyusun daftar jenis Indonesia (GBIF + iNaturalist) dan data identifikasi foto BioCLIP untuk Survei KEHATI,
# lalu menyimpannya ke cabang yang menjalankan workflow ini.
name: Perbarui daftar jenis & identifikasi KEHATI
on:
  workflow_dispatch:
  push:
    branches: [claude/relaxed-bardeen-277ku4]
    paths: ['tools/build_jenis.py', 'tools/bioclip_build.py', '.github/workflows/jenis-kehati.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: jenis-kehati
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ambil taksonomi dari run pertama (sekali saja)
        if: hashFiles('tools/taxo/taxo-burung.json') == ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: build-kehati
          run-id: 41678653128
          github-token: ${{ github.token }}
          path: build-lama
      - name: Pindahkan taksonomi lama
        run: |
          mkdir -p tools/taxo
          if [ -d build-lama ]; then for f in build-lama/taxo-*.json; do [ -e "tools/taxo/$(basename $f)" ] || cp "$f" tools/taxo/; done; fi
          ls -la tools/taxo
      - name: Daftar jenis dari iNaturalist dan GBIF
        timeout-minutes: 180
        continue-on-error: true   # kelompok yang sudah selesai tetap disimpan
        run: python tools/build_jenis.py
      - name: Pasang PyTorch dan BioCLIP
        run: |
          pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "open_clip_torch>=2.24,<3" "onnx>=1.16,<1.18" "onnxruntime>=1.18,<1.21" pillow "numpy<2.2"
      - name: Model dan embedding BioCLIP, uji ketepatan
        timeout-minutes: 120
        run: python tools/bioclip_build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-kehati
          path: |
            apps/survei-kehati/data
            tools/taxo
      - name: Simpan hasil
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/survei-kehati/data apps/survei-kehati/model tools/taxo
          git diff --cached --quiet && exit 0
          git commit -m "Daftar jenis Indonesia & data identifikasi BioCLIP ($(date +%F))"
          # Cabang bisa berubah selama workflow berjalan: ulangi tarik + dorong beberapa kali.
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            echo "dorong gagal, coba lagi ($i)"; sleep $((i * 15))
          done
          exit 1
