# Menerbitkan aplikasi survei lapangan ke GitHub Pages.
# Aktifkan sekali di Settings → Pages → Source: "GitHub Actions".
name: Terbitkan aplikasi survei

on:
  push:
    branches: [main]
    paths: ['apps/survei-pantai-cemara/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/survei-pantai-cemara
      - id: deployment
        uses: actions/deploy-pages@v4
