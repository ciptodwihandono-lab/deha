<title>Peta Survei telah pindah</title>
<meta http-equiv="refresh" content="3; url=https://ciptodwihandono-lab.github.io/Peta-survey/">
<script>
// Lepas service worker lama milik alamat ini (bukan milik aplikasi formulir di /deha/), lalu pindah.
(async () => {
  try {
    const regs = navigator.serviceWorker ? await navigator.serviceWorker.getRegistrations() : [];
    await Promise.all(regs.filter(r => new URL(r.scope).pathname.endsWith('/deha/peta/')).map(r => r.unregister()));
  } catch (e) {}
  location.replace('https://ciptodwihandono-lab.github.io/Peta-survey/' + location.hash);
})();
</script>
