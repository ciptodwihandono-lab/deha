<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Peta Survei Pantai Cemara</title>
<meta name="description" content="Pemetaan lapangan ala surveyor: titik, jalur, dan area habitat dengan foto lokasi, peta offline, koordinat UTM, dan ekspor SHP/KMZ/GeoJSON.">
<meta name="theme-color" content="#0f2a33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
/* Layout: peta penuh layar dengan panel melayang (gaya aplikasi GIS lapangan); formulir objek sebagai lembar dari bawah. */
:root {
  --bg: #e9eff1;
  --surface: #ffffff;
  --surface-2: #f1f5f6;
  --fg: #10222a;
  --muted: #536a73;
  --line: #cad7db;
  --accent: #0f6f80;
  --accent-fg: #ffffff;
  --accent-soft: #d2eaee;
  --bar: #0f2a33;
  --bar-fg: #ecf5f7;
  --good: #1f9d55;
  --fair: #d39200;
  --poor: #d0453f;
  --bad: #b03636;
  --hud: rgba(15, 34, 42, .86);
  --hud-fg: #f2f8f9;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
  --font-data: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --r: 12px;
  --shadow: 0 2px 10px rgba(0,0,0,.22);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1316; --surface: #142026; --surface-2: #1a2930; --fg: #e3eef1; --muted: #9bb2ba;
    --line: #2a3c43; --accent: #4fb3c4; --accent-fg: #071a1e; --accent-soft: #183a42;
    --bar: #0a171b; --bar-fg: #e3eef1; --bad: #ff7b6e; --hud: rgba(10, 20, 24, .9); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1316; --surface: #142026; --surface-2: #1a2930; --fg: #e3eef1; --muted: #9bb2ba;
  --line: #2a3c43; --accent: #4fb3c4; --accent-fg: #071a1e; --accent-soft: #183a42;
  --bar: #0a171b; --bar-fg: #e3eef1; --bad: #ff7b6e; --hud: rgba(10, 20, 24, .9); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
svg.i { width: 22px; height: 22px; flex: none; }

.topbar { background: var(--bar); color: var(--bar-fg); padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: none; z-index: 1001; }
.topbar h1 { font-size: 16px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; }
.topbar .sub { display: block; font-size: 12px; font-weight: 400; opacity: .78; overflow: hidden; text-overflow: ellipsis; }
.gpschip { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); color: var(--bar-fg); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; cursor: pointer; white-space: nowrap; }
.gdot { width: 9px; height: 9px; border-radius: 50%; background: #8a979b; flex: none; }
.gpschip[data-q="good"] .gdot { background: var(--good); } .gpschip[data-q="fair"] .gdot { background: var(--fair); } .gpschip[data-q="poor"] .gdot { background: var(--poor); }
.iconbtn { background: none; border: 1px solid rgba(255,255,255,.25); color: var(--bar-fg); border-radius: 8px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
.netdot { width: 8px; height: 8px; border-radius: 50%; background: #8a979b; flex: none; }
.netdot.on { background: var(--good); }
.bandbar { flex-basis: 100%; margin: 4px -12px -8px -16px; display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 16px; font-size: 14px; font-weight: 600; color: #fff; }
.bandbar .grow { flex: 1; min-width: 0; font-variant-numeric: tabular-nums; }
.bandbar button.b { background: rgba(255,255,255,.95); color: #1b1b1b; border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 700; cursor: pointer; }
.installbar { background: #0f6f80; }
.bandbar button.x { background: none; border: 0; color: #fff; font-size: 16px; padding: 4px 6px; cursor: pointer; }
.recbar { background: #c62828; } .updbar { background: #2463a6; } .navbar { background: #6a3fb5; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #fff; animation: blink 1.2s infinite; flex: none; }
@keyframes blink { 50% { opacity: .25; } }

main { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; overflow: auto; }
.page { max-width: 720px; margin: 0 auto; padding: 14px 16px 28px; display: flex; flex-direction: column; gap: 18px; }
#mapView { overflow: hidden; }
#map { position: absolute; inset: 0; background: var(--surface-2); z-index: 0; }  /* konteks tumpukan sendiri: kontrol Leaflet tetap di bawah panel aplikasi */

nav.tabs { flex: none; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 1001; }
nav.tabs button { background: none; border: 0; padding: 7px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); cursor: pointer; min-height: 54px; }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 650; }

.float { position: absolute; z-index: 800; }
.fab { width: 46px; height: 46px; border-radius: 14px; border: 0; background: var(--surface); color: var(--fg); box-shadow: var(--shadow); display: grid; place-items: center; cursor: pointer; }
.fab[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.fabcol { display: flex; flex-direction: column; gap: 8px; }
#tl { top: 10px; left: 10px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; max-width: calc(100% - 80px); }
#rt { right: 10px; bottom: 150px; }
.legend { background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); font-size: 12px; padding: 6px 10px; max-height: 38vh; overflow: auto; }
.legend summary { cursor: pointer; font-weight: 650; font-size: 13px; }
.legend ul { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35); vertical-align: -1px; margin-right: 6px; flex: none; }
.hud { left: 10px; right: 66px; bottom: 74px; background: var(--hud); color: var(--hud-fg); border-radius: 10px; padding: 6px 10px; font-size: 12px; cursor: pointer; border: 0; text-align: left; display: flex; flex-direction: column; gap: 1px; }
.hud .c { font-family: var(--font-data); font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.hud .l { opacity: .75; }
.actions { left: 10px; right: 10px; bottom: 12px; display: flex; gap: 8px; }
.actbtn { flex: 1 1 0; min-width: 0; min-height: 52px; border-radius: 14px; border: 0; background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: 15px; box-shadow: var(--shadow); cursor: pointer; padding: 6px 8px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.actbtn.alt { background: var(--surface); color: var(--accent); }
.actbtn.rec { background: #c62828; color: #fff; }
.crosshair { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; z-index: 790; pointer-events: none; }
.menu { left: 10px; right: 10px; bottom: 72px; background: var(--surface); border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.3); display: flex; flex-direction: column; overflow: hidden; z-index: 900; }
.menu button { border: 0; border-top: 1px solid var(--line); background: none; padding: 13px 16px; text-align: left; cursor: pointer; display: flex; gap: 12px; align-items: center; color: var(--fg); }
.menu button:first-child { border-top: 0; }
.menu b { font-size: 15px; display: block; } .menu span span { font-size: 13px; color: var(--muted); }
.drawbar { left: 10px; right: 10px; top: 10px; background: var(--surface); border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.28); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; z-index: 850; }
.drawbar .info { font-size: 14px; } .drawbar .info b { font-family: var(--font-data); }
.drawbar .row button { flex: 1 1 0; min-height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 650; cursor: pointer; padding: 4px 6px; font-size: 14px; }
.drawbar .row button.go { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.meter { height: 6px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.lpanel { top: 10px; left: 10px; right: 10px; max-width: 420px; max-height: calc(100% - 90px); overflow: auto; background: var(--surface); border-radius: 14px; box-shadow: 0 6px 22px rgba(0,0,0,.32); z-index: 900; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
.lpanel .hd { display: flex; align-items: center; gap: 8px; }
.lpanel .hd h2 { flex: 1; }
.opt { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-top: 1px solid var(--line); cursor: pointer; }
.opt:first-of-type { border-top: 0; }
.opt input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.opt .main { flex: 1; min-width: 0; } .opt .t { font-weight: 600; font-size: 15px; } .opt .s { font-size: 12px; color: var(--muted); }
.badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.badge.off { background: rgba(31,157,85,.15); color: var(--good); }
.leaflet-container { font-family: var(--font-ui); }
.leaflet-bottom { bottom: 128px; }
.leaflet-top.leaflet-right { top: 10px; }
.leaflet-tooltip.kode { background: rgba(255,255,255,.93); border: 0; box-shadow: 0 1px 3px rgba(0,0,0,.3); font-weight: 700; font-size: 11px; padding: 1px 5px; color: #10222a; }
.vtx { background: #fff; border: 3px solid #ff6d00; border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.vtx.pt { border-color: #0f6f80; }

.sheet { position: fixed; inset: 0; z-index: 1500; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(0,0,0,.35); }
.sheet .panel { background: var(--bg); max-height: 90%; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; box-shadow: 0 -4px 18px rgba(0,0,0,.25); width: 100%; max-width: 760px; margin: 0 auto; }
.sheet .head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); border-radius: 18px 18px 0 0; }
.sheet .head h2 { font-size: 17px; margin: 0; flex: 1; min-width: 0; text-transform: none; letter-spacing: 0; color: var(--fg); display: flex; align-items: center; gap: 8px; }
.sheet .body { overflow: auto; padding: 14px 16px calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.modal { position: fixed; inset: 0; z-index: 2500; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; }
.modal .box { max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 10px; }

h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0; font-weight: 700; }
.section { display: flex; flex-direction: column; gap: 10px; }
.note { font-size: 14px; color: var(--muted); margin: 0; }
.hint { font-size: 12px; color: var(--muted); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.w { grid-column: 1 / -1; }
.field > label, .field > .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
input[type=text], input[type=search], select, textarea { width: 100%; min-height: 46px; padding: 10px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); min-width: 0; }
textarea { min-height: 70px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; background: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 7px 12px; min-height: 38px; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); font-weight: 650; cursor: pointer; text-align: center; text-decoration: none; }
.btn.ghost { background: var(--surface); color: var(--accent); }
.btn.danger { background: var(--surface); color: var(--bad); border-color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: var(--surface); }
.btn.block { width: 100%; }
.btn.sm { min-height: 38px; padding: 6px 12px; font-size: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }
.row > .btn.sm { flex: 1 1 120px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--font-data); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.photos button { padding: 0; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; aspect-ratio: 1; background: var(--surface-2); cursor: pointer; max-width: 100%; }
.photos img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photos .missing { font-size: 11px; color: var(--muted); padding: 4px; display: grid; place-items: center; height: 100%; }
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; width: 100%; cursor: pointer; min-height: 56px; color: var(--fg); flex-wrap: wrap; }
.item:first-child { border-top: 0; }
.item .main { flex: 1; min-width: 0; } .item .t { font-weight: 650; } .item .s { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.item .k { font-family: var(--font-data); font-size: 12px; color: var(--muted); white-space: nowrap; }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 16px; text-align: center; color: var(--muted); font-size: 14px; }
.sumtab { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.sumtab th, .sumtab td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: right; }
.sumtab th:first-child, .sumtab td:first-child { text-align: left; }
.sumtab th { font-size: 12px; color: var(--muted); font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; }
.stat .v { font-family: var(--font-data); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; } .stat .k { font-size: 12px; color: var(--muted); }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
details.guide { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; font-size: 14px; }
details.guide summary { cursor: pointer; font-weight: 650; }
details.guide ol { padding-left: 20px; margin: 8px 0; display: flex; flex-direction: column; gap: 6px; }
.viewer { position: fixed; inset: 0; z-index: 2000; background: #000; display: flex; flex-direction: column; }
.viewer img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
.viewer .vbar { display: flex; gap: 8px; align-items: center; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); color: #fff; font-size: 13px; flex-wrap: wrap; }
.viewer .vbar .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.viewer .vbar button { background: none; color: #fff; border: 1px solid rgba(255,255,255,.6); border-radius: 8px; padding: 8px 12px; font-weight: 650; cursor: pointer; }
.viewer .vbar button.armed { background: #c0392b; border-color: #c0392b; }
.toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 3000; max-width: calc(100% - 32px); box-shadow: 0 4px 14px rgba(0,0,0,.2); }
@media (max-width: 400px) { .fields { grid-template-columns: 1fr; } .stats { grid-template-columns: 1fr 1fr; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

<script>
'use strict';

/* ================= Atribut ================= */
const HABITAT = [
  ['MG', 'Mangrove', '#1b7f4b'], ['MF', 'Mudflat / hamparan lumpur', '#9c6b3c'], ['PP', 'Pantai pasir', '#e0c060'],
  ['VP', 'Vegetasi pantai (cemara, pandan)', '#5aa35a'], ['TB', 'Tambak', '#3fa7c9'], ['SW', 'Sawah', '#b5d334'],
  ['KB', 'Kebun / ladang', '#8a9a2a'], ['KS', 'Kebun kelapa / sawit', '#c98d1f'], ['PM', 'Permukiman', '#d0453f'],
  ['SG', 'Sungai / parit / kuala', '#2a63c9'], ['RW', 'Rawa / genangan', '#6c8fd6'], ['SM', 'Semak belukar', '#7fbf7f'],
  ['HT', 'Hutan', '#0f5a35'], ['LT', 'Lahan terbuka', '#b9a48a'], ['LN', 'Lainnya', '#8a6fb0'],
];
const HAB = Object.fromEntries(HABITAT.map(([k, l, c]) => [k, { l, c }]));
const KONDISI = [['B', 'Baik'], ['S', 'Sedang'], ['R', 'Rusak / terganggu']];
const ANCAMAN = [['SM', 'Sampah'], ['AB', 'Abrasi'], ['KV', 'Konversi lahan'], ['TB', 'Penebangan'], ['BR', 'Perburuan'], ['IP', 'Ipomoea / invasif'], ['LN', 'Lainnya']];
const TIPE = { point: 'Titik', line: 'Garis', area: 'Area' };
const PREFIX = { point: 'P', line: 'G', area: 'A' };
const ICON = { point: 'i-pt', line: 'i-line', area: 'i-area' };
const DEFAULT_VIEW = { lat: -1.17, lon: 104.37, z: 12 };

/* ================= Penyimpanan ================= */
const KEY = 'peta-survei-v1';
let S = load();
function blank() { return { v: 1, profile: { nama: '', proyek: 'KEE Mangrove Pantai Cemara' }, features: {}, seq: { point: 0, line: 0, area: 0 } }; }
function load() { try { const r = localStorage.getItem(KEY); if (r) { const o = Object.assign(blank(), JSON.parse(r)); o.profile = Object.assign(blank().profile, o.profile); return o; } } catch (e) {} return blank(); }
let saveTimer = null;
function save() { clearTimeout(saveTimer); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Gagal menyimpan: memori browser penuh. Ekspor data lalu hapus objek lama.'); } }
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 250); }
window.addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
const pref = (k, d) => { try { const v = localStorage.getItem('peta-survei-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const setPref = (k, v) => { try { localStorage.setItem('peta-survei-' + k, JSON.stringify(v)); } catch (e) {} };

/* ================= Utilitas & geodesi ================= */
const pad = n => String(n).padStart(2, '0');
const $ = id => document.getElementById(id);
function rid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function today() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function fmtTime(sec) { const d = new Date(sec * 1000); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtLen(m) { return m >= 1000 ? `${(m / 1000).toFixed(2).replace('.', ',')} km` : `${Math.round(m)} m`; }
function fmtHa(ha) { return `${ha.toFixed(ha < 10 ? 2 : 1).replace('.', ',')} ha`; }
function fmtMB(b) { return `${(b / 1048576).toFixed(b < 10485760 ? 1 : 0).replace('.', ',')} MB`; }
let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2800); }
const D2R = Math.PI / 180, R_E = 6371008.8;
function hav(a, b) { const dLat = (b[0] - a[0]) * D2R, dLon = (b[1] - a[1]) * D2R; const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * D2R) * Math.cos(b[0] * D2R) * Math.sin(dLon / 2) ** 2; return 2 * R_E * Math.asin(Math.sqrt(x)); }
function bearing(a, b) { const y = Math.sin((b[1] - a[1]) * D2R) * Math.cos(b[0] * D2R); const x = Math.cos(a[0] * D2R) * Math.sin(b[0] * D2R) - Math.sin(a[0] * D2R) * Math.cos(b[0] * D2R) * Math.cos((b[1] - a[1]) * D2R); return (Math.atan2(y, x) / D2R + 360) % 360; }
function arah(deg) { return ['U', 'TL', 'T', 'Tg', 'S', 'BD', 'B', 'BL'][Math.round(deg / 45) % 8]; }
function lineLen(pts, closed) { let L = 0; for (let i = 1; i < pts.length; i++) L += hav(pts[i - 1], pts[i]); if (closed && pts.length > 2) L += hav(pts[pts.length - 1], pts[0]); return L; }
function areaM2(pts) {
  if (pts.length < 3) return 0;
  const lat0 = pts.reduce((a, p) => a + p[0], 0) / pts.length * D2R;
  const xy = pts.map(p => [R_E * p[1] * D2R * Math.cos(lat0), R_E * p[0] * D2R]); let s = 0;
  for (let i = 0; i < xy.length; i++) { const j = (i + 1) % xy.length; s += xy[i][0] * xy[j][1] - xy[j][0] * xy[i][1]; }
  return Math.abs(s) / 2;
}
/* WGS 84 → UTM (seri Krüger; galat jauh di bawah 1 mm di dalam zona). */
function toUTM(lat, lon) {
  const zone = Math.min(60, Math.floor((lon + 180) / 6) + 1);
  const a = 6378137, f = 1 / 298.257223563, k0 = 0.9996, n = f / (2 - f);
  const A = a / (1 + n) * (1 + n * n / 4 + n ** 4 / 64);
  const al = [0, n / 2 - 2 * n * n / 3 + 5 * n ** 3 / 16, 13 * n * n / 48 - 3 * n ** 3 / 5, 61 * n ** 3 / 240];
  const lam0 = ((zone - 1) * 6 - 180 + 3) * D2R, phi = lat * D2R, lam = lon * D2R - lam0;
  const e = Math.sqrt(f * (2 - f));
  const t = Math.sinh(Math.atanh(Math.sin(phi)) - e * Math.atanh(e * Math.sin(phi)));
  const xi = Math.atan2(t, Math.cos(lam)), eta = Math.atanh(Math.sin(lam) / Math.sqrt(1 + t * t));
  let E = eta, N = xi;
  for (let j = 1; j <= 3; j++) { E += al[j] * Math.cos(2 * j * xi) * Math.sinh(2 * j * eta); N += al[j] * Math.sin(2 * j * xi) * Math.cosh(2 * j * eta); }
  const band = 'CDEFGHJKLMNPQRSTUVWX'[Math.max(0, Math.min(19, Math.floor((lat + 80) / 8)))];
  return { zone, band, e: 500000 + k0 * A * E, n: k0 * A * N + (lat < 0 ? 10000000 : 0), hemi: lat < 0 ? 'S' : 'N' };
}
function dms(v, pos, neg) { const s = v < 0 ? neg : pos; v = Math.abs(v); const d = Math.floor(v), m = Math.floor((v - d) * 60), sec = ((v - d) * 60 - m) * 60; return `${d}°${pad(m)}'${sec.toFixed(2).padStart(5, '0')}"${s}`; }
const FMT = ['utm', 'dd', 'dms'];
let coordFmt = pref('fmt', 'utm');
function fmtCoord(lat, lon, fmt = coordFmt) {
  if (fmt === 'dms') return `${dms(lat, 'U', 'S')} ${dms(lon, 'T', 'B')}`;
  if (fmt === 'utm') { const u = toUTM(lat, lon); return `${u.zone}${u.band} ${Math.round(u.e)} mT ${Math.round(u.n)} mU`; }
  return `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
}
function stats(f) {
  if (f.type === 'point') return { lat: f.coords[0], lon: f.coords[1], n: 1 };
  const pts = f.coords; const c = pts.reduce((a, p) => [a[0] + p[0] / pts.length, a[1] + p[1] / pts.length], [0, 0]);
  return { lat: c[0], lon: c[1], len: lineLen(pts, f.type === 'area'), ha: f.type === 'area' ? areaM2(pts) / 10000 : 0, n: pts.length };
}
function nextKode(type) { S.seq[type] = (S.seq[type] || 0) + 1; return PREFIX[type] + String(S.seq[type]).padStart(3, '0'); }
function habColor(k) { return (HAB[k] || { c: '#777' }).c; }
function habLabel(k) { return HAB[k] ? HAB[k].l : 'Habitat belum dipilih'; }
function gpsQ(acc) { return acc == null ? '' : acc <= 5 ? 'good' : acc <= 15 ? 'fair' : 'poor'; }

/* ================= IndexedDB: foto, layer acuan, peta offline ================= */
const PHOTO_MAX = 2560, PHOTO_Q = 0.88, THUMB_MAX = 320;
let dbp = null;
function pdb() {
  if (!dbp) dbp = new Promise((ok, fail) => {
    const r = indexedDB.open('peta-survei-foto', 2);
    r.onupgradeneeded = () => { const db = r.result; ['foto', 'thumb', 'ref', 'maps', 'tiles'].forEach(n => { if (!db.objectStoreNames.contains(n)) db.createObjectStore(n); }); };
    r.onsuccess = () => ok(r.result); r.onerror = () => fail(r.error);
  });
  return dbp;
}
async function pdbDo(store, mode, fn) {
  const db = await pdb();
  return new Promise((ok, fail) => { const tx = db.transaction(store, mode); const req = fn(tx.objectStore(store)); tx.oncomplete = () => ok(req && req.result); tx.onerror = () => fail(tx.error); tx.onabort = () => fail(tx.error); });
}
const pdbGet = (s, k) => pdbDo(s, 'readonly', st => st.get(k));
const pdbPut = (s, k, v) => pdbDo(s, 'readwrite', st => st.put(v, k));
const pdbDel = (s, k) => pdbDo(s, 'readwrite', st => st.delete(k));
const pdbAll = s => pdbDo(s, 'readonly', st => st.getAll());
async function deletePhotos(list) { for (const ph of list || []) { try { await pdbDel('foto', ph.id); await pdbDel('thumb', ph.id); } catch (e) {} } }
async function shrink(file, max) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { bmp = await new Promise((ok, fail) => { const im = new Image(); im.onload = () => ok(im); im.onerror = fail; im.src = URL.createObjectURL(file); }); }
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return { blob: await new Promise(ok => c.toBlob(ok, 'image/jpeg', PHOTO_Q)), w: c.width, h: c.height };
}

/* ================= Peta & peta dasar ================= */
const savedView = pref('view', DEFAULT_VIEW);
const map = L.map('map', { zoomControl: false, attributionControl: true }).setView([savedView.lat, savedView.lon], savedView.z);
L.control.zoom({ position: 'topright' }).addTo(map);
L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);
map.attributionControl.setPrefix(false);
map.on('moveend', () => { const c = map.getCenter(); setPref('view', { lat: +c.lat.toFixed(6), lon: +c.lng.toFixed(6), z: map.getZoom() }); updateHud(); });
map.on('move', () => { if (crossOn()) updateHud(); });

function onlineLayer(kind, cors) {
  if (kind === 'sat') return L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 21, maxNativeZoom: 18, attribution: 'Citra: Esri, Maxar, Earthstar Geographics', crossOrigin: cors ? 'anonymous' : undefined });
  if (kind === 'osm') return L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 21, maxNativeZoom: 19, attribution: '© OpenStreetMap contributors', crossOrigin: cors ? 'anonymous' : undefined });
  return null;
}
/* Peta offline hasil impor MBTiles/ZIP: tile dibaca dari IndexedDB. */
const OfflineLayer = L.GridLayer.extend({
  createTile(c, done) {
    const img = document.createElement('img'); img.alt = ''; img.setAttribute('role', 'presentation');
    pdbGet('tiles', `${this.options.mapId}/${c.z}/${c.x}/${c.y}`).then(b => {
      if (!b) { done(null, img); return; }
      const u = URL.createObjectURL(b); img.onload = img.onerror = () => { URL.revokeObjectURL(u); done(null, img); }; img.src = u;
    }).catch(e => done(e, img));
    return img;
  },
});
let MAPS = [];
let base = { kind: pref('base', 'sat') }, baseLayers = [], baseCors = true, tileErrors = 0;
function setBase(kind) {
  baseLayers.forEach(l => map.removeLayer(l)); baseLayers = [];
  base.kind = kind; setPref('base', kind); tileErrors = 0;
  const addOnline = k => { const l = onlineLayer(k, baseCors); if (!l) return; l.on('tileerror', () => { if (navigator.onLine && baseCors && ++tileErrors > 12) { baseCors = false; setBase(base.kind); } }); l.addTo(map); baseLayers.push(l); };
  if (kind.startsWith('off:')) {
    const m = MAPS.find(x => x.id === kind.slice(4));
    if (!m) { setBase('sat'); return; }
    addOnline('sat');   // di luar cakupan peta offline tetap tampil citra online/tersimpan bila ada
    const b = m.bounds;
    const l = new OfflineLayer({ mapId: m.id, minNativeZoom: m.minzoom, maxNativeZoom: m.maxzoom, maxZoom: 21, bounds: L.latLngBounds([b[1], b[0]], [b[3], b[2]]), attribution: esc(m.name) + ' (offline)' });
    l.addTo(map); baseLayers.push(l);
  } else addOnline(kind);
  baseLayers.forEach((l, i) => { if (i === 0) l.bringToBack(); });
}

const featLayer = L.featureGroup().addTo(map);
const refLayer = L.featureGroup().addTo(map);
const drawLayer = L.featureGroup().addTo(map);
const trackLayer = L.featureGroup().addTo(map);
const navLayer = L.featureGroup().addTo(map);
const layers = {};
let showLabels = pref('labels', true), showFeats = pref('feats', true), hiddenRefs = new Set(pref('hiddenRefs', []));
if (!showFeats) map.removeLayer(featLayer);
function tooltipPermanent() { return showLabels && map.getZoom() >= 16; }
function drawFeature(f) {
  if (layers[f.id]) { featLayer.removeLayer(layers[f.id]); delete layers[f.id]; }
  if (EDIT && EDIT.id === f.id) return;
  const c = habColor(f.habitat);
  let ly;
  if (f.type === 'point') ly = L.circleMarker([f.coords[0], f.coords[1]], { radius: 9, color: '#fff', weight: 2.5, fillColor: c, fillOpacity: 1 });
  else if (f.type === 'line') ly = L.polyline(f.coords.map(p => [p[0], p[1]]), { color: c, weight: 5, opacity: .95 });
  else ly = L.polygon(f.coords.map(p => [p[0], p[1]]), { color: c, weight: 3, fillColor: c, fillOpacity: .28 });
  if (showLabels) ly.bindTooltip(f.kode || '', { permanent: tooltipPermanent(), direction: f.type === 'point' ? 'right' : 'center', className: 'kode', offset: f.type === 'point' ? [8, 0] : [0, 0] });
  ly.on('click', ev => { L.DomEvent.stop(ev); if (DRAW || EDIT) { onMapTap(ev); return; } openSheet(f.id); });
  ly.addTo(featLayer); layers[f.id] = ly;
}
function drawAll() { featLayer.clearLayers(); Object.keys(layers).forEach(k => delete layers[k]); Object.values(S.features).forEach(drawFeature); renderLegend(); }
let lastPerm = tooltipPermanent();
map.on('zoomend', () => { const p = tooltipPermanent(); if (p !== lastPerm) { lastPerm = p; drawAll(); } });
function renderLegend() {
  const counts = {}; Object.values(S.features).forEach(f => { const k = f.habitat || '-'; counts[k] = (counts[k] || 0) + 1; });
  $('legend').hidden = !Object.keys(counts).length;
  $('legendList').innerHTML = HABITAT.filter(([k]) => counts[k]).map(([k, l, c]) => `<li><span class="sw" style="background:${c}"></span>${esc(l)} (${counts[k]})</li>`).join('') + (counts['-'] ? `<li><span class="sw" style="background:#777"></span>Belum dipilih (${counts['-']})</li>` : '');
}
$('fitBtn').addEventListener('click', () => {
  const g = L.featureGroup([...featLayer.getLayers(), ...refLayer.getLayers()]);
  if (g.getLayers().length) map.fitBounds(g.getBounds().pad(0.15), { maxZoom: 17 }); else toast('Belum ada objek di peta.');
});

/* ================= GPS: satu pemantau posisi untuk semua fitur ================= */
const posListeners = new Set();
let me = null, lastPos = null, meMarker = null, meCircle = null, follow = false, firstFix = !pref('hadFix', false), watchId = null;
function startWatch() {
  if (!navigator.geolocation || watchId != null) return;
  watchId = navigator.geolocation.watchPosition(p => {
    lastPos = p;
    me = { lat: p.coords.latitude, lon: p.coords.longitude, acc: Math.round(p.coords.accuracy), alt: p.coords.altitude, t: Math.round(p.timestamp / 1000) };
    const ll = [me.lat, me.lon];
    if (!meMarker) {
      meCircle = L.circle(ll, { radius: me.acc, color: '#1a73e8', weight: 1, fillColor: '#1a73e8', fillOpacity: .12, interactive: false }).addTo(map);
      meMarker = L.circleMarker(ll, { radius: 7, color: '#fff', weight: 3, fillColor: '#1a73e8', fillOpacity: 1, interactive: false }).addTo(map);
    } else { meMarker.setLatLng(ll); meCircle.setLatLng(ll).setRadius(me.acc); }
    $('gpsChip').dataset.q = gpsQ(me.acc); $('gpsTxt').textContent = `±${me.acc} m`;
    if (firstFix) { firstFix = false; setPref('hadFix', true); map.setView(ll, 16); } else if (follow) map.panTo(ll);
    updateHud(); onTrackPos(p); updateNav();
    posListeners.forEach(fn => fn(p));
  }, err => {
    $('gpsChip').dataset.q = ''; $('gpsTxt').textContent = err.code === 1 ? 'GPS ditolak' : 'Cari GPS';
    if (err.code === 1) watchId = null;
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 60000 });
}
function crossOn() { return !$('crosshair').hidden; }
function updateHud() {
  if (crossOn()) { const c = map.getCenter(); $('hudL').textContent = 'Tanda silang (tengah peta)'; $('hudC').textContent = fmtCoord(c.lat, c.lng); return; }
  if (!me) { $('hudL').textContent = 'Posisi saya'; $('hudC').textContent = 'Menunggu GPS…'; return; }
  $('hudL').textContent = `Posisi saya · ±${me.acc} m${me.alt != null ? ` · tinggi ${Math.round(me.alt)} m` : ''}`;
  $('hudC').textContent = fmtCoord(me.lat, me.lon);
}
const FMT_LABEL = { utm: 'UTM (WGS 84)', dd: 'derajat desimal', dms: 'derajat-menit-detik' };
$('hud').addEventListener('click', () => { coordFmt = FMT[(FMT.indexOf(coordFmt) + 1) % FMT.length]; setPref('fmt', coordFmt); updateHud(); toast('Format koordinat: ' + FMT_LABEL[coordFmt]); });
function goToMe() { startWatch(); if (me) map.setView([me.lat, me.lon], Math.max(map.getZoom(), 17)); else toast('Mencari sinyal GPS…'); }
$('gpsChip').addEventListener('click', () => { showTab('map'); goToMe(); });
$('locBtn').addEventListener('click', ev => { follow = !follow; ev.currentTarget.setAttribute('aria-pressed', follow); goToMe(); if (follow) toast('Peta mengikuti posisi Anda. Geser peta untuk berhenti.'); });
map.on('dragstart', () => { if (follow) { follow = false; $('locBtn').setAttribute('aria-pressed', 'false'); } });

/* ================= Membuat objek ================= */
function newFeature(type, coords, extra = {}) {
  const f = { id: rid(), type, kode: nextKode(type), nama: '', habitat: '', kondisi: '', ancaman: [], vegetasi: '', deskripsi: '', catatan: '',
    coords, t: Math.round(Date.now() / 1000), by: S.profile.nama || '', updated: Date.now(), ...extra };
  S.features[f.id] = f; save(); drawFeature(f); renderLegend();
  return f;
}
const addMenu = $('addMenu');
/* Foto cepat: kamera langsung terbuka; setelah memotret, foto menjadi titik baru di posisi GPS
   (atau di tengah peta bila GPS belum ada) dan formulirnya terbuka untuk diisi habitatnya. */
let QUICK = null;
$('photoBtn').addEventListener('click', () => {
  if (DRAW || EDIT) return;
  closeFloating(); startWatch();
  QUICK = { at: Date.now() };
  $('camIn').click();
});
function quickPoint() {
  const fresh = me && lastPos && Date.now() - lastPos.timestamp < 30000;
  let f;
  if (fresh) f = newFeature('point', [+me.lat.toFixed(7), +me.lon.toFixed(7), me.acc], { src: 'gps', foto: true });
  else { const c = map.getCenter(); f = newFeature('point', [+c.lat.toFixed(7), +c.lng.toFixed(7), 0], { src: 'peta', foto: true }); toast('GPS belum siap: titik diletakkan di tengah peta. Pakai "Ambil ulang GPS" atau "Geser titik" bila perlu.'); }
  if (fresh) map.setView([f.coords[0], f.coords[1]], Math.max(map.getZoom(), 17));
  return f;
}
function closeFloating() { addMenu.hidden = true; $('lpanel').hidden = true; }
$('addBtn').addEventListener('click', () => { if (DRAW || REC || EDIT) return; const open = addMenu.hidden; closeFloating(); addMenu.hidden = !open; });
map.on('click', ev => { if (!addMenu.hidden || !$('lpanel').hidden) { closeFloating(); return; } if (DRAW || EDIT) onMapTap(ev); });
addMenu.addEventListener('click', ev => { const b = ev.target.closest('[data-add]'); if (!b) return; addMenu.hidden = true; if (b.dataset.add === 'gps') gpsAverage(); else startDraw(b.dataset.add); });

/* Titik GPS rata-rata: bacaan berbobot 1/akurasi²; bacaan > 20 m diabaikan bila ada yang lebih baik.
   targetId diisi untuk "Ambil ulang GPS" pada titik yang sudah ada. */
const AVG_N = 10, AVG_MAX_ACC = 20;
function gpsAverage(targetId) {
  if (!navigator.geolocation) { toast('GPS tidak tersedia di perangkat ini.'); return; }
  startWatch(); closeFloating();
  const reads = [], t0 = Date.now();
  DRAW = { kind: 'gps' }; showDrawbar(['drawCancel', 'drawDone']); $('drawDone').textContent = 'Simpan sekarang'; $('drawMeter').hidden = false;
  const good = () => { const g = reads.filter(r => r.acc <= AVG_MAX_ACC); return g.length ? g : reads; };
  function result() {
    const rs = good(); if (!rs.length) return null;
    let sw = 0, la = 0, lo = 0; rs.forEach(r => { const w = 1 / Math.max(1, r.acc) ** 2; sw += w; la += r.lat * w; lo += r.lon * w; });
    const lat = la / sw, lon = lo / sw;
    const spread = Math.sqrt(rs.reduce((a, r) => a + hav([lat, lon], [r.lat, r.lon]) ** 2, 0) / rs.length);
    const accAvg = rs.reduce((a, r) => a + r.acc, 0) / rs.length;
    return { lat, lon, n: rs.length, spread, accAvg, accEst: Math.max(spread, accAvg / Math.sqrt(rs.length)) };
  }
  function show() {
    const r = result(), n = good().length;
    $('drawMeter').firstElementChild.style.width = Math.min(100, n / AVG_N * 100) + '%';
    $('drawInfo').innerHTML = !r ? 'Mencari sinyal GPS… berdiri diam di tempat terbuka.'
      : `Merata-rata GPS: <b>${Math.min(n, AVG_N)}/${AVG_N}</b> bacaan · akurasi rata-rata <b>±${r.accAvg.toFixed(1).replace('.', ',')} m</b> · sebaran <b>${r.spread.toFixed(1).replace('.', ',')} m</b>`;
  }
  const onPos = p => { reads.push({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy }); show(); if (reads.filter(r => r.acc <= AVG_MAX_ACC).length >= AVG_N) finish(); };
  posListeners.add(onPos);
  if (lastPos && Date.now() - lastPos.timestamp < 5000) setTimeout(() => posListeners.has(onPos) && onPos(lastPos), 0);
  const timer = setTimeout(() => { if (posListeners.has(onPos) && reads.length) finish(); }, 30000);
  show();
  DRAW.finish = finish;
  DRAW.cancel = () => { posListeners.delete(onPos); clearTimeout(timer); endDraw(); if (targetId) openSheet(targetId); };
  function finish() {
    if (!posListeners.has(onPos)) return;
    const r = result();
    if (!r) { toast('Belum ada posisi GPS. Tunggu sebentar di tempat terbuka.'); return; }
    posListeners.delete(onPos); clearTimeout(timer); endDraw();
    const coords = [+r.lat.toFixed(7), +r.lon.toFixed(7), Math.round(r.accEst * 10) / 10];
    const gps = { metode: 'rata-rata', n: r.n, sebaran_m: +r.spread.toFixed(2), akurasi_rata_m: +r.accAvg.toFixed(1), durasi_s: Math.round((Date.now() - t0) / 1000) };
    map.setView([r.lat, r.lon], Math.max(map.getZoom(), 17));
    if (targetId && S.features[targetId]) {
      const f = S.features[targetId]; f.coords = coords; f.gps = gps; f.src = 'gps'; f.updated = Date.now(); save(); drawFeature(f);
      toast(`Koordinat ${f.kode} diperbarui (±${coords[2]} m)`); openSheet(f.id);
    } else openSheet(newFeature('point', coords, { src: 'gps', gps }).id);
  }
}

/* Mode gambar & ukur: ketuk peta atau tambah titik di tanda silang tengah layar. */
let DRAW = null;
function showDrawbar(btns) {
  $('drawbar').hidden = false;
  ['drawAdd', 'drawUndo', 'drawCancel', 'drawDone'].forEach(id => { $(id).hidden = !btns.includes(id); });
  $('drawDone').textContent = 'Selesai'; $('drawMeter').hidden = true;
}
function startDraw(kind) {
  closeFloating();
  DRAW = { kind, verts: [] };
  showDrawbar(kind === 'point' ? ['drawAdd', 'drawCancel'] : ['drawAdd', 'drawUndo', 'drawCancel', 'drawDone']);
  $('drawAdd').textContent = kind === 'point' ? 'Pakai titik tengah' : '+ Titik tengah';
  $('crosshair').hidden = false; updateHud();
  map.getContainer().style.cursor = 'crosshair';
  updateDraw();
}
function updateDraw() {
  drawLayer.clearLayers();
  const v = DRAW.verts, info = $('drawInfo'), closed = DRAW.kind === 'area' || (DRAW.kind === 'measure' && v.length > 2);
  if (DRAW.kind === 'point') { info.textContent = 'Ketuk peta di lokasi titik, atau geser peta sampai tanda silang tepat di lokasi lalu tekan "Pakai titik tengah".'; return; }
  v.forEach(p => L.circleMarker(p, { radius: 5, color: '#fff', weight: 2, fillColor: '#ff6d00', fillOpacity: 1, interactive: false }).addTo(drawLayer));
  if (v.length > 1) (closed ? L.polygon(v, { color: '#ff6d00', weight: 3, dashArray: '6 6', fillOpacity: .15, interactive: false }) : L.polyline(v, { color: '#ff6d00', weight: 4, dashArray: '6 6', interactive: false })).addTo(drawLayer);
  const pts = v.map(p => [p[0], p[1]]);
  if (DRAW.kind === 'measure') {
    info.innerHTML = v.length < 2 ? 'Alat ukur: ketuk peta atau tekan "+ Titik tengah". Hasil tidak disimpan.'
      : `Jarak <b>${fmtLen(lineLen(pts))}</b>${v.length > 2 ? ` · keliling <b>${fmtLen(lineLen(pts, true))}</b> · luas <b>${fmtHa(areaM2(pts) / 10000)}</b> (${Math.round(areaM2(pts)).toLocaleString('id-ID')} m²)` : ''}`;
    return;
  }
  const need = DRAW.kind === 'area' ? 3 : 2;
  info.innerHTML = v.length < need ? `Tambah titik sudut ${DRAW.kind === 'area' ? 'area' : 'garis'}: ketuk peta atau tekan "+ Titik tengah" (${v.length}/${need} minimum).`
    : `${v.length} titik · <b>${fmtLen(lineLen(pts, DRAW.kind === 'area'))}</b>${DRAW.kind === 'area' ? ` · luas <b>${fmtHa(areaM2(pts) / 10000)}</b>` : ''}`;
}
function addVertex(ll) {
  if (!DRAW || DRAW.kind === 'gps') return;
  ll = [+ll[0].toFixed(7), +ll[1].toFixed(7)];
  if (DRAW.kind === 'point') { endDraw(); openSheet(newFeature('point', [ll[0], ll[1], 0], { src: 'peta' }).id); return; }
  DRAW.verts.push(ll); updateDraw();
}
function onMapTap(ev) {
  if (EDIT) { editInsert(ev.latlng); return; }
  if (DRAW) addVertex([ev.latlng.lat, ev.latlng.lng]);
}
function endDraw() { DRAW = null; drawLayer.clearLayers(); $('drawbar').hidden = true; $('crosshair').hidden = true; $('drawMeter').hidden = true; map.getContainer().style.cursor = ''; $('measureBtn').setAttribute('aria-pressed', 'false'); updateHud(); }
$('drawAdd').addEventListener('click', () => { if (EDIT) return; const c = map.getCenter(); addVertex([c.lat, c.lng]); });
$('drawUndo').addEventListener('click', () => { if (EDIT) editUndo(); else if (DRAW && DRAW.verts) { DRAW.verts.pop(); updateDraw(); } });
$('drawCancel').addEventListener('click', () => { if (EDIT) { endEdit(false); return; } if (DRAW && DRAW.cancel) DRAW.cancel(); else endDraw(); });
$('drawDone').addEventListener('click', () => {
  if (EDIT) { endEdit(true); return; }
  if (!DRAW) return;
  if (DRAW.finish) { DRAW.finish(); return; }
  if (DRAW.kind === 'measure') { endDraw(); return; }
  const need = DRAW.kind === 'area' ? 3 : 2;
  if (DRAW.verts.length < need) { toast(`Perlu minimal ${need} titik sudut.`); return; }
  const kind = DRAW.kind, coords = DRAW.verts.map(p => [p[0], p[1], 0, 0]);
  endDraw(); openSheet(newFeature(kind, coords, { src: 'peta' }).id);
});
$('measureBtn').addEventListener('click', ev => {
  if (DRAW && DRAW.kind === 'measure') { endDraw(); return; }
  if (DRAW || EDIT || REC) return;
  startDraw('measure'); ev.currentTarget.setAttribute('aria-pressed', 'true');
});

/* ================= Ubah bentuk / posisi ================= */
let EDIT = null;
const vtxIcon = cls => L.divIcon({ className: 'vtx' + (cls ? ' ' + cls : ''), iconSize: [20, 20] });
function startEdit(id) {
  const f = S.features[id]; if (!f) return;
  closeSheet(); showTab('map');
  EDIT = { id, type: f.type, coords: f.coords.map(p => p.slice()), hist: [] };
  if (layers[id]) { featLayer.removeLayer(layers[id]); delete layers[id]; }
  showDrawbar(['drawUndo', 'drawCancel', 'drawDone']); $('drawDone').textContent = 'Simpan';
  renderEdit();
  if (f.type === 'point') map.setView([f.coords[0], f.coords[1]], Math.max(map.getZoom(), 17)); else map.fitBounds(L.latLngBounds(f.coords.map(p => [p[0], p[1]])).pad(0.25));
}
function renderEdit() {
  drawLayer.clearLayers();
  const E = EDIT, pts = E.coords.map(p => [p[0], p[1]]), c = habColor(S.features[E.id].habitat);
  if (E.type !== 'point' && pts.length > 1) (E.type === 'area' ? L.polygon(pts, { color: c, weight: 3, fillOpacity: .2, interactive: false }) : L.polyline(pts, { color: c, weight: 5, interactive: false })).addTo(drawLayer);
  E.coords.forEach((p, i) => {
    const m = L.marker([p[0], p[1]], { draggable: true, icon: vtxIcon(E.type === 'point' ? 'pt' : ''), zIndexOffset: 1000 }).addTo(drawLayer);
    m.on('dragstart', () => E.hist.push(E.coords.map(q => q.slice())));
    m.on('drag', ev => { const ll = ev.target.getLatLng(); E.coords[i] = [+ll.lat.toFixed(7), +ll.lng.toFixed(7), 0, 0]; const sh = drawLayer.getLayers().find(l => l instanceof L.Polyline); if (sh) sh.setLatLngs(E.coords.map(q => [q[0], q[1]])); });
    m.on('dragend', () => renderEdit());
    m.on('click', ev => {
      L.DomEvent.stop(ev); if (E.type === 'point') return;
      const min = E.type === 'area' ? 3 : 2;
      if (E.coords.length <= min) { toast(`Minimal ${min} titik sudut.`); return; }
      E.hist.push(E.coords.map(q => q.slice())); E.coords.splice(i, 1); renderEdit();
    });
  });
  if (E.type === 'point') { $('drawInfo').textContent = 'Seret titik ke posisi yang benar, lalu tekan Simpan.'; return; }
  $('drawInfo').innerHTML = `Seret titik sudut untuk memindah · ketuk titik sudut untuk menghapus · ketuk peta untuk menyisipkan.<br><b>${fmtLen(lineLen(pts, E.type === 'area'))}</b>${E.type === 'area' ? ` · luas <b>${fmtHa(areaM2(pts) / 10000)}</b>` : ''}`;
}
function editInsert(ll) {
  const E = EDIT; if (!E || E.type === 'point') return;
  const P = map.latLngToLayerPoint(ll), pts = E.coords.map(p => map.latLngToLayerPoint([p[0], p[1]]));
  let best = 0, bd = Infinity; const n = pts.length, segs = E.type === 'area' ? n : n - 1;
  for (let i = 0; i < segs; i++) { const d = L.LineUtil.pointToSegmentDistance(P, pts[i], pts[(i + 1) % n]); if (d < bd) { bd = d; best = i; } }
  E.hist.push(E.coords.map(q => q.slice()));
  E.coords.splice(best + 1, 0, [+ll.lat.toFixed(7), +ll.lng.toFixed(7), 0, 0]); renderEdit();
}
function editUndo() { if (EDIT && EDIT.hist.length) { EDIT.coords = EDIT.hist.pop(); renderEdit(); } }
function endEdit(keep) {
  const E = EDIT; EDIT = null; drawLayer.clearLayers(); $('drawbar').hidden = true;
  const f = S.features[E.id];
  if (f && keep) {
    if (f.type === 'point') { if (hav(f.coords, E.coords[0]) > 0.01) { f.coords = [E.coords[0][0], E.coords[0][1], 0]; f.src = 'peta'; delete f.gps; } }
    else f.coords = E.coords;
    f.updated = Date.now(); save(); toast('Bentuk/posisi disimpan');
  }
  if (f) { drawFeature(f); openSheet(f.id); }
}

/* ================= Navigasi ke objek ================= */
let NAV = null;
function startNav(id) { NAV = { id }; closeSheet(); showTab('map'); $('navbar').hidden = false; startWatch(); updateNav(); const st = stats(S.features[id]); if (me) map.fitBounds(L.latLngBounds([[me.lat, me.lon], [st.lat, st.lon]]).pad(0.3), { maxZoom: 18 }); }
function stopNav() { NAV = null; navLayer.clearLayers(); $('navbar').hidden = true; if (updateReady && safeToReload()) applyUpdate(); }
$('navStop').addEventListener('click', stopNav);
function updateNav() {
  if (!NAV) return;
  const f = S.features[NAV.id]; if (!f) { stopNav(); return; }
  const st = stats(f), tgt = [st.lat, st.lon];
  navLayer.clearLayers();

  const d = hav([me.lat, me.lon], tgt), b = bearing([me.lat, me.lon], tgt);
  L.polyline([[me.lat, me.lon], tgt], { color: '#6a3fb5', weight: 3, dashArray: '8 8', interactive: false }).addTo(navLayer);
  $('navText').textContent = d <= Math.max(5, me.acc) ? `${f.kode}: Anda sudah di lokasi (±${me.acc} m)` : `Menuju ${f.kode}: ${fmtLen(d)} · arah ${Math.round(b)}° (${arah(b)})`;
}

/* ================= Rekam jalur ================= */
const TRK_MAX_ACC = 30, TRK_MIN_STEP = 4;
let REC = null, wakeLock = null, recLine = null;
async function keepAwake() { try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { wakeLock = null; } }
document.addEventListener('visibilitychange', () => { if (!document.hidden && REC) keepAwake(); });
$('trackBtn').addEventListener('click', () => { if (REC) stopTrack(); else startTrack(); });
$('recStop').addEventListener('click', () => stopTrack());
function startTrack() {
  if (!navigator.geolocation) { toast('GPS tidak tersedia.'); return; }
  if (DRAW || EDIT) return;
  closeFloating(); REC = { pts: [], waitAcc: 0, t0: Date.now() };
  startWatch(); keepAwake();
  recLine = L.polyline([], { color: '#e53935', weight: 4 }).addTo(trackLayer);
  $('trackLbl').textContent = 'Hentikan'; $('trackBtn').classList.add('rec');
  $('recbar').hidden = false; updateRecText();
  toast('Rekam jalur dimulai. Biarkan layar menyala dan aplikasi tetap terbuka.');
}
function updateRecText() {
  if (!REC) return;
  const min = Math.floor((Date.now() - REC.t0) / 60000);
  $('recText').textContent = `Merekam · ${fmtLen(lineLen(REC.pts))} · ${REC.pts.length} titik · ${min} mnt${REC.waitAcc ? ` · menunggu GPS (±${REC.waitAcc} m)` : ''}`;
}
function onTrackPos(p) {
  if (!REC) return;
  const acc = Math.round(p.coords.accuracy);
  if (acc > TRK_MAX_ACC) { REC.waitAcc = acc; updateRecText(); return; }
  REC.waitAcc = 0;
  const pt = [+p.coords.latitude.toFixed(7), +p.coords.longitude.toFixed(7), acc, Math.round(p.timestamp / 1000)];
  const last = REC.pts[REC.pts.length - 1];
  if (last && hav(last, pt) < Math.max(TRK_MIN_STEP, acc * 0.5)) { updateRecText(); return; }
  REC.pts.push(pt); recLine.addLatLng([pt[0], pt[1]]); updateRecText();
  try { sessionStorage.setItem('peta-survei-rec', JSON.stringify(REC.pts)); } catch (e) {}
}
function stopTrack() {
  if (!REC) return;
  const pts = REC.pts; REC = null;
  trackLayer.clearLayers(); recLine = null;
  try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null;
  try { sessionStorage.removeItem('peta-survei-rec'); } catch (e) {}
  $('trackLbl').textContent = 'Rekam'; $('trackBtn').classList.remove('rec'); $('recbar').hidden = true;
  if (pts.length < 2) { toast('Jalur terlalu pendek, tidak disimpan.'); return; }
  const f = newFeature('line', pts, { src: 'gps' });
  toast(`Jalur tersimpan: ${fmtLen(lineLen(pts))}`); openSheet(f.id);
}

/* ================= Panel lapisan ================= */

    </div>

    <h2>Tampilan</h2>
    <div>

async function addPhotos(files) {
  const f = S.features[SHEET]; if (!f || !files.length) return;
  toast(files.length > 1 ? `Menyimpan ${files.length} foto…` : 'Menyimpan foto…');
  const geo = me; let n = 0;
  for (const file of files) {
    try {
      const taken = Math.round((file.lastModified || Date.now()) / 1000);
      const big = await shrink(file, PHOTO_MAX), small = await shrink(file, THUMB_MAX), id = rid();
      await pdbPut('foto', id, big.blob); await pdbPut('thumb', id, small.blob);
      f._photos = f._photos || [];
      const d = new Date(taken * 1000);
      const stem = `${(f.kode || 'objek').replace(/[^\w-]+/g, '_')}_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
      let name = stem, k = 1; while (f._photos.some(p => p.name === name + '.jpg')) name = stem + '_' + (++k);
      const meta = { id, name: name + '.jpg', t: taken, w: big.w, h: big.h, size: big.blob.size };
      if (geo) Object.assign(meta, { lat: +geo.lat.toFixed(7), lon: +geo.lon.toFixed(7), acc: geo.acc });
      else if (f.type === 'point') Object.assign(meta, { lat: f.coords[0], lon: f.coords[1], acc: f.coords[2] || null });
      f._photos.push(meta); n++;
    } catch (e) { toast('Foto gagal disimpan. Memori HP mungkin penuh.'); }
  }
  if (n) { f.updated = Date.now(); save(); if (SHEET === f.id) renderSheet(); toast(`${n} foto tersimpan`); }
}

$('importIn').addEventListener('change', ev => {
  const file = ev.target.files[0]; ev.target.value = ''; if (!file) return;
  file.text().then(txt => {
    const o = JSON.parse(txt), d = o.data || o; if (!d.features) throw new Error('format');
    let add = 0, upd = 0;
    Object.values(d.features).forEach(f => { const cur = S.features[f.id]; if (!cur) { S.features[f.id] = f; add++; } else if ((f.updated || 0) > (cur.updated || 0)) { S.features[f.id] = f; upd++; } });
    ['point', 'line', 'area'].forEach(t => { S.seq[t] = Math.max(S.seq[t] || 0, (d.seq && d.seq[t]) || 0); });
    save(); drawAll(); renderData(); toast(`Digabung: ${add} objek baru, ${upd} diperbarui`);
  }).catch(() => toast('File ini bukan cadangan Peta Survei (.json).'));
});
function parseRef(text) {
  const t = text.trim();
  if (t.startsWith('{')) {
    const g = JSON.parse(t);
    if (g.type === 'FeatureCollection') return g;
    if (g.type === 'Feature') return { type: 'FeatureCollection', features: [g] };
    if (g.type) return { type: 'FeatureCollection', features: [{ type: 'Feature', properties: {}, geometry: g }] };
    throw new Error('geojson');
  }
  const doc = new DOMParser().parseFromString(t, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('xml');
  const byTag = (el, n) => [...el.getElementsByTagNameNS('*', n)];
  const feats = [], coordsOf = s => s.trim().split(/\s+/).map(c => c.split(',').map(Number)).filter(a => a.length >= 2 && isFinite(a[0]) && isFinite(a[1])).map(a => [a[0], a[1]]);
  byTag(doc, 'Placemark').forEach(pm => {
    const name = (byTag(pm, 'name')[0] || {}).textContent || '';
    byTag(pm, 'Point').forEach(p => { const c = coordsOf(byTag(p, 'coordinates')[0].textContent)[0]; if (c) feats.push({ type: 'Feature', properties: { name }, geometry: { type: 'Point', coordinates: c } }); });
    byTag(pm, 'LineString').forEach(p => feats.push({ type: 'Feature', properties: { name }, geometry: { type: 'LineString', coordinates: coordsOf(byTag(p, 'coordinates')[0].textContent) } }));
    byTag(pm, 'Polygon').forEach(p => { const ob = byTag(p, 'outerBoundaryIs')[0] || p; feats.push({ type: 'Feature', properties: { name }, geometry: { type: 'Polygon', coordinates: [coordsOf(byTag(ob, 'coordinates')[0].textContent)] } }); });
  });
  const pt = n => [+n.getAttribute('lon'), +n.getAttribute('lat')];
  byTag(doc, 'trk').forEach(tr => byTag(tr, 'trkseg').forEach(sg => feats.push({ type: 'Feature', properties: { name: (byTag(tr, 'name')[0] || {}).textContent || '' }, geometry: { type: 'LineString', coordinates: byTag(sg, 'trkpt').map(pt) } })));
  byTag(doc, 'rte').forEach(r => feats.push({ type: 'Feature', properties: { name: (byTag(r, 'name')[0] || {}).textContent || '' }, geometry: { type: 'LineString', coordinates: byTag(r, 'rtept').map(pt) } }));
  byTag(doc, 'wpt').forEach(w => feats.push({ type: 'Feature', properties: { name: (byTag(w, 'name')[0] || {}).textContent || '' }, geometry: { type: 'Point', coordinates: pt(w) } }));
  if (!feats.length) throw new Error('kosong');
  return { type: 'FeatureCollection', features: feats };
}
$('refIn').addEventListener('change', ev => {

async function drawRefs(fit) {
  refLayer.clearLayers();
  const refs = await pdbAll('ref').catch(() => []);
  refs.filter(r => !hiddenRefs.has(r.id)).forEach(r => L.geoJSON(r.geojson, {

    onEachFeature: (f, ly) => { const n = f.properties && (f.properties.name || f.properties.NAMA || f.properties.nama); if (n) ly.bindTooltip(String(n)); },
  }).addTo(refLayer));

/* Peta offline: MBTiles (SQLite, dibaca dengan sql.js) atau ZIP berisi {z}/{x}/{y}.png|jpg. Tile disalin ke IndexedDB. */
function tile2lon(x, z) { return x / 2 ** z * 360 - 180; }
function tile2lat(y, z) { const n = Math.PI - 2 * Math.PI * y / 2 ** z; return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n))); }
function mimeOf(u8, fmt) { if (u8[0] === 0x89 && u8[1] === 0x50) return 'image/png'; if (u8[0] === 0xff && u8[1] === 0xd8) return 'image/jpeg'; if (u8[8] === 0x57 && u8[9] === 0x45) return 'image/webp'; return fmt === 'png' ? 'image/png' : fmt === 'webp' ? 'image/webp' : 'image/jpeg'; }
function progress(t, frac, s) { $('progress').hidden = false; $('progT').textContent = t; $('progBar').style.width = Math.round(frac * 100) + '%'; $('progS').textContent = s || ''; }
function progressEnd() { $('progress').hidden = true; }
const yieldUI = () => new Promise(r => setTimeout(r, 0));
async function putTiles(batch) { await pdbDo('tiles', 'readwrite', st => { let r; batch.forEach(([k, v]) => { r = st.put(v, k); }); return r; }); }
function newRange() { return { minz: 99, maxz: -1, byz: {} }; }
function trackRange(rg, z, x, y) { rg.minz = Math.min(rg.minz, z); rg.maxz = Math.max(rg.maxz, z); const b = rg.byz[z] = rg.byz[z] || [Infinity, Infinity, -Infinity, -Infinity]; b[0] = Math.min(b[0], x); b[1] = Math.min(b[1], y); b[2] = Math.max(b[2], x); b[3] = Math.max(b[3], y); }
function boundsFrom(rg) { const z = rg.maxz, b = rg.byz[z]; return [tile2lon(b[0], z), tile2lat(b[3] + 1, z), tile2lon(b[2] + 1, z), tile2lat(b[1], z)]; }
let sqlP = null;
function loadSQL() {
  if (!sqlP) sqlP = new Promise((ok, fail) => { if (window.initSqlJs) { ok(); return; } const s = document.createElement('script'); s.src = 'vendor/sql-wasm.js'; s.onload = ok; s.onerror = fail; document.head.appendChild(s); })
    .then(() => window.initSqlJs({ locateFile: f => 'vendor/' + f }));
  return sqlP;
}
async function importMBTiles(file, id) {
  if (file.size > 400 * 1048576) toast('File besar: impor bisa lama dan butuh memori HP yang cukup.');
  progress('Membaca MBTiles…', 0, file.name);
  const SQL = await loadSQL();
  const db = new SQL.Database(new Uint8Array(await file.arrayBuffer()));
  try {
    const meta = {}; try { const r = db.exec('SELECT name, value FROM metadata'); if (r[0]) r[0].values.forEach(([k, v]) => { meta[k] = v; }); } catch (e) {}
    const total = db.exec('SELECT COUNT(*) FROM tiles')[0].values[0][0];
    const st = db.prepare('SELECT zoom_level, tile_column, tile_row, tile_data FROM tiles');
    const rg = newRange(); let n = 0, bytes = 0, batch = [];
    while (st.step()) {
      const [z, x, tr, data] = st.get(); const y = (1 << z) - 1 - tr;   // MBTiles memakai skema TMS
      const u8 = data instanceof Uint8Array ? data : new Uint8Array(data);
      batch.push([`${id}/${z}/${x}/${y}`, new Blob([u8], { type: mimeOf(u8, meta.format) })]); bytes += u8.length; n++; trackRange(rg, z, x, y);
      if (batch.length >= 250) { await putTiles(batch); batch = []; progress('Mengimpor peta offline…', n / total, `${n.toLocaleString('id-ID')} / ${total.toLocaleString('id-ID')} tile`); await yieldUI(); }
    }
    st.free(); if (batch.length) await putTiles(batch);
    if (!n) throw new Error('kosong');
    let bounds = meta.bounds ? String(meta.bounds).split(',').map(Number) : null;
    if (!bounds || bounds.length !== 4 || bounds.some(v => !isFinite(v))) bounds = boundsFrom(rg);
    return { name: meta.name || file.name.replace(/\.mbtiles$/i, ''), minzoom: rg.minz, maxzoom: rg.maxz, bounds, count: n, bytes };
  } finally { db.close(); }
}
async function importTileZip(file, id) {
  progress('Membaca ZIP…', 0, file.name);
  const tail = new DataView(await file.slice(Math.max(0, file.size - 65557)).arrayBuffer());
  let eocd = -1; for (let i = tail.byteLength - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('bukan zip');
  const cdSize = tail.getUint32(eocd + 12, true), cdOff = tail.getUint32(eocd + 16, true);
  if (cdOff === 0xffffffff) throw new Error('zip64');
  const cd = new DataView(await file.slice(cdOff, cdOff + cdSize).arrayBuffer()), dec = new TextDecoder();
  const entries = []; let p = 0;
  while (p + 46 <= cd.byteLength && cd.getUint32(p, true) === 0x02014b50) {
    const method = cd.getUint16(p + 10, true), csize = cd.getUint32(p + 20, true), nlen = cd.getUint16(p + 28, true), xlen = cd.getUint16(p + 30, true), clen = cd.getUint16(p + 32, true), loff = cd.getUint32(p + 42, true);
    const name = dec.decode(new Uint8Array(cd.buffer, p + 46, nlen));
    const m = name.match(/(?:^|\/)(\d{1,2})\/(\d+)\/(\d+)\.(png|jpe?g|webp)$/i);
    if (m) entries.push({ z: +m[1], x: +m[2], y: +m[3], method, csize, loff, ext: m[4].toLowerCase() });
    p += 46 + nlen + xlen + clen;
  }
  if (!entries.length) throw new Error('kosong');
  const rg = newRange(); let n = 0, bytes = 0, batch = [];
  for (const e of entries) {
    if (e.method !== 0 && e.method !== 8) continue;
    const lh = new DataView(await file.slice(e.loff, e.loff + 30).arrayBuffer());
    const start = e.loff + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
    let blob = file.slice(start, start + e.csize);
    if (e.method === 8) blob = await new Response(blob.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob();
    blob = new Blob([blob], { type: e.ext === 'png' ? 'image/png' : e.ext === 'webp' ? 'image/webp' : 'image/jpeg' });
    batch.push([`${id}/${e.z}/${e.x}/${e.y}`, blob]); bytes += blob.size; n++; trackRange(rg, e.z, e.x, e.y);
    if (batch.length >= 250) { await putTiles(batch); batch = []; progress('Mengimpor peta offline…', n / entries.length, `${n.toLocaleString('id-ID')} / ${entries.length.toLocaleString('id-ID')} tile`); await yieldUI(); }
  }
  if (batch.length) await putTiles(batch);
  if (!n) throw new Error('kosong');
  return { name: file.name.replace(/\.zip$/i, ''), minzoom: rg.minz, maxzoom: rg.maxz, bounds: boundsFrom(rg), count: n, bytes };
}
$('mapIn').addEventListener('change', async ev => {
  const file = ev.target.files[0]; ev.target.value = ''; if (!file) return;
  const id = rid(); closeFloating();
  try {
    const head = new Uint8Array(await file.slice(0, 16).arrayBuffer());
    const isSqlite = new TextDecoder().decode(head).startsWith('SQLite format 3'), isZip = head[0] === 0x50 && head[1] === 0x4b;
    if (!isSqlite && !isZip) throw new Error('format');
    const info = isSqlite ? await importMBTiles(file, id) : await importTileZip(file, id);
    const m = { id, ...info, created: Date.now() };
    await pdbPut('maps', id, m); MAPS = await pdbAll('maps');
    progressEnd(); setBase('off:' + id); showTab('map'); zoomToMap(m);
    toast(`Peta offline siap: ${m.count.toLocaleString('id-ID')} tile, zoom ${m.minzoom}–${m.maxzoom}`);
  } catch (e) {
    progressEnd(); await deleteMap(id, true);
    toast(e.message === 'format' || e.message === 'bukan zip' ? 'Pilih file .mbtiles atau .zip berisi folder tile {z}/{x}/{y}.' : e.message === 'zip64' ? 'ZIP terlalu besar (ZIP64). Pakai MBTiles atau pecah per tingkat zoom.' : e.message === 'kosong' ? 'Tidak ada tile di file ini.' : 'Gagal mengimpor peta: ' + (e.message || e));
  }
});
async function deleteMap(id, silent) {
  await pdbDo('tiles', 'readwrite', st => st.delete(IDBKeyRange.bound(id + '/', id + '/￿'))).catch(() => {});

function updateNet() { $('netDot').classList.toggle('on', navigator.onLine); $('netDot').title = navigator.onLine ? 'Online' : 'Offline'; }
window.addEventListener('online', updateNet); window.addEventListener('offline', updateNet);
let updateReady = false;
function safeToReload() { const a = document.activeElement; return !REC && !DRAW && !EDIT && !SHEET && !NAV && $('progress').hidden && !(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); }

  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('message', ev => { if (ev.data && ev.data.type === 'updated') onUpdateReady(); });
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) onUpdateReady(); });
  navigator.serviceWorker.register('sw.js').catch(() => {});
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
  window.addEventListener('online', checkUpdate);
  setInterval(checkUpdate, 15 * 60 * 1000);
}
