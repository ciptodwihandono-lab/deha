<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Survei KEHATI</title>
<meta name="description" content="Survei keanekaragaman hayati di lapangan: pencatatan berbagai taksa, foto bertitik koordinat, peta, luasan, analisis indeks, dan deskripsi habitat dengan AI. Bekerja tanpa sinyal.">
<meta name="theme-color" content="#23443a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
/* Satu kolom untuk HP: bar atas tipis, navigasi lima tab di bawah, tombol kamera mengambang. */
:root {
  --bg: #eceee8; --surface: #ffffff; --surface-2: #f4f6f1; --fg: #17221c; --muted: #58665d; --line: #cfd7cf;
  --accent: #2b6a4f; --accent-fg: #ffffff; --accent-soft: #dcebe2; --tide: #2a6f8c; --ok: #2b7a4b; --warn: #a8670f; --bad: #b03636;
  --bar: #23443a; --bar-fg: #eef5f1; --shadow: 0 1px 2px rgba(20, 40, 30, .08);
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
  --font-data: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --r: 10px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101411; --surface: #19201b; --surface-2: #212a23; --fg: #e3ece5; --muted: #9fb0a4; --line: #334036;
    --accent: #6cc39a; --accent-fg: #0f1a14; --accent-soft: #23392d; --tide: #7cc0dc; --ok: #8fd19e; --warn: #e6b45c; --bad: #ff8a7a;
    --bar: #19201b; --bar-fg: #e3ece5; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101411; --surface: #19201b; --surface-2: #212a23; --fg: #e3ece5; --muted: #9fb0a4; --line: #334036;
  --accent: #6cc39a; --accent-fg: #0f1a14; --accent-soft: #23392d; --tide: #7cc0dc; --ok: #8fd19e; --warn: #e6b45c; --bad: #ff8a7a;
  --bar: #19201b; --bar-fg: #e3ece5; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px)); }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--tide); outline-offset: 2px; }
.topbar { position: sticky; top: 0; z-index: 1000; background: var(--bar); color: var(--bar-fg); padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.topbar .back { background: none; border: 0; color: inherit; padding: 6px 8px 6px 0; font-size: 22px; line-height: 1; cursor: pointer; }
.topbar h1 { font-size: 17px; margin: 0; font-weight: 650; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .sub { display: block; font-size: 12px; font-weight: 400; opacity: .8; overflow: hidden; text-overflow: ellipsis; }
.pill { font-size: 12px; padding: 3px 8px; border-radius: 999px; border: 1px solid currentColor; opacity: .9; white-space: nowrap; }
.iconbtn { background: none; border: 1px solid color-mix(in srgb, var(--bar-fg) 40%, transparent); color: var(--bar-fg); border-radius: 8px; padding: 5px 9px; font-size: 13px; cursor: pointer; }
.bar2 { flex-basis: 100%; margin: 4px -16px -10px; display: flex; align-items: center; gap: 10px; color: #fff; padding: 8px 16px; font-size: 14px; font-weight: 600; }
.bar2.upd { background: var(--tide); } .bar2.live { background: #9b2f2f; }
.bar2 .grow { flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.bar2 button:not(.grow) { background: #fff; color: #222; border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 700; cursor: pointer; }
.bar2 .dot { width: 10px; height: 10px; border-radius: 50%; background: #fff; animation: blink 1.2s infinite; flex: none; }
@keyframes blink { 50% { opacity: .25; } }
main { max-width: 760px; margin: 0 auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 16px; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs button { background: none; border: 0; padding: 8px 2px 9px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); cursor: pointer; min-height: 58px; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 650; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; font-weight: 650; }
h3 { font-size: 17px; margin: 0; text-wrap: balance; }
.section { display: flex; flex-direction: column; gap: 10px; }
.note { font-size: 14px; color: var(--muted); margin: 0; }
.legend { font-size: 13px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.legend summary { cursor: pointer; color: var(--fg); font-weight: 600; }
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; width: 100%; cursor: pointer; min-height: 56px; }
.item:first-child { border-top: 0; }
.item:active { background: var(--surface-2); }
.item .main { flex: 1; min-width: 0; }
.item .t { font-weight: 600; overflow-wrap: anywhere; }
.item .s { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.item .sci { font-style: italic; }
.dotc { width: 14px; height: 14px; border-radius: 50%; flex: none; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
.count { font-family: var(--font-data); font-size: 14px; font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; white-space: nowrap; }
.tag.iucn { background: #f5e1d6; color: #8a3a12; } .tag.p { background: #dbe7f6; color: #1f4f8a; } .tag.ai { background: var(--accent-soft); color: var(--accent); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.w { grid-column: 1 / -1; }
.field > label, .field > .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
.field .hint { font-size: 12px; color: var(--muted); }
input[type=text], input[type=number], input[type=date], input[type=time], input[type=search], select, textarea { width: 100%; min-height: 46px; padding: 10px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); min-width: 0; }
textarea { min-height: 70px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; background: var(--surface); }
.combo { display: flex; gap: 6px; } .combo input { flex: 1; }
.mini { flex: none; border: 1px solid var(--accent); color: var(--accent); background: var(--surface); border-radius: 8px; padding: 0 12px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 46px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 8px 12px; min-height: 40px; font-size: 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.chip .sw { width: 10px; height: 10px; border-radius: 50%; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); font-weight: 650; cursor: pointer; text-align: center; }
.btn.ghost { background: var(--surface); color: var(--accent); }
.btn.danger { background: var(--surface); color: var(--bad); border-color: var(--bad); }
.btn.danger.armed, .btn.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.sm { min-height: 38px; padding: 6px 12px; font-size: 14px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .55; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 16px; text-align: center; color: var(--muted); font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; min-width: 0; }
.stat .v { font-family: var(--font-data); font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .x { font-size: 12px; font-weight: 600; color: var(--accent); }
.timebox { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.timebox .tb { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.timebox .tb .k { font-size: 12px; color: var(--muted); font-weight: 600; }
.timebox .tb input { min-height: 40px; font-family: var(--font-data); font-size: 18px; font-weight: 700; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: top; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { font-size: 12px; color: var(--muted); font-weight: 600; }
.tbl td i { color: var(--muted); font-size: 12px; }
.tbl tr.tot td { font-weight: 700; }
.scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 8px; }
.bars { display: flex; flex-direction: column; gap: 6px; }
.bars .b { display: grid; grid-template-columns: minmax(90px, 38%) 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
.bars .b span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .b .m { height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bars .b .m i { display: block; height: 100%; background: var(--accent); }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.photos button { padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; aspect-ratio: 1; background: var(--surface-2); cursor: pointer; }
.photos img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photos .missing { font-size: 11px; color: var(--muted); padding: 4px; display: grid; place-items: center; height: 100%; text-align: center; }
.suggest { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--accent); border-radius: 8px; overflow: hidden; max-height: 290px; overflow-y: auto; }
.suggest button { border: 0; border-top: 1px solid var(--line); background: none; text-align: left; padding: 9px 11px; cursor: pointer; }
.suggest button:first-child { border-top: 0; }
.suggest button i { color: var(--muted); font-size: 13px; }
.aibox { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; display: flex; flex-direction: column; gap: 8px; }
.fab { position: fixed; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 1001; width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-fg); box-shadow: 0 4px 14px rgba(0,0,0,.3); display: grid; place-items: center; cursor: pointer; }
.fab svg { width: 30px; height: 30px; }
.pmth { width: 64px; height: 64px; flex: none; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; padding: 0; background: var(--surface-2); cursor: pointer; align-self: flex-start; }
.pmth img { width: 100%; height: 100%; object-fit: cover; display: block; }
.idhead { display: flex; gap: 12px; align-items: center; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px; padding: 10px; font-size: 15px; }
.idhead img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; flex: none; }
.idsug { cursor: default; align-items: flex-start; }
.idsug img, .idsug .ph0 { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; flex: none; background: var(--surface-2); border: 1px solid var(--line); }
.idsug .meter { display: block; height: 6px; border-radius: 3px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.idsug .meter i { display: block; height: 100%; background: var(--accent); }
.idsug .btn { align-self: center; }
.dest { background: var(--surface-2); border: 1px solid var(--accent); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.dest .btn { justify-content: flex-start; text-align: left; }
.kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; padding: 0; cursor: pointer; text-align: left; display: flex; flex-direction: column; }
.kcard .kimg { aspect-ratio: 1; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.kcard .kimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.kcard .kt { padding: 8px 10px; font-size: 13px; }
.kcard .kt b { display: block; font-size: 14px; overflow-wrap: anywhere; }
body.v-obs .fab { bottom: calc(146px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; }
#mapWrap { position: fixed; left: 0; right: 0; top: var(--top, 56px); bottom: calc(58px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
#map { position: absolute; inset: 0; background: #cfd8d3; }
.mapctl { position: absolute; z-index: 800; left: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
.mapctl button { width: 42px; height: 42px; display: grid; place-items: center; padding: 0; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; box-shadow: var(--shadow); }
.mapctl button svg { width: 22px; height: 22px; }
.mapctl .mtools { display: flex; flex-direction: column; gap: 6px; }
.mapctl #mMenu[aria-expanded="true"] { background: var(--accent-soft); }
.mapctl button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.mapinfo { position: absolute; z-index: 800; left: 10px; right: 90px; bottom: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; box-shadow: var(--shadow); }
.mapinfo:empty { display: none; }
.pin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
.pin.cam { width: 24px; height: 24px; display: grid; place-items: center; background: #fff; color: #222; }
.pin.cam svg { width: 14px; height: 14px; }
.me { width: 16px; height: 16px; border-radius: 50%; background: #2a7fff; border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
.vtx { width: 14px; height: 14px; border-radius: 50%; background: #ffd23f; border: 2px solid #333; }
/* Titik buatan pengguna (waypoint) dan peta yang bisa diputar */
.wp { position: relative; width: 16px; height: 16px; transform: rotate(var(--mrinv, 0deg)); }
.wp i { position: absolute; inset: 0; background: var(--c, #e63946); border: 2px solid #fff; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: 0 0 0 1px rgba(0,0,0,.45); }
.wp span { position: absolute; left: 20px; top: -2px; white-space: nowrap; font: 700 12px/1.2 system-ui, sans-serif; color: #111; background: rgba(255,255,255,.88); padding: 1px 5px; border-radius: 5px; box-shadow: 0 0 0 1px rgba(0,0,0,.2); }
#map .leaflet-popup-content-wrapper { transform: rotate(var(--mrinv, 0deg)); transform-origin: 50% calc(100% + 20px); }
#map .leaflet-popup-tip-container { transform: rotate(var(--mrinv, 0deg)); transform-origin: 50% 100%; }
.wpop { display: flex; flex-direction: column; gap: 6px; min-width: 210px; }
.wpop input, .wpop textarea { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); width: 100%; box-sizing: border-box; }
.wpop textarea { min-height: 48px; resize: vertical; }
.wpop .row { display: flex; gap: 6px; flex-wrap: wrap; }
.wpop .cols { display: flex; gap: 4px; }
.wpop .cols button { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35); cursor: pointer; padding: 0; }
#mNorth { position: absolute; z-index: 800; right: 10px; top: 92px; width: 42px; height: 42px; display: grid; place-items: center; padding: 0; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 50%; cursor: pointer; box-shadow: var(--shadow); }
#mNorth svg { width: 26px; height: 26px; transition: transform .08s linear; }
#mNorth.follow { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.rotbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.rotbar input[type=range] { flex: 1 1 120px; min-width: 100px; }
.viewer { position: fixed; inset: 0; z-index: 2000; background: #000; display: flex; flex-direction: column; }
.viewer img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
.viewer .vbar { display: flex; gap: 8px; align-items: center; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); color: #fff; font-size: 13px; flex-wrap: wrap; }
.viewer .vbar .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.viewer .vbar button { background: none; color: #fff; border: 1px solid rgba(255,255,255,.6); border-radius: 8px; padding: 8px 12px; font-weight: 650; cursor: pointer; }
.viewer .vbar button.armed { background: #c0392b; border-color: #c0392b; }
.progress { position: fixed; inset: 0; z-index: 2100; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; }
.progress .pbox { background: var(--surface); border-radius: 12px; padding: 16px; width: min(360px, 100%); display: flex; flex-direction: column; gap: 8px; }
.progress .pbar { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.progress .pbar i { display: block; height: 100%; width: 0; background: var(--accent); }
.toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 2200; max-width: calc(100% - 32px); box-shadow: 0 4px 14px rgba(0,0,0,.2); }
.sticky-actions { position: sticky; bottom: calc(68px + env(safe-area-inset-bottom, 0px)); background: var(--bg); padding-block: 8px; display: flex; gap: 8px; flex-wrap: wrap; z-index: 3; }
.sticky-actions .btn { flex: 1 1 140px; }
.taxgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.taxgrid button { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; min-height: 72px; }
.taxgrid button .n { font-family: var(--font-data); font-size: 12px; color: var(--muted); font-weight: 500; }
@media (max-width: 420px) { .fields { grid-template-columns: 1fr; } .stats { grid-template-columns: 1fr 1fr; } }
@media print { .topbar, nav.tabs, .fab, .no-print, .toast { display: none !important; } body { padding: 0; background: #fff; color: #000; } main { max-width: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="topbar" id="topbar">
  <button class="back" id="backBtn" type="button" aria-label="Kembali" hidden>&#8592;</button>
  <h1 id="title">Survei KEHATI</h1>
  <span class="pill" id="net">Offline</span>
  <button class="iconbtn" id="themeBtn" type="button" aria-label="Ganti tema">Tema</button>
  <div class="bar2 live" id="livebar" hidden><span class="dot" aria-hidden="true"></span><button type="button" class="grow" id="liveOpen">Survei berjalan</button><button type="button" id="liveStop">Selesai</button></div>
  <div class="bar2 upd" id="installbar" hidden><span class="grow">Pasang Survei KEHATI sebagai aplikasi di HP ini.</span><button type="button" id="installBtn">Pasang</button><button type="button" id="installX" aria-label="Tutup" style="background:none;color:#fff;padding:6px 4px">✕</button></div>
  <div class="bar2 upd" id="updbar" hidden><span class="grow">Versi baru aplikasi sudah siap.</span><button type="button" id="updBtn">Perbarui</button></div>
</header>

$('app').addEventListener('click', async ev => {

  const o = view.v === 'obs' && s ? s.obs[view.id] : null;
  const a = b.dataset.a;
  const toggle = (obj, k, v) => { const l = asList(obj[k]); obj[k] = l.includes(v) ? l.filter(x => x !== v) : [...l, v]; b.setAttribute('aria-pressed', obj[k].includes(v)); };
  if (b.dataset.met != null && s) { toggle(s, 'metode', b.dataset.v); touch(s); return; }
  if (b.dataset.amode != null && s) { s.area.mode = b.dataset.amode; touch(s); render(); return; }
  if (o) {
    if (b.dataset.det != null) { toggle(o, 'det', b.dataset.v); touch(s); return; }
    if (b.dataset.akt != null) { toggle(o, 'akt', b.dataset.v); touch(s); return; }
    if (b.dataset.hab != null) { toggle(o, 'hab', b.dataset.v); touch(s); return; }
    if (b.dataset.ting != null) { o.tingkat = o.tingkat === b.dataset.v ? '' : b.dataset.v; touch(s); render(); return; }
    if (b.dataset.tax != null) { o.tax = b.dataset.tax; if (o.jumlah === '') o.jumlah = 1; OBS_DETAIL = true; touch(s); render(); return; }
    if (b.dataset.pick) { const x = SP_BY_SCI[b.dataset.pick] || (INAT.cache[b.dataset.pick] && inatAdopt(INAT.cache[b.dataset.pick])); if (x) { pickSpecies(o, x); if (o.jumlah === '') o.jumlah = 1; touch(s); render(); } return; }
    if (b.dataset.ph) { openViewer(b.dataset.ph); return; }
  }
  if (b.dataset.sel) { if (!SP_BY_SCI[b.dataset.sel] && INAT.cache[b.dataset.sel]) inatAdopt(INAT.cache[b.dataset.sel]); go({ v: 'sp', id: b.dataset.sel }); return; }
  switch (a) {
    case 'newsurvey': { const ns = newSurvey(); go({ v: 'survey', id: ns.id }); break; }
    case 'startnew': { const ns = newSurvey(); go({ v: 'survey', id: ns.id }); await startSurvey(ns); const el = document.querySelector('[data-s=lokasi]'); if (el && !el.value) el.focus(); break; }

    case 'gantijenis': Object.assign(o, { sp: '', nama: '', ilmiah: '', famili: '', hint: o.tax !== 'foto' ? o.tax : o.hint, tax: 'foto' }); touch(s); render(); setTimeout(() => { const el = $('spIn'); if (el) el.focus(); }, 60); break;
    case 'minus': case 'plus': { o.jumlah = Math.max(0, (+o.jumlah || 0) + (a === 'plus' ? 1 : -1)); const el = document.querySelector('[data-o=jumlah]'); if (el) el.value = o.jumlah; touch(s); break; }

    case 'stop': stopSurvey(s); break;
    case 'drawarea': MAP.focus = s.id; go({ v: 'peta' }); setTimeout(() => startDraw(s), 50); break;
    case 'mapsurvey': MAP.focus = s.id; go({ v: 'peta' }); break;

/* ================= Identifikasi jenis dari foto (BioCLIP, seperti saran iNaturalist) =================

   Foto diubah menjadi vektor, lalu dibandingkan dengan vektor nama setiap jenis Indonesia

   dengan persentase keyakinan; bila jenis belum pasti tetapi genusnya jelas, genus itu disarankan.
   Model (±90 MB) dan data (±30 MB) diunduh sekali dari situs aplikasi ini, lalu bekerja tanpa sinyal. */

  return (ID.index = await r.json());

let idModelP = null;
function idModel(onProg) {
  if (window.__idMock) return Promise.resolve(window.__idMock);
  if (!idModelP) {
    idModelP = (async () => {
      let T;

      T.env.allowLocalModels = true; T.env.localModelPath = new URL('model/', location.href).href;
      T.env.backends.onnx.wasm.wasmPaths = new URL('vendor/ai/', location.href).href;
      if (!self.crossOriginIsolated) T.env.backends.onnx.wasm.numThreads = 1;
      const files = {};
      const opt = { dtype: 'q8', local_files_only: true, progress_callback: p => {
        if (!onProg || !p || !p.file) return;
        if (p.status === 'progress' || p.status === 'done') files[p.file] = [p.loaded || (files[p.file] || [0, 0])[1], p.total || (files[p.file] || [0, 0])[1]];
        let a = 0, b = 0; Object.values(files).forEach(([l, t]) => { a += l; b += t; }); if (b) onProg(a, b);
      } };
      try {
        const [proc, vis] = await Promise.all([T.AutoProcessor.from_pretrained('bioclip', opt), T.CLIPVisionModelWithProjection.from_pretrained('bioclip', opt)]);
        return { async image(blob) { const { image_embeds: e } = await vis(await proc(await T.RawImage.fromBlob(blob))); return Array.from(e.data); } };
      } catch (e) { console.warn(e); throw new Error(navigator.onLine ? 'id-unduh' : 'id-hilang'); }

}
async function idEmb(tax) {
  if (ID.emb[tax]) return ID.emb[tax];
  const r = await fetch(`data/emb-${tax}.bin`).catch(() => null);
  if (!r || !r.ok) throw new Error(navigator.onLine ? 'id-unduh' : 'id-hilang');
  const buf = await r.arrayBuffer(), dv = new DataView(buf);
  if (String.fromCharCode(dv.getUint8(0), dv.getUint8(1), dv.getUint8(2), dv.getUint8(3)) !== 'KEMB') throw new Error('id-unduh');
  const N = dv.getUint32(4, true), D = dv.getUint32(8, true);
  return (ID.emb[tax] = { N, D, scale: new Float32Array(buf, 12, N), q: new Int8Array(buf, 12 + 4 * N, N * D) });
}
function idErrMsg(e) {
  const m = e && e.message;
  return { 'id-belum': 'Data identifikasi belum tersedia di versi aplikasi ini. Tekan "Periksa pembaruan" di tab Data nanti.',
    'id-unduh': 'Data identifikasi gagal diunduh. Coba lagi dengan Wi-Fi yang lebih stabil.',
    'id-hilang': 'Data identifikasi belum lengkap di HP ini. Unduh di tab Data saat ada sinyal.',
    'lokal-pustaka': 'Pustaka AI belum tersimpan di HP. Buka tab Data saat ada sinyal.' }[m] || 'Identifikasi gagal.';
}
/* Bandingkan foto dengan semua jenis pada taksa terpilih; peluang = softmax(kemiripan × skala logit BioCLIP). */
async function identify(blob, taxList) {
  await loadSpeciesData();
  const idx = await idIndex(), m = await idModel(), v = ailNorm(await m.image(blob)), ls = idx.logit_scale || 100;
  const beta = idx.prior_beta || 0;   // bobot 'jenis umum di Indonesia' (dipilih dari uji ketepatan), seperti 'teramati di sekitar' iNaturalist
  const cand = [];
  for (const tax of taxList) {
    if (!idx.taksa || !idx.taksa[tax]) continue;
    const E = await idEmb(tax), rows = SP_ROWS[tax] || [];
    if (rows.length !== E.N) { console.warn('jumlah jenis tidak cocok', tax, rows.length, E.N); continue; }
    for (let i = 0; i < E.N; i++) { let d = 0; const o = i * E.D; for (let j = 0; j < E.D; j++) d += E.q[o + j] * v[j]; const x = rows[i]; cand.push([d * E.scale[i] * ls + (beta ? beta * Math.log1p((x.c || 0) + 3 * (x.ci || 0)) : 0), x]); }
  }
  if (!cand.length) throw new Error('id-belum');
  cand.sort((a, b) => b[0] - a[0]);
  const top = cand.slice(0, 300), mx = top[0][0]; let sum = 0;
  top.forEach(t => { t[2] = Math.exp(t[0] - mx); sum += t[2]; });
  const list = top.map(t => ({ x: t[1], p: t[2] / sum }));
  const gen = {}; list.forEach(({ x, p }) => { const g = x.s.split(' ')[0]; gen[g] = (gen[g] || 0) + p; });
  const [g, gp] = Object.entries(gen).sort((a, b) => b[1] - a[1])[0];
  const genus = list[0].p < 0.5 && gp >= 0.6 && list.slice(0, 10).filter(r => r.x.s.split(' ')[0] === g).length > 1 ? { g, p: gp, f: list.find(r => r.x.s.startsWith(g + ' ')).x.f } : null;
  return { list: list.slice(0, 10), genus };
}
async function runIdentify(blob, taxList, target) {

  toast('AI mengenali jenis di foto…');

}

async function idDownload() {

  try {
    ID.index = null; const idx = await idIndex();

/* ================= Cari jenis langsung di iNaturalist (saat ada sinyal) =================
   Bila nama yang diketik tidak ada (atau sedikit) di daftar di HP, aplikasi mencari di iNaturalist
   (nama Indonesia diutamakan). Jenis yang dipilih disimpan di HP sehingga berikutnya bisa dicari tanpa sinyal. */
const INAT_PLACE = 6966;   // Indonesia di iNaturalist
const INAT_SAVED = AI_APP + '-jenis-inat';

  if (a.includes(47224)) return 'kupu';       // Papilionoidea (kupu-kupu)

}
function inatEntry(t) {

  const tax = inatTax(t);
  return { id: tax + ':' + sci, tax, n: (t.preferred_common_name || '').trim() || sci, s: sci, f: '', iucn: '', p: false, en: t.english_common_name || '', ph: (t.default_photo || {}).square_url || '', inat: t.id, ci: t.observations_count || 0, remote: true };
}
function inatLoadSaved() {
  let list = []; try { list = JSON.parse(localStorage.getItem(INAT_SAVED) || '[]'); } catch (e) {}
  for (const x of list) if (!SP_BY_SCI[x.id]) { x.remote = false; x.g = 1; SPECIES.push(x); SP_BY_SCI[x.id] = x; }
}
function inatAdopt(x) {
  if (SP_BY_SCI[x.id]) return SP_BY_SCI[x.id];
  const y = Object.assign({}, x, { remote: false, g: 1 }); delete y._q;
  SPECIES.push(y); SP_BY_SCI[y.id] = y;
  try { const list = JSON.parse(localStorage.getItem(INAT_SAVED) || '[]'); list.push(y); localStorage.setItem(INAT_SAVED, JSON.stringify(list.slice(-3000))); } catch (e) {}
  // Famili dilengkapi di latar belakang dari silsilah takson iNaturalist.
  if (navigator.onLine && y.inat) fetch(`https://api.inaturalist.org/v1/taxa/${y.inat}?locale=id&preferred_place_id=${INAT_PLACE}`).then(r => r.json()).then(d => {
    const t = (d.results || [])[0]; const fam = t && (t.ancestors || []).find(a => a.rank === 'family');
    if (!fam) return; y.f = fam.name; y._q = '';
    try { const list = JSON.parse(localStorage.getItem(INAT_SAVED) || '[]').map(z => z.id === y.id ? Object.assign(z, { f: fam.name }) : z); localStorage.setItem(INAT_SAVED, JSON.stringify(list)); } catch (e) {}
    for (const s of Object.values(S.surveys)) for (const o of Object.values(s.obs)) if (o.sp === y.id && !o.famili) { o.famili = fam.name; touch(s); }
    if (view.v === 'obs') { const el = document.querySelector('[data-o="famili"]'); if (el && !el.value) el.value = fam.name; }
  }).catch(() => {});

/* Pencarian tertunda 400 ms setelah berhenti mengetik; hasilnya memanggil onDone untuk menggambar ulang. */
function inatSearch(q, onDone) {

  if (INAT.q === q && !INAT.busy) return;

    if (INAT.ctl) INAT.ctl.abort(); INAT.ctl = new AbortController(); INAT.busy = true; INAT.q = q;

    const m = { id, ...info, src: file.name, size: file.size, created: Date.now() };
    progress('Menyimpan…', 1, '');
    m.thumb = await makeThumb(m).catch(() => null);
    await pdbPut('maps', id, m); MAPS = await pdbAll('maps');
    progressEnd(); openMap(m);
    toast(`Peta siap dipakai tanpa sinyal: ${m.name} (zoom ${m.minzoom}–${m.maxzoom}, ${fmtMB(m.bytes)})`);
  } catch (e) {
    progressEnd(); await deleteMap(id, true);
    const msg = String(e && e.message || e), k = msg.split(':')[0];
    toast(k === 'tifcrs' ? `Sistem koordinat GeoTIFF (EPSG:${msg.split(':')[1]}) belum didukung. Warp ulang ke WGS 84 / UTM di QGIS.` : IMPORT_ERR[k] || 'Gagal mengimpor peta: ' + msg);
  }
}
async function deleteMap(id, silent) {
  await pdbDo('tiles', 'readwrite', st => st.delete(IDBKeyRange.bound(id + '/', id + '/￿'))).catch(() => {});
  await pdbDel('maps', id).catch(() => {});
  MAPS = await pdbAll('maps').catch(() => []);
  if (!silent && base.kind === 'off:' + id) setBase('sat');
}

/* ================= Baca foto dengan AI (Claude) =================
   Per objek: foto-foto titik itu (maks. 4 terbaru, diperkecil ke 1280 px) dikirim bersama ke Claude
   (Anthropic) beserta habitat dan vegetasi yang sudah diisi surveyor, lalu hasilnya mengisi Deskripsi
   habitat, Vegetasi (bila kosong), dan Catatan. Teks yang diketik surveyor tidak ditimpa; teks AI lama

/* ---------- Tampilan Peta Saya ---------- */
let mapThumbURLs = [];
async function renderPetaSaya() {
  setTitle('Peta Saya', `${MAPS.length} peta tersimpan`);
  mapThumbURLs.forEach(u => URL.revokeObjectURL(u)); mapThumbURLs = [];
  const act = activeOffline();
  const list = MAPS.slice().sort((a, b) => (b.created || 0) - (a.created || 0));
  $('app').innerHTML = `
    <section class="section">
      <button type="button" class="btn block" data-pm="import">+ Impor peta (PDF / GeoTIFF / KMZ / MBTiles)</button>
      <p class="note">Seperti Avenza Maps: impor <b>GeoPDF</b> (PDF bergeoreferensi dari QGIS, ArcGIS, peta RBI/BIG, atau peta Avenza), GeoTIFF (ortofoto drone, citra satelit), KMZ (Google Earth), MBTiles, atau ZIP tile. Peta disimpan di HP dan bisa dipakai tanpa sinyal: posisi GPS, titik temuan, jalur, dan batas luasan tampil di atasnya.</p>
    </section>
    <section class="section"><h2>Peta tersimpan (${MAPS.length})</h2>
      ${list.length ? `<div class="list">${list.map(m => `<div class="item" style="cursor:default">
        <button type="button" class="pmth" data-pm="open" data-id="${m.id}" data-thumb="${m.id}" aria-label="Buka ${esc(m.name)}"></button>
        <span class="main"><span class="t">${esc(m.name)}${act && act.id === m.id ? ' <span class="tag ai">dipakai</span>' : ''}</span><br>
          <span class="s">${esc(KIND_LABEL[m.kind] || 'Peta offline')} · zoom ${m.minzoom}–${m.maxzoom} · ${fmtMB(m.bytes || 0)}${m.created ? ' · ' + fmtDate(isoDate(m.created / 1000)) : ''}</span>
          <span class="row" style="margin-top:6px"><button type="button" class="btn sm" data-pm="open" data-id="${m.id}">Buka di peta</button>${act && act.id === m.id ? `<button type="button" class="btn sm ghost" data-pm="off">Lepas</button>` : ''}<button type="button" class="btn sm ghost" data-pm="ren" data-id="${m.id}">Ganti nama</button><button type="button" class="btn sm danger" data-pm="del" data-id="${m.id}">Hapus</button></span></span></div>`).join('')}</div>`
        : '<div class="empty">Belum ada peta. Tekan "Impor peta" lalu pilih file GeoPDF, GeoTIFF, KMZ, atau MBTiles dari HP.</div>'}
    </section>
    <details class="legend"><summary>Cara menyiapkan peta PDF (GeoPDF)</summary><ol style="padding-left:20px;margin:8px 0">
      <li><b>QGIS</b>: susun peta di Layout → Export as PDF → centang <b>Create Geospatial PDF (GeoPDF)</b>. Untuk citra/drone: klik kanan layer → Export → Save As… format GeoTIFF.</li>
      <li><b>ArcGIS Pro</b>: Share → Export Layout → PDF, centang <b>Export georeference information</b>.</li>
      <li>Peta RBI dan peta tematik GeoPDF dari instansi, serta peta yang biasa dipakai di Avenza, bisa langsung diimpor.</li>
      <li>PDF biasa tanpa georeferensi (hasil scan/print biasa) tidak bisa diletakkan di posisi yang benar; ekspor ulang sebagai GeoPDF.</li>
      <li>Kirim file ke HP (kabel USB, Google Drive, atau WhatsApp sebagai <i>dokumen</i>), lalu "Impor peta".</li>
      <li>Ukuran: impor dibatasi ±${Math.round(PX_CAP / 1e6)} juta piksel per peta; peta lebih besar diperkecil otomatis. Untuk detail tinggi di area luas, potong per blok.</li>
    </ol></details>`;
  for (const btn of document.querySelectorAll('#app [data-thumb]')) {
    const m = MAPS.find(x => x.id === btn.dataset.thumb); if (!m) continue;
    if (!m.thumb) { m.thumb = await makeThumb(m).catch(() => null); if (m.thumb) pdbPut('maps', m.id, m).catch(() => {}); }
    if (m.thumb && document.body.contains(btn)) { const u = URL.createObjectURL(m.thumb); mapThumbURLs.push(u); btn.innerHTML = `<img src="${u}" alt="">`; }
  }
}
const mapIn = document.createElement('input'); mapIn.type = 'file'; mapIn.id = 'mapIn'; mapIn.hidden = true;
mapIn.accept = '.pdf,.tif,.tiff,.kmz,.mbtiles,.zip,application/pdf,image/tiff,application/vnd.google-earth.kmz,application/zip';
document.body.appendChild(mapIn);
mapIn.addEventListener('change', async () => { const f = mapIn.files[0]; mapIn.value = ''; if (f) await importMapFile(f); });
$('app').addEventListener('click', async ev => {
  const b = ev.target.closest('[data-pm]'); if (!b) return;
  const a = b.dataset.pm, m = MAPS.find(x => x.id === b.dataset.id);
  if (a === 'import') mapIn.click();
  else if (a === 'open' && m) openMap(m);
  else if (a === 'off') { useOfflineMap(null); renderPetaSaya(); toast('Peta offline dilepas; kembali ke peta dasar.'); }
  else if (a === 'ren' && m) { const n = prompt('Nama peta', m.name); if (n && n.trim()) { m.name = n.trim(); await pdbPut('maps', m.id, m); renderPetaSaya(); } }
  else if (a === 'del' && m) { if (!arm(b, 'delmap' + m.id, 'Ketuk lagi untuk menghapus')) return; await deleteMap(m.id); if (offlineId() === m.id) useOfflineMap(null); renderPetaSaya(); toast('Peta dihapus dari HP'); }
});
/* ================= Mulai ================= */
applyTheme(); updateNet(); inatLoadSaved(); loadMaps();
history.replaceState(view, '');
render();
if (activeSurvey() && activeSurvey().trackOn) startTrack(activeSurvey());
setTimeout(ailWarm, 5000);
setTimeout(aiRun, 2000);
setTimeout(loadSpeciesData, 1500);
document.addEventListener('visibilitychange', () => { if (!document.hidden) aiRun(); });
</script>
