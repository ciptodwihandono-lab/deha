<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">

<title>Survei KEHATI</title>
<meta name="description" content="Survei keanekaragaman hayati di lapangan: pencatatan berbagai taksa, foto bertitik koordinat, peta, luasan, analisis indeks, dan deskripsi habitat dengan AI. Bekerja tanpa sinyal.">

<link rel="manifest" href="manifest.webmanifest">

<style>
/* Satu kolom untuk HP: bar atas tipis, navigasi lima tab di bawah, tombol kamera mengambang. */
:root {
  --bg: #eceee8; --surface: #ffffff; --surface-2: #f4f6f1; --fg: #17221c; --muted: #58665d; --line: #cfd7cf;
  --accent: #2b6a4f; --accent-fg: #ffffff; --accent-soft: #dcebe2; --tide: #2a6f8c; --ok: #2b7a4b; --warn: #a8670f; --bad: #b03636;
  --bar: #23443a; --bar-fg: #eef5f1; --shadow: 0 1px 2px rgba(20, 40, 30, .08);
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
  --font-data: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --r: 10px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101411; --surface: #19201b; --surface-2: #212a23; --fg: #e3ece5; --muted: #9fb0a4; --line: #334036;
    --accent: #6cc39a; --accent-fg: #0f1a14; --accent-soft: #23392d; --tide: #7cc0dc; --ok: #8fd19e; --warn: #e6b45c; --bad: #ff8a7a;
    --bar: #19201b; --bar-fg: #e3ece5; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101411; --surface: #19201b; --surface-2: #212a23; --fg: #e3ece5; --muted: #9fb0a4; --line: #334036;
  --accent: #6cc39a; --accent-fg: #0f1a14; --accent-soft: #23392d; --tide: #7cc0dc; --ok: #8fd19e; --warn: #e6b45c; --bad: #ff8a7a;
  --bar: #19201b; --bar-fg: #e3ece5; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px)); }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--tide); outline-offset: 2px; }
.topbar { position: sticky; top: 0; z-index: 1000; background: var(--bar); color: var(--bar-fg); padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.topbar .back { background: none; border: 0; color: inherit; padding: 6px 8px 6px 0; font-size: 22px; line-height: 1; cursor: pointer; }
.topbar h1 { font-size: 17px; margin: 0; font-weight: 650; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .sub { display: block; font-size: 12px; font-weight: 400; opacity: .8; overflow: hidden; text-overflow: ellipsis; }
.pill { font-size: 12px; padding: 3px 8px; border-radius: 999px; border: 1px solid currentColor; opacity: .9; white-space: nowrap; }
.iconbtn { background: none; border: 1px solid color-mix(in srgb, var(--bar-fg) 40%, transparent); color: var(--bar-fg); border-radius: 8px; padding: 5px 9px; font-size: 13px; cursor: pointer; }
.bar2 { flex-basis: 100%; margin: 4px -16px -10px; display: flex; align-items: center; gap: 10px; color: #fff; padding: 8px 16px; font-size: 14px; font-weight: 600; }
.bar2.upd { background: var(--tide); } .bar2.live { background: #9b2f2f; }
.bar2 .grow { flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.bar2 button:not(.grow) { background: #fff; color: #222; border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 700; cursor: pointer; }
.bar2 .dot { width: 10px; height: 10px; border-radius: 50%; background: #fff; animation: blink 1.2s infinite; flex: none; }
@keyframes blink { 50% { opacity: .25; } }
main { max-width: 760px; margin: 0 auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 16px; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs button { background: none; border: 0; padding: 8px 2px 9px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); cursor: pointer; min-height: 58px; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 650; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; font-weight: 650; }
h3 { font-size: 17px; margin: 0; text-wrap: balance; }
.section { display: flex; flex-direction: column; gap: 10px; }
.note { font-size: 14px; color: var(--muted); margin: 0; }
.legend { font-size: 13px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.legend summary { cursor: pointer; color: var(--fg); font-weight: 600; }
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; width: 100%; cursor: pointer; min-height: 56px; }
.item:first-child { border-top: 0; }
.item:active { background: var(--surface-2); }
.item .main { flex: 1; min-width: 0; }
.item .t { font-weight: 600; overflow-wrap: anywhere; }
.item .s { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.item .sci { font-style: italic; }
.dotc { width: 14px; height: 14px; border-radius: 50%; flex: none; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
.count { font-family: var(--font-data); font-size: 14px; font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; white-space: nowrap; }
.tag.iucn { background: #f5e1d6; color: #8a3a12; } .tag.p { background: #dbe7f6; color: #1f4f8a; } .tag.ai { background: var(--accent-soft); color: var(--accent); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.w { grid-column: 1 / -1; }
.field > label, .field > .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
.field .hint { font-size: 12px; color: var(--muted); }
input[type=text], input[type=number], input[type=date], input[type=time], input[type=search], select, textarea { width: 100%; min-height: 46px; padding: 10px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); min-width: 0; }
textarea { min-height: 70px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; background: var(--surface); }
.combo { display: flex; gap: 6px; } .combo input { flex: 1; }
.mini { flex: none; border: 1px solid var(--accent); color: var(--accent); background: var(--surface); border-radius: 8px; padding: 0 12px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 46px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 8px 12px; min-height: 40px; font-size: 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.chip .sw { width: 10px; height: 10px; border-radius: 50%; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); font-weight: 650; cursor: pointer; text-align: center; }
.btn.ghost { background: var(--surface); color: var(--accent); }
.btn.danger { background: var(--surface); color: var(--bad); border-color: var(--bad); }
.btn.danger.armed, .btn.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.sm { min-height: 38px; padding: 6px 12px; font-size: 14px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .55; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 16px; text-align: center; color: var(--muted); font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; min-width: 0; }
.stat .v { font-family: var(--font-data); font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .x { font-size: 12px; font-weight: 600; color: var(--accent); }
.timebox { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.timebox .tb { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.timebox .tb .k { font-size: 12px; color: var(--muted); font-weight: 600; }
.timebox .tb input { min-height: 40px; font-family: var(--font-data); font-size: 18px; font-weight: 700; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: top; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { font-size: 12px; color: var(--muted); font-weight: 600; }
.tbl td i { color: var(--muted); font-size: 12px; }
.tbl tr.tot td { font-weight: 700; }
.scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 8px; }
.bars { display: flex; flex-direction: column; gap: 6px; }
.bars .b { display: grid; grid-template-columns: minmax(90px, 38%) 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
.bars .b span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .b .m { height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bars .b .m i { display: block; height: 100%; background: var(--accent); }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.photos button { padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; aspect-ratio: 1; background: var(--surface-2); cursor: pointer; }
.photos img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photos .missing { font-size: 11px; color: var(--muted); padding: 4px; display: grid; place-items: center; height: 100%; text-align: center; }
.suggest { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--accent); border-radius: 8px; overflow: hidden; max-height: 290px; overflow-y: auto; }
.suggest button { border: 0; border-top: 1px solid var(--line); background: none; text-align: left; padding: 9px 11px; cursor: pointer; }
.suggest button:first-child { border-top: 0; }
.suggest button i { color: var(--muted); font-size: 13px; }
.aibox { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; display: flex; flex-direction: column; gap: 8px; }
.fab { position: fixed; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 1001; width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-fg); box-shadow: 0 4px 14px rgba(0,0,0,.3); display: grid; place-items: center; cursor: pointer; }
.fab svg { width: 30px; height: 30px; }
body.v-obs .fab { bottom: calc(146px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; }
#mapWrap { position: fixed; left: 0; right: 0; top: var(--top, 56px); bottom: calc(58px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
#map { position: absolute; inset: 0; background: #cfd8d3; }
.mapctl { position: absolute; z-index: 800; left: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
.mapctl button { background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; font-weight: 650; cursor: pointer; box-shadow: var(--shadow); text-align: left; }
.mapctl button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.mapinfo { position: absolute; z-index: 800; left: 10px; right: 90px; bottom: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; box-shadow: var(--shadow); }
.mapinfo:empty { display: none; }
.pin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
.pin.cam { width: 24px; height: 24px; display: grid; place-items: center; background: #fff; color: #222; }
.pin.cam svg { width: 14px; height: 14px; }
.me { width: 16px; height: 16px; border-radius: 50%; background: #2a7fff; border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
.vtx { width: 14px; height: 14px; border-radius: 50%; background: #ffd23f; border: 2px solid #333; }
.viewer { position: fixed; inset: 0; z-index: 2000; background: #000; display: flex; flex-direction: column; }
.viewer img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
.viewer .vbar { display: flex; gap: 8px; align-items: center; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); color: #fff; font-size: 13px; flex-wrap: wrap; }
.viewer .vbar .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.viewer .vbar button { background: none; color: #fff; border: 1px solid rgba(255,255,255,.6); border-radius: 8px; padding: 8px 12px; font-weight: 650; cursor: pointer; }
.viewer .vbar button.armed { background: #c0392b; border-color: #c0392b; }
.progress { position: fixed; inset: 0; z-index: 2100; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; }
.progress .pbox { background: var(--surface); border-radius: 12px; padding: 16px; width: min(360px, 100%); display: flex; flex-direction: column; gap: 8px; }
.progress .pbar { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.progress .pbar i { display: block; height: 100%; width: 0; background: var(--accent); }
.toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 2200; max-width: calc(100% - 32px); box-shadow: 0 4px 14px rgba(0,0,0,.2); }
.sticky-actions { position: sticky; bottom: calc(68px + env(safe-area-inset-bottom, 0px)); background: var(--bg); padding-block: 8px; display: flex; gap: 8px; flex-wrap: wrap; z-index: 3; }
.sticky-actions .btn { flex: 1 1 140px; }
.taxgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.taxgrid button { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; min-height: 72px; }
.taxgrid button .n { font-family: var(--font-data); font-size: 12px; color: var(--muted); font-weight: 500; }
@media (max-width: 420px) { .fields { grid-template-columns: 1fr; } .stats { grid-template-columns: 1fr 1fr; } }
@media print { .topbar, nav.tabs, .fab, .no-print, .toast { display: none !important; } body { padding: 0; background: #fff; color: #000; } main { max-width: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

  <button class="back" id="backBtn" type="button" aria-label="Kembali" hidden>&#8592;</button>

  <button type="button" data-tab="survei"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Survei</button>

<script src="vendor/leaflet.js"></script>
<script>
'use strict';
const APP_BUILD = '__BUILD__';   // diisi tanggal dan kode versi oleh workflow GitHub Pages

/* ================= Taksa, metode, dan daftar jenis acuan =================
   Daftar jenis di bawah adalah acuan awal untuk pesisir, mangrove, dan dataran rendah Indonesia barat;
   jenis lain bisa diketik bebas. Status IUCN dan perlindungan (Permen LHK P.106/2018) hanya diisi untuk
   jenis yang statusnya jelas; selalu cek ulang ke IUCN Red List dan peraturan terbaru sebelum pelaporan. */
const TAXA = [
  { k: 'burung', l: 'Burung', c: '#d9822b', det: ['Lihat', 'Dengar', 'Foto', 'Sarang'], akt: ['Makan', 'Terbang', 'Bertengger', 'Istirahat', 'Bersuara', 'Mandi', 'Bersarang', 'Kawin'] },

const $ = id => document.getElementById(id);

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

const fmtNum = (x, d = 2) => isFinite(x) ? x.toFixed(d).replace('.', ',') : '-';

const fmtCoord = (lat, lon) => `${lat.toFixed(6)}, ${lon.toFixed(6)}`;

let toastTimer;

function progress(t, frac, s) { $('progress').hidden = false; $('progT').textContent = t; $('progBar').style.width = Math.round(frac * 100) + '%'; $('progS').textContent = s || ''; }

function hav(a, b) {
  const R = 6371008.8, r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;

}

const PHOTO_Q = 0.98, THUMB_MAX = 320, THUMB_Q = 0.85;
let photoDB = null;
function pdb() {
  if (!photoDB) photoDB = new Promise((ok, fail) => {
    const r = indexedDB.open('survei-kehati-foto', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('foto'); r.result.createObjectStore('thumb'); };
    r.onsuccess = () => ok(r.result); r.onerror = () => fail(r.error);
  });

}
async function pdbDo(store, mode, fn) {
  const db = await pdb();
  return new Promise((ok, fail) => { const tx = db.transaction(store, mode); const req = fn(tx.objectStore(store)); tx.oncomplete = () => ok(req && req.result); tx.onerror = () => fail(tx.error); tx.onabort = () => fail(tx.error); });
}
const pdbGet = (store, k) => pdbDo(store, 'readonly', st => st.get(k));
const pdbPut = (store, k, v) => pdbDo(store, 'readwrite', st => st.put(v, k));
const pdbDel = (store, k) => pdbDo(store, 'readwrite', st => st.delete(k));

  const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', q));
  if (bmp.close) bmp.close(); c.width = c.height = 0;

/* Tanpa watermark, file JPEG asli kamera disimpan apa adanya; dengan watermark digambar ulang pada resolusi

async function fullPhoto(file, wm) {
  if (!wm && (/jpe?g/i.test(file.type) || /\.jpe?g$/i.test(file.name || ''))) {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const out = { blob: file.type === 'image/jpeg' ? file : new Blob([file], { type: 'image/jpeg' }), w: bmp.width, h: bmp.height };
    if (bmp.close) bmp.close(); return out;
  }
  let out;
  try { out = await shrink(file, Infinity, wm, PHOTO_Q); } catch (e) { out = await shrink(file, 4096, wm, 0.95); }

async function copyExif(src, dst) {
  const b = new Uint8Array(await src.slice(0, 262144).arrayBuffer());
  if (b[0] !== 0xFF || b[1] !== 0xD8) return dst;
  let i = 2, app1 = null;
  while (i + 10 <= b.length && b[i] === 0xFF) {
    const mk = b[i + 1], len = (b[i + 2] << 8) | b[i + 3];
    if (mk === 0xE1 && String.fromCharCode(b[i + 4], b[i + 5], b[i + 6], b[i + 7]) === 'Exif') { if (i + 2 + len <= b.length) app1 = b.slice(i, i + 2 + len); break; }

  const ifd = t + dv.getUint32(t + 4, le), n = dv.getUint16(ifd, le);
  for (let k = 0; k < n; k++) { const e = ifd + 2 + k * 12; if (dv.getUint16(e, le) === 0x0112) dv.setUint16(e + 8, 1, le); }

function withWatermark() { try { return localStorage.getItem(AI_APP + '-watermark') !== '0'; } catch (e) { return true; } }
function drawWatermark(c, lines) {
  const g = c.getContext('2d'), fs = Math.max(14, Math.round(Math.min(c.width, c.height) * 0.032)), lh = Math.round(fs * 1.3), pd = Math.round(fs * 0.6), m = Math.round(fs * 0.8);

/* ================= Analisis =================

   Simpson 1-D = 1-Σ pi², Margalef R = (S-1)/ln N, dominansi Di = ni/N × 100%, frekuensi = stasiun ditemukan / total stasiun.

const THEMES = ['auto', 'light', 'dark'], THEME_LABEL = { auto: 'Otomatis', light: 'Terang', dark: 'Gelap' };
let theme = (() => { try { return localStorage.getItem(AI_APP + '-theme') || 'auto'; } catch (e) { return 'auto'; } })();
function applyTheme() { if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', theme); $('themeBtn').textContent = THEME_LABEL[theme]; }
$('themeBtn').addEventListener('click', () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; try { localStorage.setItem(AI_APP + '-theme', theme); } catch (e) {} applyTheme(); });
function updateNet() { $('net').textContent = navigator.onLine ? 'Online' : 'Offline'; }
window.addEventListener('online', () => { updateNet(); ailWarm(); }); window.addEventListener('offline', updateNet);
function safeToReload() { const a = document.activeElement; return !activeSurvey() && $('progress').hidden && !(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) && view.v !== 'obs'; }
async function manualUpdate(btn) {
  if (!navigator.onLine) { toast('Tidak ada sinyal. Periksa pembaruan saat online.'); return; }
  const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
  if (!sw) { location.reload(); return; }
  btn.disabled = true; btn.textContent = 'Memeriksa…';
  const res = await new Promise(ok => { const t = setTimeout(() => ok(null), 30000); navigator.serviceWorker.addEventListener('message', function h(e) { if (e.data && e.data.type === 'checked') { clearTimeout(t); navigator.serviceWorker.removeEventListener('message', h); ok(e.data); } }); sw.postMessage({ type: 'check' }); });
  btn.disabled = false; btn.textContent = 'Periksa pembaruan sekarang';
  if (!res || !res.ok) toast('Gagal memeriksa pembaruan. Coba lagi nanti.');
  else if (res.changed) { save(); location.reload(); } else toast('Aplikasi sudah versi terbaru.');
}
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'updated') { if (safeToReload()) { save(); location.reload(); } else { $('updbar').hidden = false; setTopVar(); } }
  });
}
$('updBtn').addEventListener('click', () => { save(); location.reload(); });

/* ================= Mulai ================= */
applyTheme(); updateNet();
history.replaceState(view, '');
render();
if (activeSurvey() && activeSurvey().trackOn) startTrack(activeSurvey());
setTimeout(ailWarm, 5000);
setTimeout(aiRun, 2000);
setTimeout(loadSpeciesData, 1500);
document.addEventListener('visibilitychange', () => { if (!document.hidden) aiRun(); });
</script>
</body>
