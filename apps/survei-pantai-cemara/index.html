<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Survei Pantai Cemara</title>
<meta name="description" content="Formulir lapangan Survei Lanjutan KEHATI KEE Mangrove Pantai Cemara. Bekerja tanpa sinyal.">
<meta name="theme-color" content="#1f4a3c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Layout: satu kolom sempit untuk HP, bar atas tipis + navigasi bawah; kartu hanya untuk baris data. */
:root {
  --bg: #e9eeeb;          /* lumpur pagi, abu kehijauan */
  --surface: #ffffff;
  --surface-2: #f4f7f5;
  --fg: #15231e;
  --muted: #56665f;
  --line: #ccd6d1;
  --accent: #1f6b55;      /* hijau mangrove */
  --accent-fg: #ffffff;
  --accent-soft: #d6ebe2;
  --tide: #24708f;        /* air pasang */
  --mud: #7d5d3a;         /* substrat */
  --ok: #2b7a4b;
  --warn: #a8670f;
  --bad: #b03636;
  --bar: #1f4a3c;
  --bar-fg: #eef5f1;
  --shadow: 0 1px 2px rgba(20, 40, 30, .08);
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
  --font-data: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --r: 10px;
  color-scheme: light;
}
/* Mode malam: merah redup agar mata tetap adaptasi gelap saat VES & spotlight buaya. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0c0b; --surface: #1a1412; --surface-2: #221a17; --fg: #f0d9cf; --muted: #b0907f;
    --line: #3a2c27; --accent: #d06a4a; --accent-fg: #1a0f0b; --accent-soft: #3b2219;
    --tide: #c98a6d; --mud: #b8906b; --ok: #9fbf6a; --warn: #e0a24a; --bad: #ff7a6b;
    --bar: #1a1412; --bar-fg: #f0d9cf; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0c0b; --surface: #1a1412; --surface-2: #221a17; --fg: #f0d9cf; --muted: #b0907f;
  --line: #3a2c27; --accent: #d06a4a; --accent-fg: #1a0f0b; --accent-soft: #3b2219;
  --tide: #c98a6d; --mud: #b8906b; --ok: #9fbf6a; --warn: #e0a24a; --bad: #ff7a6b;
  --bar: #1a1412; --bar-fg: #f0d9cf; --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui);
  font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px));
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--tide); outline-offset: 2px; }

.topbar {
  position: sticky; top: 0; z-index: 10; background: var(--bar); color: var(--bar-fg);
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.topbar .back {
  background: none; border: 0; color: inherit; padding: 6px 8px 6px 0; font-size: 22px; line-height: 1; cursor: pointer;
}
.topbar h1 { font-size: 17px; margin: 0; font-weight: 650; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .sub { display: block; font-size: 12px; font-weight: 400; opacity: .8; }
.pill { font-size: 12px; padding: 3px 8px; border-radius: 999px; border: 1px solid currentColor; opacity: .9; white-space: nowrap; }
.iconbtn { background: none; border: 1px solid color-mix(in srgb, var(--bar-fg) 40%, transparent); color: var(--bar-fg); border-radius: 8px; padding: 5px 9px; font-size: 13px; cursor: pointer; }

main { max-width: 720px; margin: 0 auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 16px; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface);
  border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
nav.tabs button {
  background: none; border: 0; padding: 8px 4px 9px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 12px; color: var(--muted); cursor: pointer; min-height: 58px;
}
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 650; }

h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; font-weight: 650; }
h3 { font-size: 17px; margin: 0; text-wrap: balance; }
.section { display: flex; flex-direction: column; gap: 10px; }
.note { font-size: 14px; color: var(--muted); margin: 0; }
.legend { font-size: 13px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.legend summary { cursor: pointer; color: var(--fg); font-weight: 600; }
.legend p { margin: 8px 0 0; }

.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.item {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-top: 1px solid var(--line);
  background: none; text-align: left; width: 100%; cursor: pointer; min-height: 56px;
}
.item:first-child { border-top: 0; }
.item:active { background: var(--surface-2); }
.item .main { flex: 1; min-width: 0; }
.item .t { font-weight: 600; }
.item .s { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.code {
  font-family: var(--font-data); font-weight: 700; font-size: 13px; min-width: 38px; text-align: center;
  padding: 4px 6px; border-radius: 6px; background: var(--accent-soft); color: var(--accent);
}
.count { font-family: var(--font-data); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chev { color: var(--muted); }

.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.w { grid-column: 1 / -1; }
.field > label, .field > .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
.field .hint { font-size: 12px; color: var(--muted); }
.field .warn { font-size: 12px; color: var(--warn); font-weight: 600; }
input[type=text], input[type=date], input[type=time], input[type=datetime-local], select, textarea {
  width: 100%; min-height: 46px; padding: 10px 11px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--fg); min-width: 0;
}
textarea { min-height: 70px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; background: var(--surface); }
.combo { display: flex; gap: 6px; }
.combo input { flex: 1; }
.mini {
  flex: none; border: 1px solid var(--accent); color: var(--accent); background: var(--surface); border-radius: 8px;
  padding: 0 12px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 46px;
}
.mini.busy { opacity: .6; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 8px 12px; min-height: 40px;
  font-size: 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline;
}
.chip b { font-family: var(--font-data); font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 16px;
  border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg);
  font-weight: 650; cursor: pointer; text-align: center;
}
.btn.ghost { background: var(--surface); color: var(--accent); }
.btn.danger { background: var(--surface); color: var(--bad); border-color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: var(--surface); }
.btn.block { width: 100%; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }

.tablehead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.rcard {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px;
  display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; cursor: pointer; text-align: left; width: 100%;
  box-shadow: var(--shadow);
}
.rcard .no { font-family: var(--font-data); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rcard .rt { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.rcard .rs { grid-column: 2 / 4; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.rcard .num { font-family: var(--font-data); font-weight: 700; font-variant-numeric: tabular-nums; }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 16px; text-align: center; color: var(--muted); font-size: 14px; }

.tally { width: 100%; border-collapse: collapse; font-size: 14px; }
.tally td { padding: 6px 0; border-top: 1px solid var(--line); }
.tally td:last-child { text-align: right; font-family: var(--font-data); font-weight: 700; font-variant-numeric: tabular-nums; }
.tally tr:first-child td { border-top: 0; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }

.days { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.days .chip { justify-content: center; font-weight: 650; }
.blk { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.blk.done { opacity: .62; }
.blk-head { display: flex; align-items: center; gap: 10px; }
.blk-head .when { font-weight: 700; flex: 1; }
.blk-head input[type=time] { width: 116px; min-height: 40px; padding: 6px 8px; }
.blk .what { font-size: 15px; }
.codes { display: flex; flex-wrap: wrap; gap: 6px; }
.codes button { border: 0; cursor: pointer; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }

.meter { height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.stat .v { font-family: var(--font-data); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 12px; color: var(--muted); }

.seg { display: inline-grid; grid-template-columns: repeat(3, auto); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface-2); padding: 7px 10px; font-size: 13px; cursor: pointer; min-height: 38px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"][data-v="Selesai"] { background: var(--ok); color: var(--surface); }
.seg button[aria-pressed="true"][data-v="Proses"] { background: var(--warn); color: var(--surface); }
.seg button[aria-pressed="true"][data-v="Belum"] { background: var(--muted); color: var(--surface); }
.keg { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.keg-top { display: flex; gap: 10px; align-items: flex-start; }
.keg-top .main { flex: 1; min-width: 0; }
.prio { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; border: 1px solid currentColor; }
.prio.p1 { color: var(--bad); } .prio.p2 { color: var(--warn); } .prio.p3 { color: var(--muted); }
.keg-meta { font-size: 13px; color: var(--muted); }
.keg-ctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.keg-ctl input { flex: 1 1 120px; min-height: 38px; padding: 6px 10px; }
.keg details { font-size: 14px; }
.keg details summary { cursor: pointer; color: var(--tide); font-size: 13px; font-weight: 600; }

.rekap { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.rekap th, .rekap td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: right; }
.rekap th:first-child, .rekap td:first-child { text-align: left; }
.rekap th { font-size: 12px; color: var(--muted); font-weight: 600; }
.rekap tr.tot td { font-weight: 700; }
.scroll { overflow-x: auto; }

.recbar {
  flex-basis: 100%; margin: 4px -16px -10px; display: flex; align-items: center; gap: 10px;
  background: var(--bad); color: #fff; padding: 8px 16px; font-size: 14px; font-weight: 600;
}
.updbar {
  flex-basis: 100%; margin: 4px -16px -10px; display: flex; align-items: center; gap: 10px;
  background: var(--tide); color: #fff; padding: 8px 16px; font-size: 14px; font-weight: 600;
}
.updbar .grow { flex: 1; min-width: 0; }
.updbar button { background: #fff; color: var(--tide); border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 700; cursor: pointer; }
.recbar .dot { width: 10px; height: 10px; border-radius: 50%; background: #fff; animation: blink 1.2s infinite; flex: none; }
.recbar button { background: none; border: 1px solid rgba(255,255,255,.7); color: #fff; border-radius: 8px; padding: 5px 10px; font-weight: 650; cursor: pointer; }
.recbar .grow { flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; font: inherit; color: inherit; }
@keyframes blink { 50% { opacity: .25; } }
.trk { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.trk-len { font-family: var(--font-data); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.trk-len small { font-size: 14px; color: var(--muted); font-weight: 600; }
.trk-info { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.trk-info.wait { color: var(--warn); font-weight: 600; }
.btn.rec { background: var(--bad); border-color: var(--bad); color: #fff; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.photos button { padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; aspect-ratio: 1; background: var(--surface-2); cursor: pointer; max-width: 100%; }
.photos img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photos .missing { font-size: 11px; color: var(--muted); padding: 4px; display: grid; place-items: center; height: 100%; text-align: center; }
.viewer { position: fixed; inset: 0; z-index: 40; background: #000; display: flex; flex-direction: column; }
.viewer img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
.viewer .vbar { display: flex; gap: 8px; align-items: center; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); color: #fff; font-size: 13px; flex-wrap: wrap; }
.viewer .vbar .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.viewer .vbar button { background: none; color: #fff; border: 1px solid rgba(255,255,255,.6); border-radius: 8px; padding: 8px 12px; font-weight: 650; cursor: pointer; }
.viewer .vbar button.armed { background: #c0392b; border-color: #c0392b; }
.toast {
  position: fixed; left: 50%; bottom: calc(140px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 30;
  max-width: calc(100% - 32px); box-shadow: 0 4px 14px rgba(0,0,0,.2);
}
.sticky-actions {
  position: sticky; bottom: calc(68px + env(safe-area-inset-bottom, 0px)); background: var(--bg);
  padding-block: 8px; display: flex; gap: 8px; flex-wrap: wrap;
}
.sticky-actions .btn { flex: 1 1 140px; }
.computed { font-size: 13px; color: var(--tide); font-weight: 600; }
@media (max-width: 420px) { .fields { grid-template-columns: 1fr; } .stats { grid-template-columns: 1fr 1fr 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="topbar">
  <button class="back" id="backBtn" type="button" aria-label="Kembali" hidden>&#8592;</button>
  <h1 id="title">Survei Pantai Cemara</h1>
  <span class="pill" id="net">Offline</span>
  <button class="iconbtn" id="themeBtn" type="button" aria-label="Ganti tema">Tema</button>
  <div class="updbar" id="updbar" hidden>
    <span class="grow">Versi baru aplikasi sudah siap.</span>
    <button type="button" id="updBtn">Perbarui</button>
  </div>
  <div class="recbar" id="recbar" hidden>
  <span class="dot" aria-hidden="true"></span>
  <button type="button" class="grow" id="recOpen">Merekam track…</button>
  <button type="button" id="recStop">Hentikan</button>
</div>
</header>

<main id="app"></main>
<nav class="tabs" id="tabs">
  <button type="button" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18c3-2 6-2 9 0s6 2 9 0"/><path d="M12 3v9M8 7l4-4 4 4"/></svg>Hari ini</button>
  <button type="button" data-tab="forms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Form</button>
  <button type="button" data-tab="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12l5 5L20 6"/></svg>Status</button>
  <button type="button" data-tab="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>Data</button>
</nav>
<div class="toast" id="toast" role="status" hidden></div>
<div class="viewer" id="viewer" hidden>
  <img id="viewerImg" alt="">
  <div class="vbar"><span class="grow" id="viewerCap"></span><button type="button" id="viewerDel">Hapus foto</button><button type="button" id="viewerClose">Tutup</button></div>
</div>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" multiple hidden>

<script>

/* ================= Kode dari formulir ================= */

const KEY = 'survei-cemara-v1';
let S = load();
function blank() { return { v: 1, profile: { nama: '', gps: '', hari: 'H1', device: rid() }, entries: {}, keg: {}, jadwal: {}, alat: {} }; }
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
  return blank();
}
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Gagal menyimpan: memori browser penuh. Ekspor data lalu hapus lembar lama.'); }
}
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 250); }
window.addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else if (REC) keepAwake(); });
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

/* ================= Utilitas ================= */
function rid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
const pad = n => String(n).padStart(2, '0');
function today() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function nowTime() { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtDate(s) {
  if (!s) return '';
  const [y, m, d] = s.split('-');
  const bln = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][+m - 1];
  return `${+d} ${bln} ${y}`;
}
function num(v) { if (v == null || v === '') return NaN; return parseFloat(String(v).replace(',', '.')); }
function label(f, v) {
  if (v == null || v === '') return '';
  if (f.t === 'multi') return (v || []).map(x => (f.o.find(o => o[0] === x) || [x, x])[1]).join(', ');
  if (f.t === 'sel' || f.t === 'drop') { const o = f.o.find(o => o[0] === v); return o ? `${o[0]} ${o[1]}` : v; }
  if (f.t === 'date') return fmtDate(v);
  if (f.t === 'list') return String(v).split(' — ')[0];
  return String(v);
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}
function quadArea(s) {
  const n = String(s || '').replace(/,/g, '.').match(/\d+(\.\d+)?/g);
  if (!n) return NaN;
  return n.length >= 2 ? (+n[0]) * (+n[1]) : (+n[0]) * (+n[0]);
}
function stations() {
  const set = new Set();
  Object.values(S.entries).forEach(e => {
    if (e.form === 'D1') (e.tables.stasiun || []).forEach(r => r.kode && set.add(r.kode));
    if (e.form === 'D2' && e.header.stasiun) set.add(e.header.stasiun);
  });
  ['PCM', 'REHAB', 'Pemanfaatan'].forEach(x => set.add(x));
  return [...set];
}
function defaultFor(f) {
  switch (f.def) {
    case 'today': return today();
    case 'now': return nowTime();
    case 'nowdt': return `${today()}T${nowTime()}`;
    case 'profile': return S.profile.nama || '';
    case 'gps': return S.profile.gps || '';
    case 'day': return S.profile.hari || '';
    default: return '';
  }
}
function entriesOf(formId) {
  return Object.values(S.entries).filter(e => e.form === formId).sort((a, b) => (b.created || 0) - (a.created || 0));
}
function rowCount(e) { return Object.values(e.tables || {}).reduce((n, rows) => n + rows.length, 0); }
function computed(form, table, row, entry) {
  const out = [];
  if (form.id === 'D2' && table.id === 'kuadrat') {
    const a = quadArea(entry.header.kuadrat);
    if (a > 0) {
      const u = num(row.uca), l = num(row.lubang);
      if (!isNaN(u)) out.push(['ucaPerM2', 'Uca/m²', +(u / a).toFixed(2)]);
      if (!isNaN(l)) out.push(['lubangPerM2', 'Lubang/m²', +(l / a).toFixed(2)]);
    }
  }
  if (form.id === 'F1' && table.id === 'unit' && row.pasang && row.tglAmbil) {
    const d = (new Date(row.tglAmbil) - new Date(row.pasang.slice(0, 10))) / 86400000;
    if (!isNaN(d)) out.push(['hariKamera', 'Hari-kamera', Math.round(d)]);
  }
  return out;
}

/* Baris baru yang ditinggal kosong dihapus agar lembar tetap rapi. */
let pendingNew = null;
function cleanupEmptyRows() {
  if (!pendingNew) return;
  const { id, t, rowId } = pendingNew; pendingNew = null;
  const e = S.entries[id]; if (!e) return;
  const rows = e.tables[t] || []; const i = rows.findIndex(r => r._id === rowId);
  if (i < 0) return;
  const r = rows[i];
  const filled = Object.keys(r).filter(k => !k.startsWith('_') && !(r._auto || []).includes(k) && r[k] !== '' && !(Array.isArray(r[k]) && !r[k].length));
  if (REC && REC.rowId === rowId) return;
  if (!filled.length && !r._track && !r._photos) { rows.splice(i, 1); save(); }
}

function fieldHTML(f, val, scope, extra = {}) {
  if (f.hide) return '';   // diisi dari dalam kotak Rekam track
  const id = `${scope}-${f.k}`;
  const w = f.w ? ' w' : '';
  const attrs = `id="${id}" data-k="${f.k}"`;
  const v = val ?? '';
  let warn = '';
  if ((f.min != null || f.max != null) && v !== '') {
    const n = num(v);
    if (isNaN(n)) warn = 'Bukan angka';
    else if ((f.min != null && n < f.min) || (f.max != null && n > f.max)) warn = `Di luar kisaran wajar (${f.min}–${f.max})`;
  }
  const warnHTML = `<span class="warn" data-warn="${f.k}"${warn ? '' : ' hidden'}>${esc(warn)}</span>`;
  switch (f.t) {
    case 'sel': case 'multi': {
      const sel = f.t === 'multi' ? (Array.isArray(v) ? v : []) : [v];
      return `<div class="field${w}"><span class="lbl" id="${id}-l">${esc(f.l)}</span>
        <div class="chips" role="group" aria-labelledby="${id}-l">${f.o.map(([c, l]) =>
          `<button type="button" class="chip" data-act="${f.t}" data-k="${f.k}" data-v="${esc(c)}" aria-pressed="${sel.includes(c)}">${c !== l ? `<b>${esc(c)}</b>` : ''}${esc(l)}</button>`).join('')}</div></div>`;
    }
    case 'drop':
      return `<div class="field${w}"><label for="${id}">${esc(f.l)}</label><select ${attrs}><option value="">— pilih —</option>${f.o.map(([c, l]) => `<option value="${esc(c)}"${c === v ? ' selected' : ''}>${esc(c)} · ${esc(l)}</option>`).join('')}</select></div>`;
    case 'area':
      return `<div class="field${w}"><label for="${id}">${esc(f.l)}</label><textarea ${attrs} rows="2">${esc(v)}</textarea></div>`;
    case 'date':
      return `<div class="field${w}"><label for="${id}">${esc(f.l)}</label><input type="date" ${attrs} value="${esc(v)}"></div>`;
    case 'dt':
      return `<div class="field${w}"><label for="${id}">${esc(f.l)}</label><input type="datetime-local" ${attrs} value="${esc(v)}"></div>`;
    case 'time':
      return `<div class="field${w}"><label for="${id}">${esc(f.l)}</label><div class="combo"><input type="time" ${attrs} value="${esc(v)}"><button type="button" class="mini" data-act="now" data-k="${f.k}">Kini</button></div></div>`;
    case 'track': {
      const o = extra.obj || {}; const live = REC && sameTarget(REC, view);
      const st = trackStats(o), info = trackInfoText(o, live);
      const other = REC && !live;

/* ================= Rekam track GPS =================
   Titik disimpan per segmen di obj._track = [[[lat, lon, akurasi, detik], ...], ...].
   Segmen baru dimulai setiap kali rekaman dilanjutkan, agar jeda tidak dihitung sebagai garis lurus. */
const TRK_MAX_ACC = 30;     // titik dengan akurasi lebih buruk dari ini diabaikan (m)
const TRK_MIN_STEP = 4;     // jarak minimum antartitik untuk meredam loncatan GPS (m)
let REC = null;
let updateReady = false;   // versi baru sudah diunduh service worker
let wakeLock = null;

function hav(a, b) {
  const R = 6371008.8, r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function trackStats(o) {
  const segs = (o && o._track) || [];
  let len = 0, n = 0, t0 = null, t1 = null;
  segs.forEach(sg => {
    n += sg.length;
    for (let i = 1; i < sg.length; i++) len += hav(sg[i - 1], sg[i]);
    if (sg.length) { if (t0 == null) t0 = sg[0][3]; t1 = sg[sg.length - 1][3]; }
  });
  // Luas poligon tertutup: proyeksi ekuirektangular lokal + rumus shoelace (cukup akurat untuk area < beberapa km).
  const pts = segs.flat();
  let area = 0;
  if (pts.length >= 3) {
    const lat0 = pts.reduce((a, p) => a + p[0], 0) / pts.length * Math.PI / 180, R = 6371008.8, r = Math.PI / 180;
    const xy = pts.map(p => [R * p[1] * r * Math.cos(lat0), R * p[0] * r]);
    for (let i = 0; i < xy.length; i++) { const j = (i + 1) % xy.length; area += xy[i][0] * xy[j][1] - xy[j][0] * xy[i][1]; }
    area = Math.abs(area) / 2;
  }
  return { len, n, area, ha: area / 10000, t0, t1 };
}
function fmtLen(m) { return m >= 1000 ? `${(m / 1000).toFixed(2).replace('.', ',')} km` : `${Math.round(m)} m`; }
function fmtDur(sec) { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60); return h ? `${h} j ${m} mnt` : `${m} mnt`; }
function hhmm(sec) { const d = new Date(sec * 1000); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }

function trackField(e, rec) {
  const form = FORM[e.form];
  const list = rec.t ? form.tables.find(t => t.id === rec.t).fields : form.header;
  return list.find(f => f.t === 'track');
}
function trackObj(rec) {
  const e = rec && S.entries[rec.id]; if (!e) return null;
  if (!rec.t) return e.header;
  return (e.tables[rec.t] || []).find(r => r._id === rec.rowId) || null;
}
function sameTarget(rec, v) {
  if (!rec || !v) return false;
  if (v.v === 'entry') return !rec.t && rec.id === v.id;
  if (v.v === 'row') { const e = S.entries[v.id]; const r = e && (e.tables[v.t] || [])[v.i]; return !!r && rec.t === v.t && rec.rowId === r._id; }
  return false;
}
function trackFileName(e, f, o) {
  const tgl = (e.header.tanggal || e.header.tglPasang || today()).replace(/-/g, '');
  let tag = '';
  if (o !== e.header) { const rows = Object.values(e.tables).find(rs => rs.includes(o)) || []; tag = `_baris${rows.indexOf(o) + 1}`; }
  return `${e.form}_${tgl}_${e.id.slice(-4)}${tag}.gpx`;
}
function applyTrack(rec, final) {
  const e = S.entries[rec.id], o = trackObj(rec); if (!e || !o) return;
  const f = trackField(e, rec), st = trackStats(o);
  const lenTxt = f.fmt === 'num' ? String(Math.round(st.len))
    : (o._trackType === 'area' ? `${Math.round(st.len)} m / ${st.ha.toFixed(2)} ha` : `${Math.round(st.len)} m`);
  const set = (k, v) => { if (!k) return; o[k] = v; markEdited(o, k); const inp = sameTarget(rec, view) && app.querySelector(`input[data-k="${k}"]`); if (inp) inp.value = v; };
  if (st.n) set(f.len, lenTxt);
  if (f.file && !o[f.file]) set(f.file, o._trackFile);
  if (f.start && !o[f.start] && st.t0) set(f.start, hhmm(st.t0));
  if (final && f.end && st.t1) set(f.end, hhmm(st.t1));
  touch(e);
}
function trackInfoText(o, live) {
  const st = trackStats(o);
  if (live && REC && REC.waitAcc) return { cls: 'wait', txt: `Menunggu sinyal GPS lebih akurat (±${REC.waitAcc} m, perlu ≤ ${TRK_MAX_ACC} m)…` };
  if (!st.n) return { cls: '', txt: live ? 'Mencari sinyal GPS…' : 'Belum ada track.' };
  const parts = [`${st.n} titik`];
  if (st.t0) parts.push(fmtDur(st.t1 - st.t0));
  if (o._trackType === 'area' && st.n >= 3) parts.push(`luas ${st.ha.toFixed(2).replace('.', ',')} ha`);
  if (live && REC && REC.lastAcc) parts.push(`akurasi ±${REC.lastAcc} m`);
  return { cls: '', txt: parts.join(' · ') };
}
function refreshTrackUI() {
  const bar = document.getElementById('recbar');
  bar.hidden = !REC;
  if (REC) {
    const o = trackObj(REC);
    document.getElementById('recOpen').textContent = `Merekam track · ${fmtLen(trackStats(o).len)}${REC.waitAcc ? ' · menunggu GPS' : ''}`;
  }
  const box = app.querySelector('[data-trk]'); if (!box) return;
  const tg = currentTarget(); if (!tg) return;
  const o = tg.obj, live = REC && sameTarget(REC, view);
  const st = trackStats(o), info = trackInfoText(o, live);

async function keepAwake() {

}
function startTrack() {
  if (!navigator.geolocation) { toast('GPS tidak tersedia di perangkat ini.'); return; }
  if (REC) { toast('Hentikan rekaman yang sedang berjalan dulu.'); return; }
  const e = S.entries[view.id]; if (!e) return;
  let rec;
  if (view.v === 'entry') rec = { id: e.id, t: null, rowId: null };
  else { const r = e.tables[view.t][view.i]; rec = { id: e.id, t: view.t, rowId: r._id }; }
  const o = trackObj(rec); const f = trackField(e, rec);
  o._track = o._track || [];
  o._track.push([]);
  if (!o._trackFile) o._trackFile = trackFileName(e, f, o);

function onTrackPos(p) {

  const acc = Math.round(p.coords.accuracy);
  REC.lastAcc = acc;
  if (acc > TRK_MAX_ACC) { REC.waitAcc = acc; refreshTrackUI(); return; }
  REC.waitAcc = 0;
  const seg = o._track[o._track.length - 1];
  const pt = [+p.coords.latitude.toFixed(6), +p.coords.longitude.toFixed(6), acc, Math.round(p.timestamp / 1000)];
  const last = seg[seg.length - 1];
  if (last && hav(last, pt) < Math.max(TRK_MIN_STEP, acc * 0.5)) { refreshTrackUI(); return; }

}
function onTrackErr(err) {

function stopTrack() {

    o._track = o._track.filter(sg => sg.length);

    else applyTrack(rec, true);
  }
  try { if (wakeLock) wakeLock.release(); } catch (e) {}
  wakeLock = null;

}
function gpxFor(name, o) {
  const segs = (o._track || []).map(sg => '    <trkseg>\n' + sg.map(p =>
    `      <trkpt lat="${p[0]}" lon="${p[1]}"><time>${new Date(p[3] * 1000).toISOString()}</time><hdop>${(p[2] / 5).toFixed(1)}</hdop></trkpt>`).join('\n') + '\n    </trkseg>').join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Survei Pantai Cemara" xmlns="http://www.topografix.com/GPX/1/1">\n  <trk>\n    <name>${esc(name.replace(/\.gpx$/, ''))}</name>\n${segs}\n  </trk>\n</gpx>\n`;
}
function allTracks() {
  const out = [];
  Object.values(S.entries).forEach(e => {
    const form = FORM[e.form]; if (!form) return;
    if (e.header._track && e.header._track.length) out.push({ e, form, o: e.header, no: '' });
    form.tables.forEach(t => (e.tables[t.id] || []).forEach((r, i) => { if (r._track && r._track.length) out.push({ e, form, o: r, t, no: i + 1 }); }));
  });

}

/* ================= Foto =================
   Foto disimpan di IndexedDB (localStorage terlalu kecil): store 'foto' berisi JPEG
   yang diperkecil ke sisi terpanjang 2560 px, store 'thumb' berisi gambar kecil untuk daftar.
   Baris data menyimpan metadata di row._photos = [{id, name, t, lat, lon, acc, w, h, size}]. */
const PHOTO_MAX = 2560, PHOTO_Q = 0.88, THUMB_MAX = 320;
let photoDB = null;
function pdb() {
  if (!photoDB) photoDB = new Promise((ok, fail) => {
    const r = indexedDB.open('survei-cemara-foto', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('foto'); r.result.createObjectStore('thumb'); };
    r.onsuccess = () => ok(r.result); r.onerror = () => fail(r.error);
  });
  return photoDB;
}
async function pdbDo(store, mode, fn) {
  const db = await pdb();
  return new Promise((ok, fail) => {
    const tx = db.transaction(store, mode); const req = fn(tx.objectStore(store));
    tx.oncomplete = () => ok(req && req.result); tx.onerror = () => fail(tx.error); tx.onabort = () => fail(tx.error);
  });
}
const pdbGet = (store, k) => pdbDo(store, 'readonly', st => st.get(k));
const pdbPut = (store, k, v) => pdbDo(store, 'readwrite', st => st.put(v, k));
const pdbDel = (store, k) => pdbDo(store, 'readwrite', st => st.delete(k));
async function deletePhotos(list) {
  for (const ph of list || []) { try { await pdbDel('foto', ph.id); await pdbDel('thumb', ph.id); } catch (e) {} }
}
function photosOfEntry(e) { return Object.values(e.tables || {}).flat().flatMap(r => r._photos || []); }

async function shrink(file, max) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { bmp = await new Promise((ok, fail) => { const im = new Image(); im.onload = () => ok(im); im.onerror = fail; im.src = URL.createObjectURL(file); }); }
  const w0 = bmp.width, h0 = bmp.height, k = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement('canvas'); c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', PHOTO_Q));
  return { blob, w: c.width, h: c.height };
}
let photoGeo = null;   // posisi GPS diminta saat tombol kamera ditekan, dipakai saat foto kembali
function askPhotoGeo() {
  photoGeo = new Promise(ok => {
    if (!navigator.geolocation) return ok(null);
    navigator.geolocation.getCurrentPosition(p => ok(p.coords), () => ok(null), { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 });
  });
}
function photoName(e, rowNo, taken) {
  const d = new Date(taken * 1000);
  const stamp = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  return `${e.form}_${view.t}_b${rowNo}_${stamp}`;
}
async function addPhotos(files) {
  if (view.v !== 'row' || !files || !files.length) return;
  const e = S.entries[view.id]; const row = e && e.tables[view.t][view.i]; if (!row) return;
  const rowNo = view.i + 1, target = { id: view.id, t: view.t, rowId: row._id };
  toast(files.length > 1 ? `Menyimpan ${files.length} foto…` : 'Menyimpan foto…');
  const geo = await Promise.race([photoGeo || Promise.resolve(null), new Promise(ok => setTimeout(() => ok(null), 4000))]);
  let n = 0;
  for (const file of files) {
    try {
      const taken = Math.round((file.lastModified || Date.now()) / 1000);
      const big = await shrink(file, PHOTO_MAX), small = await shrink(file, THUMB_MAX);
      const id = rid();
      await pdbPut('foto', id, big.blob); await pdbPut('thumb', id, small.blob);
      const r = (S.entries[target.id].tables[target.t] || []).find(x => x._id === target.rowId); if (!r) break;
      r._photos = r._photos || [];
      let name = photoName(e, rowNo, taken), k = 1;
      while (r._photos.some(p => p.name === name + '.jpg')) name = photoName(e, rowNo, taken) + '_' + (++k);
      const meta = { id, name: name + '.jpg', t: taken, w: big.w, h: big.h, size: big.blob.size };
      if (geo) Object.assign(meta, { lat: +geo.latitude.toFixed(6), lon: +geo.longitude.toFixed(6), acc: Math.round(geo.accuracy) });
      r._photos.push(meta);
      // Kolom "Dokumentasi" (F/V) ikut dicentang Foto bila ada.
      const tdef = FORM[e.form].tables.find(t => t.id === target.t);
      if (tdef.fields.some(f => f.k === 'dok')) { r.dok = Array.isArray(r.dok) ? r.dok : []; if (!r.dok.includes('F')) r.dok.push('F'); markEdited(r, 'dok'); }
      markEdited(r, '_photos'); n++;
    } catch (err) { toast('Foto gagal disimpan. Memori HP mungkin penuh.'); }
  }
  photoGeo = null;
  if (n) { touch(e); save(); if (view.v === 'row') render(); toast(`${n} foto tersimpan${geo ? ' dengan koordinat' : ' (tanpa GPS)'}`); }
}
let thumbURLs = [];
async function loadThumbs() {
  thumbURLs.forEach(u => URL.revokeObjectURL(u)); thumbURLs = [];
  const box = document.getElementById('photos'); if (!box) return;
  for (const btn of box.querySelectorAll('button[data-ph]')) {
    try {
      const b = await pdbGet('thumb', btn.dataset.ph);
      if (b) { const u = URL.createObjectURL(b); thumbURLs.push(u); btn.innerHTML = `<img src="${u}" alt="">`; }
      else btn.innerHTML = '<span class="missing">Foto ada di HP lain</span>';
    } catch (e) {}
  }
}
let viewerPhoto = null, viewerURL = null;
async function openViewer(id) {
  const e = S.entries[view.id]; const row = e && e.tables[view.t][view.i]; if (!row) return;
  const ph = (row._photos || []).find(p => p.id === id); if (!ph) return;
  const b = await pdbGet('foto', id).catch(() => null);
  if (!b) { toast('File foto ini tidak ada di HP ini (data digabung dari HP lain).'); return; }
  viewerPhoto = ph; if (viewerURL) URL.revokeObjectURL(viewerURL); viewerURL = URL.createObjectURL(b);
  document.getElementById('viewerImg').src = viewerURL;
  const d = new Date(ph.t * 1000);
  document.getElementById('viewerCap').textContent = `${ph.name} · ${pad(d.getHours())}:${pad(d.getMinutes())}${ph.lat != null ? ` · ${ph.lat}, ${ph.lon} (±${ph.acc} m)` : ''}`;
  const del = document.getElementById('viewerDel'); del.classList.remove('armed'); del.textContent = 'Hapus foto';

}

}
document.getElementById('viewerClose').addEventListener('click', closeViewer);
document.getElementById('viewerDel').addEventListener('click', async ev => {
  const b = ev.currentTarget;
  if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'Ketuk lagi untuk menghapus'; return; }
  const e = S.entries[view.id]; const row = e && e.tables[view.t][view.i]; if (!row || !viewerPhoto) return;
  await deletePhotos([viewerPhoto]);
  row._photos = row._photos.filter(p => p.id !== viewerPhoto.id); if (!row._photos.length) delete row._photos;
  touch(e); save(); closeViewer(); render(); toast('Foto dihapus');

['camIn', 'galIn'].forEach(id => document.getElementById(id).addEventListener('change', ev => {
  const files = [...ev.target.files]; ev.target.value = ''; addPhotos(files);
}));

/* ================= Interaksi ================= */
function currentTarget() {
  if (view.v === 'entry') { const e = S.entries[view.id]; return e && { obj: e.header, e }; }
  if (view.v === 'row') { const e = S.entries[view.id]; const r = e && (e.tables[view.t] || [])[view.i]; return r && { obj: r, e }; }
  if (view.v === 'data') return { obj: S.profile };
  return null;
}
function touch(e) { if (e) e.updated = Date.now(); saveSoon(); }
function refreshComputed() {
  const el = document.getElementById('computed');
  if (!el || view.v !== 'row') return;
  const e = S.entries[view.id]; const form = FORM[e.form]; const t = form.tables.find(x => x.id === view.t);
  el.textContent = computed(form, t, e.tables[t.id][view.i], e).map(c => `${c[1]}: ${c[2]}`).join(' · ');
}
function fieldDef(k) {
  const e = S.entries[view.id]; if (!e) return null;
  const form = FORM[e.form];
  const list = view.v === 'row' ? form.tables.find(t => t.id === view.t).fields : form.header;
  return list.find(f => f.k === k);
}
function markEdited(obj, k) { if (obj._auto) obj._auto = obj._auto.filter(x => x !== k); }

app.addEventListener('input', ev => {
  const el = ev.target; const k = el.dataset.k; if (!k) return;
  if (el.dataset.jad != null) { const s = S.jadwal[el.dataset.jad] = S.jadwal[el.dataset.jad] || {}; s[k] = el.type === 'checkbox' ? el.checked : el.value; s.t = Date.now(); saveSoon(); if (k === 'cek') render(); return; }
  if (el.dataset.keg) { const s = S.keg[el.dataset.keg] = S.keg[el.dataset.keg] || {}; s[k] = el.value; s.t = Date.now(); saveSoon(); return; }
  if (el.dataset.alat != null) { const s = S.alat[el.dataset.alat] = S.alat[el.dataset.alat] || {}; s[k] = el.type === 'checkbox' ? el.checked : el.value; s.t = Date.now(); saveSoon(); return; }
  const tg = currentTarget(); if (!tg) return;
  tg.obj[k] = el.value; markEdited(tg.obj, k); touch(tg.e);
  const f = view.v === 'data' ? null : fieldDef(k);
  if (f && (f.min != null || f.max != null)) {
    const w = app.querySelector(`[data-warn="${k}"]`); const n = num(el.value);
    let msg = '';
    if (el.value !== '') { if (isNaN(n)) msg = 'Bukan angka'; else if ((f.min != null && n < f.min) || (f.max != null && n > f.max)) msg = `Di luar kisaran wajar (${f.min}–${f.max})`; }
    if (w) { w.textContent = msg; w.hidden = !msg; }
  }
  refreshComputed();
});
app.addEventListener('change', ev => {
  if (ev.target.id === 'importFile') importFile(ev.target.files[0]);
  else if (ev.target.id === 'withPhotos') { try { localStorage.setItem('survei-cemara-zipfoto', ev.target.checked ? '1' : '0'); } catch (e) {} }
  else save();
});

let armed = null;
function arm(btn, key, text) {
  if (armed === key) { armed = null; return true; }
  armed = key; btn.classList.add('armed'); const old = btn.textContent; btn.textContent = text;
  setTimeout(() => { if (armed === key) { armed = null; btn.classList.remove('armed'); btn.textContent = old; } }, 3500);
  return false;
}

function newEntry(fid, from) {
  const form = FORM[fid];
  const e = { id: rid(), form: fid, created: Date.now(), updated: Date.now(), by: S.profile.device, header: {}, tables: {} };
  form.header.forEach(f => { const d = from ? from.header[f.k] : defaultFor(f); if (d !== '' && d != null) e.header[f.k] = Array.isArray(d) ? [...d] : d; });
  if (from) { form.header.forEach(f => { if (f.def === 'today') e.header[f.k] = today(); }); }
  form.tables.forEach(t => { e.tables[t.id] = []; });
  S.entries[e.id] = e; save();
  return e;
}
function newRow(e, tid, base) {
  const form = FORM[e.form]; const t = form.tables.find(x => x.id === tid);
  const rows = e.tables[tid] = e.tables[tid] || [];
  const r = { _id: rid(), _auto: [] };
  t.fields.forEach(f => { const d = defaultFor(f); if (d) { r[f.k] = d; r._auto.push(f.k); } });
  if (t.numbered) { r[t.numbered] = String(rows.length + 1); r._auto.push(t.numbered); }
  if (base && t.carry) t.carry.forEach(k => { if (base[k]) { r[k] = Array.isArray(base[k]) ? [...base[k]] : base[k]; r._auto.push(k); } });
  rows.push(r); touch(e); save();
  pendingNew = { id: e.id, t: tid, rowId: r._id };
  return rows.length - 1;
}

function getGPS(k, btn) {
  if (!navigator.geolocation) { toast('GPS tidak tersedia di browser ini. Ketik koordinat dari unit GPS.'); return; }
  const tg = currentTarget(); if (!tg) return;
  btn.classList.add('busy'); btn.textContent = 'Mencari…';
  navigator.geolocation.getCurrentPosition(p => {
    const v = `${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}`;
    tg.obj[k] = v; tg.obj[k + 'Acc'] = Math.round(p.coords.accuracy); markEdited(tg.obj, k); touch(tg.e); save();
    const inp = app.querySelector(`[data-k="${k}"]:not(button)`); if (inp) inp.value = v;
    const h = app.querySelector(`[data-acc="${k}"]`); if (h) h.textContent = `Akurasi ±${Math.round(p.coords.accuracy)} m`;
    btn.classList.remove('busy'); btn.textContent = 'Ambil GPS';
    toast(`Koordinat tersimpan (±${Math.round(p.coords.accuracy)} m)`);
  }, err => {
    btn.classList.remove('busy'); btn.textContent = 'Ambil GPS';
    toast(err.code === 1 ? 'Izin lokasi ditolak. Aktifkan izin lokasi untuk situs ini di pengaturan browser.' : 'Sinyal GPS belum didapat. Coba lagi di tempat terbuka atau ketik manual.');
  }, { enableHighAccuracy: true, timeout: 30000, maximumAge: 5000 });
}

app.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'day') { S.profile.hari = b.dataset.v; save(); render(); }
  else if (a === 'openform') { if (b.dataset.f) go({ v: 'entries', f: b.dataset.f }); }
  else if (a === 'newentry') { const e = newEntry(b.dataset.f); go({ v: 'entry', id: e.id }); }
  else if (a === 'openentry') go({ v: 'entry', id: b.dataset.id });
  else if (a === 'quick') {
    const fid = b.dataset.f; const form = FORM[fid];
    const e = entriesOf(fid)[0] || newEntry(fid);
    const i = newRow(e, form.tables[0].id);
    go({ v: 'row', id: e.id, t: form.tables[0].id, i });
  }
  else if (a === 'newrow') { const e = S.entries[view.id]; const i = newRow(e, b.dataset.t); go({ v: 'row', id: e.id, t: b.dataset.t, i }); }
  else if (a === 'openrow') go({ v: 'row', id: view.id, t: b.dataset.t, i: +b.dataset.i });
  else if (a === 'sel' || a === 'multi') {
    const tg = currentTarget(); if (!tg) return;
    const k = b.dataset.k, v = b.dataset.v;
    if (a === 'sel') {
      tg.obj[k] = tg.obj[k] === v ? '' : v;
      b.parentElement.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.v === tg.obj[k]));
    } else {
      const arr = Array.isArray(tg.obj[k]) ? tg.obj[k] : [];
      tg.obj[k] = arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v];
      b.setAttribute('aria-pressed', tg.obj[k].includes(v));
    }
    markEdited(tg.obj, k); touch(tg.e); save();
  }
  else if (a === 'now') {
    const tg = currentTarget(); if (!tg) return;
    tg.obj[b.dataset.k] = nowTime(); markEdited(tg.obj, b.dataset.k); touch(tg.e); save();
    const inp = app.querySelector(`input[data-k="${b.dataset.k}"]`); if (inp) inp.value = tg.obj[b.dataset.k];
  }
  else if (a === 'gps') getGPS(b.dataset.k, b);
  else if (a === 'cam') { askPhotoGeo(); document.getElementById('camIn').click(); }
  else if (a === 'gal') { askPhotoGeo(); document.getElementById('galIn').click(); }
  else if (a === 'photo') openViewer(b.dataset.ph);
  else if (a === 'trkstart') startTrack();
  else if (a === 'trkstop') stopTrack();
  else if (a === 'trktype') {
    const tg = currentTarget(); if (!tg) return;
    tg.obj._trackType = b.dataset.v;
    const rec = view.v === 'entry' ? { id: view.id, t: null } : { id: view.id, t: view.t, rowId: tg.obj._id };
    if (tg.obj._track) applyTrack(rec, false);
    save(); render();
  }
  else if (a === 'trkclear') {
    if (!arm(b, 'trkclear', 'Ketuk lagi untuk menghapus track')) return;
    const tg = currentTarget(); if (!tg) return;
    delete tg.obj._track; delete tg.obj._trackFile; touch(tg.e); save(); render(); toast('Track dihapus');
  }
  else if (a === 'rowdone') { save(); history.back(); }
  else if (a === 'rownext') {
    const e = S.entries[view.id]; const prev = e.tables[view.t][view.i];
    pendingNew = null;
    const i = newRow(e, view.t, prev);
    go({ v: 'row', id: e.id, t: view.t, i }, true); toast(`Baris ${view.i + 1} tersimpan`);
  }
  else if (a === 'rowdup') {
    const e = S.entries[view.id]; const rows = e.tables[view.t];
    const copy = JSON.parse(JSON.stringify(rows[view.i])); copy._id = rid(); copy._auto = []; delete copy._photos; delete copy._track; delete copy._trackFile;
    const t = FORM[e.form].tables.find(x => x.id === view.t);
    if (t.numbered) copy[t.numbered] = String(rows.length + 1);
    rows.push(copy); touch(e); save(); pendingNew = null;
    go({ v: 'row', id: e.id, t: view.t, i: rows.length - 1 }, true); toast('Baris diduplikat. Ubah yang berbeda.');
  }
  else if (a === 'rowdel') {
    if (!arm(b, 'rowdel', 'Ketuk lagi untuk menghapus')) return;
    const e = S.entries[view.id]; deletePhotos(e.tables[view.t][view.i]._photos); e.tables[view.t].splice(view.i, 1); touch(e); save(); pendingNew = null;
    history.back(); toast('Baris dihapus');
  }
  else if (a === 'dupentry') { const e = newEntry(S.entries[view.id].form, S.entries[view.id]); go({ v: 'entry', id: e.id }, true); toast('Lembar baru dibuat dari kepala lembar ini'); }
  else if (a === 'delentry') {
    if (!arm(b, 'delentry', 'Ketuk lagi untuk menghapus lembar')) return;
    const f = S.entries[view.id].form; deletePhotos(photosOfEntry(S.entries[view.id])); delete S.entries[view.id]; save();
    go({ v: 'entries', f }, true); toast('Lembar dihapus');
  }
  else if (a === 'kegstatus') {
    const s = S.keg[b.dataset.c] = S.keg[b.dataset.c] || {}; s.status = b.dataset.v; s.t = Date.now(); save(); render();
  }
  else if (a === 'zip') exportZip(false);
  else if (a === 'share') exportZip(true);
  else if (a === 'json') download(backupBlob(), fileBase() + '.json');
  else if (a === 'wipe') {
    if (!arm(b, 'wipe', 'Ketuk lagi: semua data akan hilang')) return;
    const keep = S.profile; S = blank(); S.profile = keep; save();
    pdbDo('foto', 'readwrite', st => st.clear()).catch(() => {}); pdbDo('thumb', 'readwrite', st => st.clear()).catch(() => {});
    render(); toast('Semua data dihapus');
  }
});

/* Tema: Otomatis → Terang → Malam */
const THEMES = ['auto', 'light', 'dark'];
const THEME_LABEL = { auto: 'Otomatis', light: 'Terang', dark: 'Malam' };
let theme = 'auto';
try { theme = localStorage.getItem('survei-cemara-theme') || 'auto'; } catch (e) {}

  else document.documentElement.setAttribute('data-theme', theme);

function updateNet() {

/* ================= Ekspor ================= */
function fileBase() {
  const d = new Date();
  const who = (S.profile.nama || 'tim').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'tim';
  return `survei_cemara_${today().replace(/-/g, '')}_${pad(d.getHours())}${pad(d.getMinutes())}_${who}`;
}
function csvCell(v) {
  const s = v == null ? '' : String(v);
  return /[",\n\r;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCSV(rows) { return '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n'; }
function cellValue(f, v) {
  if (v == null) return '';
  if (Array.isArray(v)) return v.join('; ');
  if ((f.t === 'num' || f.t === 'int') && v !== '') return String(v).replace(',', '.');
  if (f.t === 'dt') return String(v).replace('T', ' ');
  return v;
}
function splitCoord(v) {
  const m = String(v || '').replace(/[()]/g, '').match(/(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)/);
  return m ? [m[1], m[2]] : ['', ''];
}
function expandCols(fields, prefix) {
  const cols = [];
  fields.forEach(f => {
    const name = prefix + f.k;
    if (f.t === 'track') cols.push(
      { h: name + '_panjang_m', get: o => o._track ? Math.round(trackStats(o).len) : '' },
      { h: name + '_luas_ha', get: o => o._track && o._trackType === 'area' ? trackStats(o).ha.toFixed(4) : '' },
      { h: name + '_titik', get: o => o._track ? trackStats(o).n : '' },
      { h: name + '_file', get: o => o._track ? 'track/' + o._trackFile : '' });
    else if (f.t === 'coord') cols.push({ h: name, f, get: o => o[f.k] }, { h: name + '_lat', get: o => splitCoord(o[f.k])[0] }, { h: name + '_lon', get: o => splitCoord(o[f.k])[1] }, { h: name + '_akurasi_m', get: o => o[f.k + 'Acc'] ?? '' });
    else cols.push({ h: name, f, get: o => cellValue(f, o[f.k]) });
  });
  return cols;
}
function buildCSVs() {
  const files = [];
  FORMS.forEach(form => {
    const es = entriesOf(form.id).reverse();
    if (!es.length) return;
    const hc = expandCols(form.header, 'h_');
    form.tables.forEach(t => {
      const rc = expandCols(t.fields, '');
      const compKeys = [];
      es.forEach(e => (e.tables[t.id] || []).forEach(r => computed(form, t, r, e).forEach(([k]) => { if (!compKeys.includes(k)) compKeys.push(k); })));
      const head = ['form', 'lembar_id', ...hc.map(c => c.h), 'no', ...rc.map(c => c.h), ...compKeys, 'foto_hp'];
      const out = [head];
      es.forEach(e => {
        const rows = e.tables[t.id] || [];
        const hv = hc.map(c => c.get(e.header));
        if (!rows.length) return;
        rows.forEach((r, i) => {
          const comp = Object.fromEntries(computed(form, t, r, e).map(([k, , v]) => [k, v]));
          out.push([form.id, e.id, ...hv, i + 1, ...rc.map(c => c.get(r)), ...compKeys.map(k => comp[k] ?? ''), (r._photos || []).map(p => 'foto/' + p.name).join('; ')]);
        });
      });
      if (out.length > 1) files.push([`Form_${form.id}_${t.id}.csv`, toCSV(out)]);
    });
  });
  const tracks = allTracks();
  if (tracks.length) {
    const feats = [];
    tracks.forEach(({ e, form, o, t, no }) => {
      const name = o._trackFile || trackFileName(e, null, o);
      files.push(['track/' + name, gpxFor(name, o)]);
      const st = trackStats(o);
      const props = { form: form.id, lembar_id: e.id, tabel: t ? t.id : 'kepala', no, file: name, jenis: o._trackType || 'garis',
        panjang_m: Math.round(st.len), luas_ha: o._trackType === 'area' ? +st.ha.toFixed(4) : null, titik: st.n,
        mulai: st.t0 ? new Date(st.t0 * 1000).toISOString() : null, selesai: st.t1 ? new Date(st.t1 * 1000).toISOString() : null,
        kode: o.kode || '', lokasi: o.lokasi || e.header.rute || e.header.lokasi || '' };
      feats.push({ type: 'Feature', properties: props, geometry: { type: 'MultiLineString', coordinates: o._track.map(sg => sg.map(p => [p[1], p[0]])) } });
      if (o._trackType === 'area' && st.n >= 3) {
        const ring = o._track.flat().map(p => [p[1], p[0]]); ring.push(ring[0]);
        feats.push({ type: 'Feature', properties: { ...props, jenis: 'area_poligon' }, geometry: { type: 'Polygon', coordinates: [ring] } });
      }
    });
    files.push(['track/semua_track.geojson', JSON.stringify({ type: 'FeatureCollection', features: feats })]);
  }
  const fotoRows = [['file', 'form', 'tabel', 'lembar_id', 'no_baris', 'waktu', 'lat', 'lon', 'akurasi_m', 'lebar_px', 'tinggi_px', 'keterangan']];
  const fotoFeats = [];
  FORMS.forEach(form => entriesOf(form.id).reverse().forEach(e => form.tables.forEach(t => (e.tables[t.id] || []).forEach((r, i) => (r._photos || []).forEach(ph => {
    const ket = rowSummary(form, t, r, e).title;
    const waktu = new Date(ph.t * 1000).toISOString();
    fotoRows.push(['foto/' + ph.name, form.id, t.id, e.id, i + 1, waktu, ph.lat ?? '', ph.lon ?? '', ph.acc ?? '', ph.w, ph.h, ket]);
    if (ph.lat != null) fotoFeats.push({ type: 'Feature', properties: { file: 'foto/' + ph.name, form: form.id, tabel: t.id, no_baris: i + 1, waktu, akurasi_m: ph.acc, keterangan: ket }, geometry: { type: 'Point', coordinates: [ph.lon, ph.lat] } });
  })))));
  if (fotoRows.length > 1) {
    files.push(['foto/Daftar_Foto.csv', toCSV(fotoRows)]);
    if (fotoFeats.length) files.push(['foto/titik_foto.geojson', JSON.stringify({ type: 'FeatureCollection', features: fotoFeats })]);
  }
  const keg = [['kode', 'kelompok', 'kegiatan', 'prioritas', 'hari', 'pic', 'status', 'catatan_lapangan']];
  KEG.forEach(k => { const s = S.keg[k.code] || {}; keg.push([k.code, k.kel, k.keg, k.prio, k.hari, s.pic || '', s.status || 'Belum', s.catatan || '']); });
  files.push(['Status_Kegiatan.csv', toCSV(keg)]);
  const jad = [['hari', 'blok', 'jam', 'kegiatan', 'cek']];
  JADWAL.forEach((j, i) => { const s = S.jadwal[i] || {}; jad.push([j[0], j[1], s.jam || '', j[2], s.cek ? 'Ya' : '']); });
  files.push(['Jadwal.csv', toCSV(jad)]);
  return files;
}
function backupBlob() { return new Blob([JSON.stringify({ app: 'survei-cemara', exported: new Date().toISOString(), data: S }, null, 1)], { type: 'application/json' }); }

/* ZIP tanpa kompresi (metode store) agar tidak perlu pustaka luar. */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files) {
  const enc = new TextEncoder(); const parts = []; const central = []; let off = 0;
  const d = new Date(); const dt = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
  const dd = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
  files.forEach(([name, content]) => {
    const nb = enc.encode(name);
    const isBlob = content && content.blob;
    const data = isBlob ? { length: content.blob.size } : typeof content === 'string' ? enc.encode(content) : content;
    const crc = isBlob ? content.crc : crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dt, true); lh.setUint16(12, dd, true); lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, nb.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nb, isBlob ? content.blob : data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dt, true); ch.setUint16(14, dd, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
    ch.setUint16(28, nb.length, true); ch.setUint32(42, off, true);
    central.push(new Uint8Array(ch.buffer), nb);
    off += 30 + nb.length + data.length;
  });
  const csize = central.reduce((a, p) => a + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, csize, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}
/* Di aplikasi Android (Capacitor) unduhan browser tidak jalan: simpan ke folder Documents atau bagikan lewat plugin bawaan. */
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
function blobToBase64(blob) {
  return new Promise((ok, fail) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = fail; r.readAsDataURL(blob); });
}
async function nativeSave(blob, name, share) {
  const { Filesystem, Share } = window.Capacitor.Plugins;
  const data = await blobToBase64(blob);
  if (!share) {
    try {
      await Filesystem.writeFile({ path: 'SurveiCemara/' + name, data, directory: 'DOCUMENTS', recursive: true });
      toast(`Tersimpan di Documents/SurveiCemara/${name}`); return;
    } catch (e) { /* lanjut ke bagikan */ }
  }
  const res = await Filesystem.writeFile({ path: name, data, directory: 'CACHE' });
  try { await Share.share({ title: name, text: 'Data Survei Pantai Cemara', files: [res.uri], dialogTitle: 'Kirim data survei' }); }
  catch (e) { if (!/cancel/i.test(String(e && e.message))) toast('Gagal membagikan file. Coba "Simpan ZIP ke HP".'); }
}
function download(blob, name) {
  if (NATIVE) { nativeSave(blob, name, false); return; }
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000); toast(`${name} diunduh`);
}
async function exportZip(share) {
  save();
  const base = fileBase();
  const json = JSON.stringify({ app: 'survei-cemara', exported: new Date().toISOString(), data: S }, null, 1);
  const photoFiles = [];
  if (withPhotos()) {
    const all = Object.values(S.entries).flatMap(photosOfEntry);
    if (all.length) toast(`Menyiapkan ${all.length} foto…`);
    for (const ph of all) {
      const blob = await pdbGet('foto', ph.id).catch(() => null); if (!blob) continue;
      const crc = crc32(new Uint8Array(await blob.arrayBuffer()));
      photoFiles.push(['foto/' + ph.name, { blob, crc }]);
    }
  }
  const zip = makeZip([...buildCSVs(), ...photoFiles, [base + '.json', json]]);
  const name = base + '.zip';
  if (NATIVE) { await nativeSave(zip, name, share); return; }
  if (share) {
    const file = new File([zip], name, { type: 'application/zip' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name, text: 'Data Survei Pantai Cemara' }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
    toast('Browser ini tidak bisa berbagi file. ZIP diunduh sebagai gantinya.');
  }
  download(zip, name);
}

/* ================= Impor / gabung ================= */
function importFile(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const obj = JSON.parse(rd.result); const d = obj.data || obj;
      if (!d.entries) throw new Error('format');
      let add = 0, upd = 0;
      Object.values(d.entries).forEach(e => {
        const cur = S.entries[e.id];
        if (!cur) { S.entries[e.id] = e; add++; }
        else if ((e.updated || 0) > (cur.updated || 0)) { S.entries[e.id] = e; upd++; }
      });
      ['keg', 'jadwal', 'alat'].forEach(sec => Object.entries(d[sec] || {}).forEach(([k, v]) => {
        if (!S[sec][k] || (v.t || 0) > (S[sec][k].t || 0)) S[sec][k] = v;
      }));
      save(); render(); toast(`Digabung: ${add} lembar baru, ${upd} diperbarui`);
    } catch (e) { toast('File ini bukan cadangan Survei Cemara (.json). Pilih file hasil "Unduh cadangan".'); }
  };
  rd.readAsText(file);
}

/* ================= Mulai ================= */
applyTheme(); updateNet(); render();
/* ================= Pembaruan otomatis =================
   Service worker memeriksa server setiap kali aplikasi dibuka, saat kembali ke
   aplikasi, dan tiap 15 menit. Bila ada versi baru, halaman dimuat ulang sendiri
   saat aman (tidak sedang merekam track atau mengisi lembar); bila tidak aman,
   muncul tombol Perbarui. Posisi halaman dipulihkan setelah dimuat ulang. */
function safeToReload() {
  const a = document.activeElement;
  const typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  return !REC && !typing && !['row', 'entry'].includes(view.v);
}
function applyUpdate() {
  save();
  try { sessionStorage.setItem('survei-cemara-resume', JSON.stringify(view)); sessionStorage.setItem('survei-cemara-updated', '1'); } catch (e) {}
  location.reload();
}
function onUpdateReady() {
  updateReady = true;
  if (safeToReload()) { applyUpdate(); return; }
  document.getElementById('updbar').hidden = false;
}
function checkUpdate() {
  if (!navigator.onLine || !navigator.serviceWorker || !navigator.serviceWorker.controller) return;
  navigator.serviceWorker.controller.postMessage({ type: 'check' });
  navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
}
document.getElementById('updBtn').addEventListener('click', applyUpdate);
try {
  const resume = JSON.parse(sessionStorage.getItem('survei-cemara-resume') || 'null');
  sessionStorage.removeItem('survei-cemara-resume');
  if (resume && resume.v && (!resume.id || S.entries[resume.id])) { view = resume; history.replaceState(view, ''); render(); }
  if (sessionStorage.getItem('survei-cemara-updated')) { sessionStorage.removeItem('survei-cemara-updated'); toast('Aplikasi diperbarui ke versi terbaru'); }
} catch (e) {}
if (!NATIVE && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('message', ev => { if (ev.data && ev.data.type === 'updated') onUpdateReady(); });
  // Service worker baru mengambil alih (mis. sw.js sendiri berubah): muat versi baru juga.
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) onUpdateReady(); });
  navigator.serviceWorker.register('sw.js').catch(() => {});
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
  window.addEventListener('online', checkUpdate);
  setInterval(checkUpdate, 15 * 60 * 1000);
}
