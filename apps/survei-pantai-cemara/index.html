<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Survei KEHATI Pantai Cemara</title>
<meta name="description" content="Formulir lapangan Survei Lanjutan KEHATI KEE Mangrove Pantai Cemara. Bekerja tanpa sinyal.">
<meta name="theme-color" content="#1f4a3c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Layout: satu kolom sempit untuk HP, bar atas tipis + navigasi bawah; kartu hanya untuk baris data. */
:root {
  --bg: #e9eeeb;          /* lumpur pagi, abu kehijauan */
  --surface: #ffffff;
  --surface-2: #f4f7f5;
  --fg: #15231e;
  --muted: #56665f;
  --line: #ccd6d1;
  --accent: #1f6b55;      /* hijau mangrove */
  --accent-fg: #ffffff;
  --accent-soft: #d6ebe2;
  --tide: #24708f;        /* air pasang */
  --mud: #7d5d3a;         /* substrat */
  --ok: #2b7a4b;
  --warn: #a8670f;
  --bad: #b03636;
  --bar: #1f4a3c;
  --bar-fg: #eef5f1;
  --shadow: 0 1px 2px rgba(20, 40, 30, .08);
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
  --font-data: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --r: 10px;
  color-scheme: light;
}
/* Mode malam: merah redup agar mata tetap adaptasi gelap saat VES & spotlight buaya. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0c0b; --surface: #1a1412; --surface-2: #221a17; --fg: #f0d9cf; --muted: #b0907f;
    --line: #3a2c27; --accent: #d06a4a; --accent-fg: #1a0f0b; --accent-soft: #3b2219;
    --tide: #c98a6d; --mud: #b8906b; --ok: #9fbf6a; --warn: #e0a24a; --bad: #ff7a6b;
    --bar: #1a1412; --bar-fg: #f0d9cf; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0c0b; --surface: #1a1412; --surface-2: #221a17; --fg: #f0d9cf; --muted: #b0907f;
  --line: #3a2c27; --accent: #d06a4a; --accent-fg: #1a0f0b; --accent-soft: #3b2219;
  --tide: #c98a6d; --mud: #b8906b; --ok: #9fbf6a; --warn: #e0a24a; --bad: #ff7a6b;
  --bar: #1a1412; --bar-fg: #f0d9cf; --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui);
  font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px));
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--tide); outline-offset: 2px; }

.topbar {
  position: sticky; top: 0; z-index: 10; background: var(--bar); color: var(--bar-fg);
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.topbar .back {
  background: none; border: 0; color: inherit; padding: 6px 8px 6px 0; font-size: 22px; line-height: 1; cursor: pointer;
}
.topbar h1 { font-size: 17px; margin: 0; font-weight: 650; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .sub { display: block; font-size: 12px; font-weight: 400; opacity: .8; }
.pill { font-size: 12px; padding: 3px 8px; border-radius: 999px; border: 1px solid currentColor; opacity: .9; white-space: nowrap; }
.iconbtn { background: none; border: 1px solid color-mix(in srgb, var(--bar-fg) 40%, transparent); color: var(--bar-fg); border-radius: 8px; padding: 5px 9px; font-size: 13px; cursor: pointer; }

main { max-width: 720px; margin: 0 auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 16px; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface);
  border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
nav.tabs button {
  background: none; border: 0; padding: 8px 4px 9px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 12px; color: var(--muted); cursor: pointer; min-height: 58px;
}
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 650; }

h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; font-weight: 650; }
h3 { font-size: 17px; margin: 0; text-wrap: balance; }
.section { display: flex; flex-direction: column; gap: 10px; }
.note { font-size: 14px; color: var(--muted); margin: 0; }
.legend { font-size: 13px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.legend summary { cursor: pointer; color: var(--fg); font-weight: 600; }
.legend p { margin: 8px 0 0; }

.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.item {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-top: 1px solid var(--line);
  background: none; text-align: left; width: 100%; cursor: pointer; min-height: 56px;
}
.item:first-child { border-top: 0; }
.item:active { background: var(--surface-2); }
.item .main { flex: 1; min-width: 0; }
.item .t { font-weight: 600; }
.item .s { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.code {
  font-family: var(--font-data); font-weight: 700; font-size: 13px; min-width: 38px; text-align: center;
  padding: 4px 6px; border-radius: 6px; background: var(--accent-soft); color: var(--accent);
}
.count { font-family: var(--font-data); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chev { color: var(--muted); }

.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.w { grid-column: 1 / -1; }
.field > label, .field > .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
.field .hint { font-size: 12px; color: var(--muted); }
.field .warn { font-size: 12px; color: var(--warn); font-weight: 600; }
input[type=text], input[type=date], input[type=time], input[type=datetime-local], select, textarea {
  width: 100%; min-height: 46px; padding: 10px 11px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--fg); min-width: 0;
}
textarea { min-height: 70px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; background: var(--surface); }
.combo { display: flex; gap: 6px; }
.combo input { flex: 1; }
.mini {
  flex: none; border: 1px solid var(--accent); color: var(--accent); background: var(--surface); border-radius: 8px;
  padding: 0 12px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 46px;
}
.mini.busy { opacity: .6; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 8px 12px; min-height: 40px;
  font-size: 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline;
}
.chip b { font-family: var(--font-data); font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 16px;
  border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg);
  font-weight: 650; cursor: pointer; text-align: center;
}
.btn.ghost { background: var(--surface); color: var(--accent); }
.btn.danger { background: var(--surface); color: var(--bad); border-color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: var(--surface); }
.btn.block { width: 100%; }
a.btn { text-decoration: none; box-sizing: border-box; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }

.tablehead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.rcard {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px;
  display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; cursor: pointer; text-align: left; width: 100%;
  box-shadow: var(--shadow);
}
.rcard .no { font-family: var(--font-data); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rcard .rt { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.rcard .rs { grid-column: 2 / 4; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.rcard .num { font-family: var(--font-data); font-weight: 700; font-variant-numeric: tabular-nums; }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 16px; text-align: center; color: var(--muted); font-size: 14px; }

.tally { width: 100%; border-collapse: collapse; font-size: 14px; }
.tally td { padding: 6px 0; border-top: 1px solid var(--line); }
.tally td:last-child { text-align: right; font-family: var(--font-data); font-weight: 700; font-variant-numeric: tabular-nums; }
.tally tr:first-child td { border-top: 0; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }

.days { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.days .chip { justify-content: center; font-weight: 650; }
.blk { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.blk.done { opacity: .62; }
.blk-head { display: flex; align-items: center; gap: 10px; }
.blk-head .when { font-weight: 700; flex: 1; }
.blk-head input[type=time] { width: 116px; min-height: 40px; padding: 6px 8px; }
.blk .what { font-size: 15px; }
.codes { display: flex; flex-wrap: wrap; gap: 6px; }
.codes button { border: 0; cursor: pointer; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }

.meter { height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.stat .v { font-family: var(--font-data); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 12px; color: var(--muted); }

.seg { display: inline-grid; grid-template-columns: repeat(3, auto); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface-2); padding: 7px 10px; font-size: 13px; cursor: pointer; min-height: 38px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"][data-v="Selesai"] { background: var(--ok); color: var(--surface); }
.seg button[aria-pressed="true"][data-v="Proses"] { background: var(--warn); color: var(--surface); }
.seg button[aria-pressed="true"][data-v="Belum"] { background: var(--muted); color: var(--surface); }
.keg { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.keg-top { display: flex; gap: 10px; align-items: flex-start; }
.keg-top .main { flex: 1; min-width: 0; }
.prio { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; border: 1px solid currentColor; }
.prio.p1 { color: var(--bad); } .prio.p2 { color: var(--warn); } .prio.p3 { color: var(--muted); }
.keg-meta { font-size: 13px; color: var(--muted); }
.keg-ctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.keg-ctl input { flex: 1 1 120px; min-height: 38px; padding: 6px 10px; }
.keg details { font-size: 14px; }
.keg details summary { cursor: pointer; color: var(--tide); font-size: 13px; font-weight: 600; }

.rekap { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.rekap th, .rekap td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: right; }
.rekap th:first-child, .rekap td:first-child { text-align: left; }
.rekap th { font-size: 12px; color: var(--muted); font-weight: 600; }
.rekap tr.tot td { font-weight: 700; }
.scroll { overflow-x: auto; }

.recbar {
  flex-basis: 100%; margin: 4px -16px -10px; display: flex; align-items: center; gap: 10px;
  background: var(--bad); color: #fff; padding: 8px 16px; font-size: 14px; font-weight: 600;
}
.updbar {
  flex-basis: 100%; margin: 4px -16px -10px; display: flex; align-items: center; gap: 10px;
  background: var(--tide); color: #fff; padding: 8px 16px; font-size: 14px; font-weight: 600;
}
.updbar .grow { flex: 1; min-width: 0; }
.updbar button { background: #fff; color: var(--tide); border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 700; cursor: pointer; }
.recbar .dot { width: 10px; height: 10px; border-radius: 50%; background: #fff; animation: blink 1.2s infinite; flex: none; }
.recbar button { background: none; border: 1px solid rgba(255,255,255,.7); color: #fff; border-radius: 8px; padding: 5px 10px; font-weight: 650; cursor: pointer; }
.recbar .grow { flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; font: inherit; color: inherit; }
@keyframes blink { 50% { opacity: .25; } }
.trk { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.trk-len { font-family: var(--font-data); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.trk-len small { font-size: 14px; color: var(--muted); font-weight: 600; }
.trk-info { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.trk-info.wait { color: var(--warn); font-weight: 600; }
.trk-help { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.btn.rec { background: var(--bad); border-color: var(--bad); color: #fff; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.photos button { padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; aspect-ratio: 1; background: var(--surface-2); cursor: pointer; max-width: 100%; }
.photos img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photos .missing { font-size: 11px; color: var(--muted); padding: 4px; display: grid; place-items: center; height: 100%; text-align: center; }
.viewer { position: fixed; inset: 0; z-index: 40; background: #000; display: flex; flex-direction: column; }
.viewer img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
.viewer .vbar { display: flex; gap: 8px; align-items: center; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); color: #fff; font-size: 13px; flex-wrap: wrap; }
.viewer .vbar .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.viewer .vbar button { background: none; color: #fff; border: 1px solid rgba(255,255,255,.6); border-radius: 8px; padding: 8px 12px; font-weight: 650; cursor: pointer; }
.viewer .vbar button.armed { background: #c0392b; border-color: #c0392b; }
.toast {
  position: fixed; left: 50%; bottom: calc(140px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 30;
  max-width: calc(100% - 32px); box-shadow: 0 4px 14px rgba(0,0,0,.2);
}
.sticky-actions {
  position: sticky; bottom: calc(68px + env(safe-area-inset-bottom, 0px)); background: var(--bg);
  padding-block: 8px; display: flex; gap: 8px; flex-wrap: wrap;
}
.sticky-actions .btn { flex: 1 1 140px; }
.computed { font-size: 13px; color: var(--tide); font-weight: 600; }
/* Rekap tally sheet: matriks jenis x kolom, kolom pertama tetap saat digeser. */
.rk-ctl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rk-ctl .field.w { grid-column: 1 / -1; }
.rk-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.tallytab { border-collapse: separate; border-spacing: 0; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 100%; }
.tallytab th, .tallytab td { padding: 6px 8px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); text-align: center; white-space: nowrap; vertical-align: middle; }
.tallytab thead th { background: var(--surface-2); font-size: 12px; color: var(--muted); font-weight: 650; position: sticky; top: 0; }
.tallytab th.sp, .tallytab td.sp { position: sticky; left: 0; background: var(--surface); text-align: left; white-space: normal; min-width: 132px; max-width: 170px; z-index: 1; }
.tallytab thead th.sp { background: var(--surface-2); z-index: 2; }
.tallytab td.sp i { display: block; font-size: 11px; color: var(--muted); }
.tallytab td.n { font-family: var(--font-data); font-weight: 700; }
.tallytab td.zero { color: var(--line); }
.tallytab .tot { background: var(--accent-soft); font-weight: 700; }
.tallytab tfoot td { font-weight: 700; background: var(--surface-2); }
.tallytab tfoot td.sp { background: var(--surface-2); }
.tm { display: block; margin: 2px auto 0; color: var(--fg); }
@media print {
  .topbar, nav.tabs, .no-print, .toast { display: none !important; }
  body { padding: 0; background: #fff; color: #000; }
  main { max-width: none; padding: 0; }
  .rk-wrap { overflow: visible; border: 0; }
  .tallytab th, .tallytab td { border-color: #999; }
  .tallytab th.sp, .tallytab td.sp, .tallytab thead th { position: static; }
  .print-head { display: block !important; }
}
.print-head { display: none; }
@media (max-width: 420px) { .fields { grid-template-columns: 1fr; } .stats { grid-template-columns: 1fr 1fr 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="topbar">
  <button class="back" id="backBtn" type="button" aria-label="Kembali" hidden>&#8592;</button>
  <h1 id="title">Survei KEHATI Pantai Cemara</h1>
  <span class="pill" id="net">Offline</span>
  <button class="iconbtn" id="themeBtn" type="button" aria-label="Ganti tema">Tema</button>
  <div class="updbar" id="installbar" hidden>
    <span class="grow">Pasang Survei Cemara sebagai aplikasi di HP ini.</span>
    <button type="button" id="installBtn">Pasang</button>
    <button type="button" id="installX" aria-label="Tutup" style="background:none;color:#fff;padding:6px 4px">✕</button>
  </div>
  <div class="updbar" id="updbar" hidden>
    <span class="grow">Versi baru aplikasi sudah siap.</span>
    <button type="button" id="updBtn">Perbarui</button>
  </div>
  <div class="recbar" id="recbar" hidden>
  <span class="dot" aria-hidden="true"></span>
  <button type="button" class="grow" id="recOpen">Merekam track…</button>
  <button type="button" id="recStop">Hentikan</button>
</div>
</header>

<main id="app"></main>
<nav class="tabs" id="tabs">
  <button type="button" data-tab="forms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Form</button>
  <button type="button" data-tab="rekap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/><path d="M13 13v4M15.5 13v4M18 13v4"/></svg>Rekap</button>
  <button type="button" data-tab="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>Data</button>
</nav>
<div class="toast" id="toast" role="status" hidden></div>
<div class="viewer" id="viewer" hidden>
  <img id="viewerImg" alt="">
  <div class="vbar"><span class="grow" id="viewerCap"></span><button type="button" id="viewerDel">Hapus foto</button><button type="button" id="viewerClose">Tutup</button></div>
</div>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" multiple hidden>
<input type="file" id="gpxIn" hidden>

<script>
'use strict';

/* ================= Kode dari formulir ================= */
const C = {

/* ================= Penyimpanan ================= */
const KEY = 'survei-cemara-v1';
let S = load();
function blank() { return { v: 1, profile: { nama: '', gps: '', hari: 'H1', device: rid() }, entries: {}, keg: {}, jadwal: {}, alat: {} }; }
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
  return blank();
}
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Gagal menyimpan: memori browser penuh. Ekspor data lalu hapus lembar lama.'); }
}
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 250); }
window.addEventListener('pagehide', save);
/* Aplikasi terbuka di dua tempat (mis. aplikasi terpasang dan tab Chrome): bila tempat lain menyimpan,
   muat data terbarunya di sini juga, agar salinan lama di sini tidak menimpa data yang lebih baru. */
window.addEventListener('storage', ev => {
  if (ev.key !== KEY || !ev.newValue) return;
  clearTimeout(saveTimer); S = load();
  const a = document.activeElement;
  if (!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) render();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else if (REC) keepAwake(); });
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

/* ================= Utilitas ================= */
function rid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
const pad = n => String(n).padStart(2, '0');
function today() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function nowTime() { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtDate(s) {
  if (!s) return '';
  const [y, m, d] = s.split('-');
  const bln = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][+m - 1];
  return `${+d} ${bln} ${y}`;
}
function num(v) { if (v == null || v === '') return NaN; return parseFloat(String(v).replace(',', '.')); }
function label(f, v) {
  if (v == null || v === '') return '';
  if (f.t === 'multi') return (v || []).map(x => (f.o.find(o => o[0] === x) || [x, x])[1]).join(', ');
  if (f.t === 'sel' || f.t === 'drop') { const o = f.o.find(o => o[0] === v); return o ? `${o[0]} ${o[1]}` : v; }
  if (f.t === 'date') return fmtDate(v);
  if (f.t === 'list') return String(v).split(' — ')[0];
  return String(v);
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}
function quadArea(s) {
  const n = String(s || '').replace(/,/g, '.').match(/\d+(\.\d+)?/g);
  if (!n) return NaN;
  return n.length >= 2 ? (+n[0]) * (+n[1]) : (+n[0]) * (+n[0]);
}
function stations() {
  const set = new Set();
  Object.values(S.entries).forEach(e => {
    if (e.form === 'D1') (e.tables.stasiun || []).forEach(r => r.kode && set.add(r.kode));
    if (e.form === 'D2' && e.header.stasiun) set.add(e.header.stasiun);
  });
  ['PCM', 'REHAB', 'Pemanfaatan'].forEach(x => set.add(x));
  return [...set];
}
// Hari survei menurut Paket Dokumen Final: H1 Rabu 28 Okt … H4 Sabtu 31 Okt 2026.
const SURVEY_DAYS = { '2026-10-28': 'H1', '2026-10-29': 'H2', '2026-10-30': 'H3', '2026-10-31': 'H4' };
function defaultFor(f) {
  switch (f.def) {
    case 'today': return today();
    case 'now': return nowTime();
    case 'nowdt': return `${today()}T${nowTime()}`;
    case 'profile': return S.profile.nama || '';
    case 'gps': return S.profile.gps || '';
    case 'day': return SURVEY_DAYS[today()] || S.profile.hari || '';
    default: return '';
  }
}
function entriesOf(formId) {
  return Object.values(S.entries).filter(e => e.form === formId).sort((a, b) => (b.created || 0) - (a.created || 0));
}
function rowCount(e) { return Object.values(e.tables || {}).reduce((n, rows) => n + rows.length, 0); }
function computed(form, table, row, entry) {
  const out = [];
  if (form.id === 'D2' && table.id === 'kuadrat') {
    const a = quadArea(entry.header.kuadrat);
    if (a > 0) {
      const u = num(row.uca), l = num(row.lubang);
      if (!isNaN(u)) out.push(['ucaPerM2', 'Uca/m²', +(u / a).toFixed(2)]);
      if (!isNaN(l)) out.push(['lubangPerM2', 'Lubang/m²', +(l / a).toFixed(2)]);
    }
  }
  if (form.id === 'F1' && table.id === 'unit' && row.pasang && row.tglAmbil) {
    const d = (new Date(row.tglAmbil) - new Date(row.pasang.slice(0, 10))) / 86400000;
    if (!isNaN(d)) out.push(['hariKamera', 'Hari-kamera', Math.round(d)]);
  }
  return out;
}

/* ================= Navigasi ================= */
let view = { v: 'forms' };
function go(v, replace) {
  view = v;
  if (replace) history.replaceState(v, ''); else history.pushState(v, '');
  render(); window.scrollTo(0, 0);
}
window.addEventListener('popstate', e => { view = e.state || { v: 'forms' }; cleanupEmptyRows(); render(); });
// Setelah halaman dimuat ulang (refresh), buka lagi layar terakhir: lembar/baris yang sedang diisi.
if (history.state && history.state.v && (!history.state.id || S.entries[history.state.id])) view = history.state;
else history.replaceState(view, '');
const TABS = { forms: 'forms', entries: 'forms', entry: 'forms', row: 'forms', rekap: 'rekap', data: 'data' };

/* Baris baru yang ditinggal kosong dihapus agar lembar tetap rapi. */
let pendingNew = null;
function cleanupEmptyRows() {
  if (!pendingNew) return;
  const { id, t, rowId } = pendingNew; pendingNew = null;
  const e = S.entries[id]; if (!e) return;
  const rows = e.tables[t] || []; const i = rows.findIndex(r => r._id === rowId);
  if (i < 0) return;
  const r = rows[i];
  const filled = Object.keys(r).filter(k => !k.startsWith('_') && !(r._auto || []).includes(k) && r[k] !== '' && !(Array.isArray(r[k]) && !r[k].length));
  if (REC && REC.rowId === rowId) return;
  if (!filled.length && !r._track && !r._photos) { rows.splice(i, 1); save(); }
}

/* ================= Render ================= */
const app = document.getElementById('app');
function setTitle(t, sub) {
  document.getElementById('title').innerHTML = esc(t) + (sub ? `<span class="sub">${esc(sub)}</span>` : '');
}
function render() {
  document.getElementById('backBtn').hidden = !['entries', 'entry', 'row'].includes(view.v);
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', TABS[view.v] === b.dataset.tab ? 'page' : 'false'));
  ({ forms: renderForms, entries: renderEntries, entry: renderEntry, row: renderRow, rekap: renderRekap, data: renderData }[view.v] || renderForms)();
  refreshTrackUI();
  if (updateReady && safeToReload()) setTimeout(() => { if (safeToReload()) applyUpdate(); }, 300);
}

function renderForms() {
  setTitle('Survei KEHATI Pantai Cemara', S.profile.nama ? `Pencatat: ${S.profile.nama}` : 'Isi nama pencatat di tab Data');
  const item = f => {
    const es = entriesOf(f.id); const n = es.reduce((a, e) => a + rowCount(e), 0);
    return `<button type="button" class="item" data-act="openform" data-f="${f.id}">
      <span class="code">${f.id}</span>
      <span class="main"><span class="t">${esc(f.title)}</span><br><span class="s">Kegiatan ${esc(f.kegLabel)}</span></span>
      <span class="count">${es.length ? `${es.length} lbr · ${n} brs` : '—'}</span><span class="chev">›</span></button>`;
  };
  const old = FORMS.filter(f => f.old && entriesOf(f.id).length);
  app.innerHTML = `
    <section class="section">
      <h2>Catat cepat</h2>
      <div class="row">
        <button type="button" class="btn ghost" data-act="quick" data-f="C2">+ Temuan ancaman</button>
        <button type="button" class="btn ghost" data-act="quick" data-f="F2">+ Perjumpaan primata</button>
      </div>
      <p class="note">Setiap baris data langsung mengambil koordinat GPS; foto bisa diambil dari layar baris yang sama.</p>
    </section>
    <section class="section"><h2>Formulir</h2>
      <div class="list">${FORMS.filter(f => !f.old).map(item).join('')}</div>
    </section>
    ${old.length ? `<section class="section"><h2>Lembar lama</h2><p class="note">Form yang tidak dipakai lagi; lembar yang sudah diisi tetap bisa dibuka dan ikut diekspor.</p><div class="list">${old.map(item).join('')}</div></section>` : ''}`;
}

function entryLabel(form, e) {
  const k = form.header.find(f => f.k === form.key);
  const main = k ? label(k, e.header[form.key]) : '';
  const tgl = e.header.tanggal || e.header.tglPasang;
  return { t: main || (tgl ? fmtDate(tgl) : 'Lembar tanpa judul'), s: [tgl && main !== fmtDate(tgl) ? fmtDate(tgl) : '', e.header.pengamat].filter(Boolean).join(' · ') };
}

function renderEntries() {
  const form = FORM[view.f];
  setTitle(`Form ${form.id}`, form.title);
  const es = entriesOf(form.id);
  app.innerHTML = `
    <section class="section">
      <h3>${esc(form.title)}</h3>
      <p class="note">Kegiatan ${esc(form.kegLabel)} · ${esc(form.intro)}</p>
      <button type="button" class="btn block" data-act="newentry" data-f="${form.id}">+ Lembar baru</button>
    </section>
    <section class="section"><h2>Lembar tersimpan</h2>
      ${es.length ? `<div class="list">${es.map(e => {
        const l = entryLabel(form, e);
        return `<button type="button" class="item" data-act="openentry" data-id="${e.id}">
          <span class="main"><span class="t">${esc(l.t)}</span><br><span class="s">${esc(l.s || '—')}</span></span>
          <span class="count">${rowCount(e)} baris</span><span class="chev">›</span></button>`;
      }).join('')}</div>` : `<div class="empty">Belum ada lembar. Ketuk "Lembar baru" untuk mulai mencatat.</div>`}
    </section>`;
}

function fieldHTML(f, val, scope, extra = {}) {
  if (f.hide) return '';   // diisi dari dalam kotak Rekam track
  const id = `${scope}-${f.k}`;
  const w = f.w ? ' w' : '';
  const attrs = `id="${id}" data-k="${f.k}"`;
  const v = val ?? '';
  let warn = '';
  if ((f.min != null || f.max != null) && v !== '') {
    const n = num(v);
    if (isNaN(n)) warn = 'Bukan angka';
    else if ((f.min != null && n < f.min) || (f.max != null && n > f.max)) warn = `Di luar kisaran wajar (${f.min}–${f.max})`;
  }
  const warnHTML = `<span class="warn" data-warn="${f.k}"${warn ? '' : ' hidden'}>${esc(warn)}</span>`;
  switch (f.t) {
    case 'sel': case 'multi': {
      const sel = f.t === 'multi' ? (Array.isArray(v) ? v : []) : [v];
      return `<div class="field${w}"><span class="lbl" id="${id}-l">${esc(f.l)}</span>
        <div class="chips" role="group" aria-labelledby="${id}-l">${f.o.map(([c, l]) =>
          `<button type="button" class="chip" data-act="${f.t}" data-k="${f.k}" data-v="${esc(c)}" aria-pressed="${sel.includes(c)}">${c !== l ? `<b>${esc(c)}</b>` : ''}${esc(l)}</button>`).join('')}</div></div>`;
    }
    case 'drop':
      return `<div class="field${w}"><label for="${id}">${esc(f.l)}</label><select ${attrs}><option value="">— pilih —</option>${f.o.map(([c, l]) => `<option value="${esc(c)}"${c === v ? ' selected' : ''}>${esc(c)} · ${esc(l)}</option>`).join('')}</select></div>`;
    case 'area':
      return `<div class="field${w}"><label for="${id}">${esc(f.l)}</label><textarea ${attrs} rows="2">${esc(v)}</textarea></div>`;
    case 'date':
      return `<div class="field${w}"><label for="${id}">${esc(f.l)}</label><input type="date" ${attrs} value="${esc(v)}"></div>`;
    case 'dt':
      return `<div class="field${w}"><label for="${id}">${esc(f.l)}</label><input type="datetime-local" ${attrs} value="${esc(v)}"></div>`;
    case 'time':
      return `<div class="field${w}"><label for="${id}">${esc(f.l)}</label><div class="combo"><input type="time" ${attrs} value="${esc(v)}"><button type="button" class="mini" data-act="now" data-k="${f.k}">Kini</button></div></div>`;
    case 'track': {
      const o = extra.obj || {}; const live = REC && sameTarget(REC, view);
      const st = trackStats(o), info = trackInfoText(o, live);
      const other = REC && !live;
      const src = o._trackSrc === 'upload' ? 'diunggah dari file' : 'direkam dengan GPS HP';
      return `<div class="field w"><span class="lbl">${esc(f.l)} <span class="hint">(tidak wajib)</span></span><div class="trk" data-trk>
        <div class="trk-len">${esc(fmtLen(st.len))}${o._trackType === 'area' && st.n >= 3 ? ` <small>/ ${st.ha.toFixed(2).replace('.', ',')} ha</small>` : ''}</div>
        <div class="trk-info ${info.cls}">${esc(info.txt)}</div>
        ${f.area ? `<div class="chips" role="group" aria-label="Jenis track">${[['garis', 'Transek (garis)'], ['area', 'Batas area (luas)']].map(([v, l]) =>
          `<button type="button" class="chip" data-act="trktype" data-v="${v}" aria-pressed="${(o._trackType || 'garis') === v}">${l}</button>`).join('')}</div>` : ''}
        ${live ? `<div class="row"><button type="button" class="btn rec" data-act="trkstop">Hentikan rekaman</button></div>`
          : st.n ? `<span class="hint">File track: <b>${esc((f.file && o[f.file]) || o._trackFile)}</b> · ${src} · ikut dalam ekspor ZIP (folder track/).</span>
              <div class="row">${o._trackSrc === 'upload' ? '' : `<button type="button" class="btn ghost" data-act="trkstart"${other ? ' disabled' : ''}>Lanjutkan rekam</button>`}
              <button type="button" class="btn danger" data-act="trkclear">Hapus track</button></div>`
          : `<div class="row">
              <button type="button" class="btn" data-act="trkstart"${other ? ' disabled' : ''}>Rekam GPS HP</button>
              <button type="button" class="btn ghost" data-act="trkupload">Unggah GPX/KML</button>
            </div>
            <ul class="hint trk-help">
              <li><b>Rekam GPS HP</b>: tekan saat mulai berjalan menyusuri transek atau batas area, lalu tekan Hentikan di ujungnya. Layar dibuat tetap menyala; jangan kunci layar.</li>
              <li><b>Unggah GPX/KML</b>: bila track direkam dengan Garmin atau aplikasi lain (OsmAnd, Avenza, Locus, dll.). Pindahkan dulu file .gpx/.kml ke HP, lalu pilih file-nya.</li>
            </ul>
            ${f.file ? `<details${o[f.file] ? ' open' : ''}><summary class="hint">File belum bisa dipindah ke HP? Catat namanya saja</summary>
              <div class="field" style="margin-top:8px"><label for="${scope}-${f.file}">Nama file track di alat GPS</label>
              <input type="text" id="${scope}-${f.file}" data-k="${f.file}" value="${esc(o[f.file] || '')}" placeholder="mis. Track_06-OKT-26 083015"></div></details>` : ''}`}
        ${other ? '<span class="hint">Ada rekaman lain yang sedang berjalan.</span>' : ''}
        <span class="hint">Panjang${f.area ? ' (dan luas, bila memilih Batas area)' : ''} terisi otomatis dari track.</span>
      </div></div>`;
    }
    case 'coord': {
      const acc = extra.acc ? `Akurasi ±${extra.acc} m` : 'Desimal: lintang, bujur (mis. -0.99512, 104.08934)';
      return `<div class="field${w}"><label for="${id}">${esc(f.l)}</label><div class="combo"><input type="text" inputmode="decimal" ${attrs} value="${esc(v)}" placeholder="lintang, bujur"><button type="button" class="mini" data-act="gps" data-k="${f.k}">Ambil GPS</button></div><span class="hint" data-acc="${f.k}">${esc(acc)}</span></div>`;
    }
    case 'num': case 'int':
      return `<div class="field${w}"><label for="${id}">${esc(f.l)}</label><input type="text" inputmode="${f.t === 'int' ? 'numeric' : 'decimal'}" ${attrs} value="${esc(v)}"${f.ph ? ` placeholder="${esc(f.ph)}"` : ''}>${warnHTML}</div>`;
    case 'list': {
      const opts = f.o === 'stations' ? stations() : f.o;
      return `<div class="field${w}"><label for="${id}">${esc(f.l)}</label><input type="text" list="${id}-dl" autocomplete="off" ${attrs} value="${esc(v)}"><datalist id="${id}-dl">${opts.map(o => `<option value="${esc(o)}"></option>`).join('')}</datalist></div>`;
    }
    default:
      return `<div class="field${w}"><label for="${id}">${esc(f.l)}</label><input type="text" ${attrs} value="${esc(v)}"${f.ph ? ` placeholder="${esc(f.ph)}"` : ''}></div>`;
  }
}

function rowSummary(form, table, row, entry) {
  const fs = Object.fromEntries(table.fields.map(f => [f.k, f]));
  const title = table.sum.map(k => label(fs[k], row[k])).filter(Boolean).join(' · ') || '(belum diisi)';
  const bits = [row.jam || row.tanggal && fmtDate(row.tanggal), row.koordinat || '', row._track ? `track ${fmtLen(trackStats(row).len)}` : '', row._photos ? `${row._photos.length} foto` : '', row.catatan].filter(Boolean);
  computed(form, table, row, entry).forEach(([, l, v]) => bits.push(`${l} ${v}`));
  const big = table.big && row[table.big] !== undefined && row[table.big] !== '' ? `${row[table.big]}${table.bigU || ''}` : '';
  return { title, sub: bits.join(' · '), big };
}

function renderEntry() {
  const e = S.entries[view.id];
  if (!e) { go({ v: 'forms' }, true); return; }
  const form = FORM[e.form];
  const l = entryLabel(form, e);
  setTitle(`Form ${form.id} · ${l.t}`, form.title);
  let tallyHTML = '';
  if (form.tally) {
    const sums = {};
    (e.tables[form.tally.table] || []).forEach(r => {
      const n = num(r[form.tally.n]); if (!r[form.tally.by] || isNaN(n)) return;
      const k = String(r[form.tally.by]).split(' — ')[0]; sums[k] = (sums[k] || 0) + n;
    });
    const list = Object.entries(sums).sort((a, b) => b[1] - a[1]);
    if (list.length) tallyHTML = `<section class="section"><h2>Total per jenis (${list.length} jenis, ${list.reduce((a, b) => a + b[1], 0)} individu)</h2>
      <div class="box"><table class="tally">${list.map(([k, n]) => `<tr><td>${esc(k)}</td><td>${n}</td></tr>`).join('')}</table></div></section>`;
  }
  app.innerHTML = `
    <details class="legend"><summary>Petunjuk Form ${form.id}</summary><p>${esc(form.intro)}</p><p>${esc(form.legend)}</p></details>
    <section class="section"><h2>Kepala lembar</h2>
      <div class="fields" data-scope="h">${form.header.map(f => fieldHTML(f, e.header[f.k], 'h', { acc: e.header[f.k + 'Acc'], obj: e.header })).join('')}</div>
    </section>
    ${photoSectionHTML(e.header._photos || [], 'Foto lokasi', 'Ambil foto lokasi', 'Untuk foto kondisi lokasi, titik pengamatan, stasiun, atau habitat. Nama, jam, dan koordinat GPS dicatat otomatis dan ditulis sebagai watermark di kanan bawah foto; ikut dalam ekspor ZIP (folder foto/).')}
    ${tallyHTML}
    ${form.tables.map(t => {
      const rows = e.tables[t.id] || [];
      return `<section class="section">
        <div class="tablehead"><h2>${esc(t.title)}</h2><span class="count">${rows.length} baris</span></div>
        ${rows.length ? `<div class="rows">${rows.map((r, i) => {
          const s = rowSummary(form, t, r, e);
          return `<button type="button" class="rcard" data-act="openrow" data-t="${t.id}" data-i="${i}">
            <span class="no">${i + 1}</span><span class="rt">${esc(s.title)}</span><span class="num">${esc(s.big)}</span>
            ${s.sub ? `<span class="rs">${esc(s.sub)}</span>` : ''}</button>`;
        }).join('')}</div>` : `<div class="empty">Belum ada baris.</div>`}
        <button type="button" class="btn block" data-act="newrow" data-t="${t.id}">+ Tambah baris</button>
      </section>`;
    }).join('')}
    <section class="section"><h2>Lembar ini</h2>
      <div class="row">
        <button type="button" class="btn ghost" data-act="dupentry">Salin kepala ke lembar baru</button>
        <button type="button" class="btn danger" data-act="delentry">Hapus lembar</button>
      </div>
    </section>`;
  loadThumbs();
}

function renderRow() {
  const e = S.entries[view.id]; const form = e && FORM[e.form];
  const t = form && form.tables.find(x => x.id === view.t);
  const rows = t && e.tables[t.id];
  const row = rows && rows[view.i];
  if (!row) { go({ v: 'entry', id: view.id }, true); return; }
  setTitle(`${t.title.replace(/\s*\(.*\)$/, '')} · baris ${view.i + 1}`, `Form ${form.id} · ${entryLabel(form, e).t}`);
  const comp = computed(form, t, row, e);
  app.innerHTML = `
    <div class="fields" data-scope="r">${t.fields.map(f => fieldHTML(f, row[f.k], 'r', { acc: row[f.k + 'Acc'], obj: row })).join('')}
      ${(form.id === 'D2' || form.id === 'F1') ? `<div class="field w"><span class="computed" id="computed">${comp.map(c => `${c[1]}: ${c[2]}`).join(' · ')}</span></div>` : ''}
    </div>
    ${photoSectionHTML(row._photos || [], 'Foto data ini', 'Ambil foto', 'Untuk foto satwa, tumbuhan, sampel, atau temuan pada baris ini. Nama, jam, dan koordinat GPS dicatat otomatis dan ditulis sebagai watermark di kanan bawah foto; ikut dalam ekspor ZIP (folder foto/).')}
    <div class="sticky-actions">
      <button type="button" class="btn" data-act="rowdone">Selesai</button>
      <button type="button" class="btn ghost" data-act="rownext">Simpan + baris baru</button>
    </div>
    <div class="row">
      <button type="button" class="btn ghost" data-act="rowdup">Duplikat baris</button>
      <button type="button" class="btn danger" data-act="rowdel">Hapus baris</button>
    </div>
    <p class="note">Data tersimpan otomatis di HP setiap kali Anda mengetik.</p>`;
  loadThumbs();
}

/* ================= Rekap ala tally sheet =================
   Sumber = tabel yang punya kolom jenis + jumlah. Kolom rekap bisa dikelompokkan per
   waktu, sektor/lokasi, aktivitas, atau tanggal. "Maks" = jumlah tertinggi dalam satu
   kolom waktu/tanggal: perkiraan populasi yang tidak menghitung burung yang sama dua kali. */
const RK_SOURCES = [
  { id: 'B1', form: 'B1', table: 'hitung', label: 'Burung pantai: hitung pasang (B1)', sp: 'jenis', n: 'jumlah',
    by: [['jam', 'Waktu'], ['r:sektor', 'Sektor / lokasi'], ['r:aktivitas', 'Aktivitas'], ['tanggal', 'Tanggal'], ['h:titik', 'Titik pengamatan']] },
  { id: 'B3', form: 'B2', table: 'singgah', label: 'Persinggahan di luar intertidal (B3)', sp: 'jenis', n: 'jumlah',
    by: [['r:kodeTitik', 'Kode titik'], ['r:habitat', 'Tipe habitat'], ['jam', 'Waktu'], ['r:aktivitas', 'Aktivitas'], ['tanggal', 'Tanggal']] },
  { id: 'B4', form: 'B2', table: 'gangguan', label: 'Gangguan di mudflat (B4)', sp: 'jenis', n: 'jumlah', unit: 'kejadian',
    by: [['r:respons', 'Respons burung'], ['jam', 'Waktu'], ['tanggal', 'Tanggal']] },
  { id: 'F4', form: 'F3', table: 'ves', label: 'Herpetofauna malam (F4)', sp: 'jenis', n: 'jumlah',
    by: [['r:mikro', 'Mikrohabitat'], ['jam', 'Waktu'], ['r:aktivitas', 'Aktivitas'], ['tanggal', 'Tanggal'], ['h:rute', 'Rute']] },
  { id: 'F5', form: 'F3', table: 'buaya', label: 'Buaya muara (F5)', sp: 'kelas', n: 'jumlah',
    by: [['r:posisi', 'Posisi'], ['tanggal', 'Tanggal'], ['jam', 'Waktu'], ['h:rute', 'Rute']] },
  { id: 'F6', form: 'F2', table: 'jumpa', label: 'Primata (F1, F6)', sp: 'jenis', n: 'total',
    by: [['tanggal', 'Tanggal'], ['r:aktivitas', 'Aktivitas'], ['jam', 'Waktu']] },
  { id: 'G1', form: 'G1', table: 'jumpa', label: 'KEHATI sekitar desa (G1)', sp: 'jenis', n: 'jumlah',
    by: [['r:habitat', 'Habitat'], ['r:kelompok', 'Kelompok'], ['r:cara', 'Cara perjumpaan'], ['jam', 'Waktu'], ['tanggal', 'Tanggal'], ['h:lokasi', 'Desa / lokasi']] },
  { id: 'F7', form: 'F4', table: 'serangga', label: 'Serangga intertidal (F7)', sp: 'jenis', n: 'jumlah',
    by: [['r:mikro', 'Mikrohabitat'], ['r:roosting', 'Area roosting'], ['jam', 'Waktu'], ['tanggal', 'Tanggal'], ['h:lokasi', 'Lokasi / plot']] },
  { id: 'E2', form: 'E2', table: 'ikan', label: 'Jenis ikan (E2)', sp: 'lokal', n: 'jumlah',
    by: [['h:lokasiPendaratan', 'Lokasi pendaratan'], ['tanggal', 'Tanggal'], ['r:alat', 'Alat tangkap']] },
];
let RK = { src: 'B1', by: 'jam', step: 60, tgl: '', marks: true };
try { Object.assign(RK, JSON.parse(localStorage.getItem('survei-cemara-rekap') || '{}')); } catch (e) {}
function rkSave() { try { localStorage.setItem('survei-cemara-rekap', JSON.stringify(RK)); } catch (e) {} }

function rkRows(src) {
  const form = FORM[src.form], t = form.tables.find(x => x.id === src.table);
  const out = [];
  entriesOf(src.form).forEach(e => (e.tables[src.table] || []).forEach(r => {
    const n = num(r[src.n]);
    const sp = r[src.sp];
    if (!sp || isNaN(n)) return;
    out.push({ e, r, n, sp, form, t, tgl: r.tanggal || e.header.tanggal || e.header.tglPasang || '' });
  }));
  return out;
}
function rkKey(src, x) {
  const by = RK.by;
  if (by === 'tanggal') return x.tgl ? [x.tgl, fmtDate(x.tgl)] : ['', '(tanpa tanggal)'];
  if (by === 'jam') {
    const j = x.r.jam || '';
    const m = j.match(/^(\d{1,2}):(\d{2})/); if (!m) return ['~', '(tanpa jam)'];
    const mins = +m[1] * 60 + +m[2], st = Math.floor(mins / RK.step) * RK.step, en = st + RK.step - 1;
    const hm = v => `${pad(Math.floor(v / 60))}.${pad(v % 60)}`;
    return [pad(Math.floor(st / 60)) + pad(st % 60), `${hm(st)}–${hm(en)}`];
  }
  const [where, k] = by.split(':');
  const obj = where === 'h' ? x.e.header : x.r;
  const fdef = (where === 'h' ? x.form.header : x.t.fields).find(f => f.k === k);
  const v = obj[k];
  if (v == null || v === '') return ['~', '(kosong)'];
  return [String(v), fdef ? label(fdef, v) : String(v)];
}
function rkSpecies(v) { const [a, b] = String(v).split(' — '); return { name: a, sci: b || '' }; }
function rkBuild() {
  const src = RK_SOURCES.find(x => x.id === RK.src) || RK_SOURCES[0];
  if (!src.by.some(b => b[0] === RK.by)) RK.by = src.by[0][0];
  let rows = rkRows(src);
  const dates = [...new Set(rows.map(x => x.tgl).filter(Boolean))].sort();
  if (RK.tgl && !dates.includes(RK.tgl)) RK.tgl = '';
  if (RK.tgl && RK.by !== 'tanggal') rows = rows.filter(x => x.tgl === RK.tgl);
  const spField = FORM[src.form].tables.find(t => t.id === src.table).fields.find(f => f.k === src.sp);
  const cols = new Map(), mat = new Map();
  // Per tanggal: jumlahkan dulu per selang waktu, lalu ambil yang tertinggi dalam hari itu,
  // supaya kelompok yang sama yang dihitung ulang pada jam berbeda tidak dijumlahkan.
  const slot = x => { const m = String(x.r.jam || '').match(/^(\d{1,2}):(\d{2})/); return m ? Math.floor((+m[1] * 60 + +m[2]) / RK.step) : 'x'; };
  const sub = new Map();
  rows.forEach(x => {
    const [ck, cl] = rkKey(src, x); cols.set(ck, cl);
    const spk = spField.t === 'sel' ? label(spField, x.sp) : String(x.sp);
    if (!mat.has(spk)) mat.set(spk, new Map());
    if (RK.by === 'tanggal') { const k = spk + '\u0000' + ck + '\u0000' + slot(x); sub.set(k, (sub.get(k) || 0) + x.n); }
    else { const m = mat.get(spk); m.set(ck, (m.get(ck) || 0) + x.n); }
  });
  sub.forEach((v, k) => { const [spk, ck] = k.split('\u0000'); const m = mat.get(spk); m.set(ck, Math.max(m.get(ck) || 0, v)); });
  const colKeys = [...cols.keys()].sort((a, b) => a.localeCompare(b, 'id', { numeric: true }));
  const showMax = RK.by === 'jam' || RK.by === 'tanggal';
  const species = [...mat.entries()].map(([sp, m]) => {
    const vals = colKeys.map(k => m.get(k) || 0);
    return { sp, vals, total: vals.reduce((a, b) => a + b, 0), max: Math.max(0, ...vals) };

/* ================= Foto =================

async function shrink(file, max, wm) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { bmp = await new Promise((ok, fail) => { const im = new Image(); im.onload = () => ok(im); im.onerror = fail; im.src = URL.createObjectURL(file); }); }
  const w0 = bmp.width, h0 = bmp.height, k = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement('canvas'); c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  if (wm) drawWatermark(c, wm);
  const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', PHOTO_Q));
  return { blob, w: c.width, h: c.height };
}
/* Watermark di kanan bawah foto: nama lokasi, koordinat, tanggal-jam.
   Teks putih di atas kotak gelap transparan; ukuran huruf mengikuti ukuran foto. */
function withWatermark() { try { return localStorage.getItem('survei-cemara-watermark') !== '0'; } catch (e) { return true; } }
function drawWatermark(c, lines) {
  const g = c.getContext('2d'), fs = Math.max(14, Math.round(Math.min(c.width, c.height) * 0.032)), lh = Math.round(fs * 1.3), pad = Math.round(fs * 0.6), m = Math.round(fs * 0.8);
  const font = i => `${i === 0 ? '700 ' : ''}${fs}px system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif`;
  const w = Math.min(c.width - 2 * m, Math.max(...lines.map((t, i) => { g.font = font(i); return g.measureText(t).width; })) + 2 * pad);
  const h = lines.length * lh + 2 * pad - Math.round(fs * 0.2), x = c.width - m - w, y = c.height - m - h;
  g.fillStyle = 'rgba(0,0,0,.55)';
  if (g.roundRect) { g.beginPath(); g.roundRect(x, y, w, h, Math.round(fs * 0.4)); g.fill(); } else g.fillRect(x, y, w, h);
  g.fillStyle = '#fff'; g.textAlign = 'right'; g.textBaseline = 'top';
  g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = Math.round(fs * 0.15);
  lines.forEach((t, i) => { g.font = font(i); g.fillText(t, c.width - m - pad, y + pad + i * lh, w - 2 * pad); });
}
function tzLabel(d) { return { '-420': 'WIB', '-480': 'WITA', '-540': 'WIT' }[String(d.getTimezoneOffset())] || ''; }
function wmLines(e, obj, isRow, lat, lon, acc, taken) {
  const keys = ['lokasi', 'titik', 'kodeTitik', 'kodePlot', 'stasiun', 'rute', 'lokasiPendaratan'];
  const pick = o => { for (const k of keys) if (o && o[k]) return String(o[k]).split(' — ')[0]; return ''; };
  const names = [...new Set([isRow ? pick(obj) : '', pick(e.header)].filter(Boolean))];
  const d = new Date(taken * 1000);
  return [
    `${names.join(' · ') || 'Lokasi tanpa nama'} · Form ${e.form}`,
    lat != null ? `${lat.toFixed(6)}, ${lon.toFixed(6)}${acc ? ` (±${acc} m)` : ''}` : 'Koordinat belum ada',
    `${fmtDate(`${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`)} · ${pad(d.getHours())}:${pad(d.getMinutes())} ${tzLabel(d)}`.trim(),
  ];
}
let photoGeo = null;   // posisi GPS diminta saat tombol kamera ditekan, dipakai saat foto kembali
function askPhotoGeo() {
  photoGeo = new Promise(ok => {
    if (!navigator.geolocation) return ok(null);
    navigator.geolocation.getCurrentPosition(p => ok(p.coords), () => ok(null), { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 });
  });
}

  return `${e.form}_${tag}_${stamp}`;

async function addPhotos(files) {
  const tgt = photoTarget(); if (!tgt || !files || !files.length) return;
  const e = tgt.e;
  toast(files.length > 1 ? `Menyimpan ${files.length} foto…` : 'Menyimpan foto…');
  const geo = await Promise.race([photoGeo || Promise.resolve(null), new Promise(ok => setTimeout(() => ok(null), 4000))]);
  let n = 0;
  for (const file of files) {
    try {
      const taken = Math.round((file.lastModified || Date.now()) / 1000);
      const r0 = tgt.find(); if (!r0) break;
      const pos = {};
      if (geo) Object.assign(pos, { lat: +geo.latitude.toFixed(6), lon: +geo.longitude.toFixed(6), acc: Math.round(geo.accuracy) });
      else { const m = String(r0.koordinat || (tgt.isRow ? '' : e.header.koordinat) || '').match(/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/); if (m) Object.assign(pos, { lat: +m[1], lon: +m[2], acc: r0.koordinatAcc ?? null, geoSrc: 'koordinat baris' }); }

      const id = rid();
      await pdbPut('foto', id, big.blob); await pdbPut('thumb', id, small.blob);
      const r = tgt.find(); if (!r) break;
      r._photos = r._photos || [];
      let name = photoName(e, tgt.tag, taken), k = 1;
      while (r._photos.some(p => p.name === name + '.jpg')) name = photoName(e, tgt.tag, taken) + '_' + (++k);
      const meta = { id, name: name + '.jpg', t: taken, w: big.w, h: big.h, size: big.blob.size, ...pos };
      if (wm) meta.watermark = true;
      r._photos.push(meta);

      const tdef = tgt.isRow && FORM[e.form].tables.find(t => t.id === tgt.t);

  }

  if (n) { touch(e); save(); if (view.v === 'row' || view.v === 'entry') render(); const o = tgt.find(); toast(`${n} foto tersimpan${geo || (o && o.koordinat) ? ' dengan koordinat' : ' (tanpa GPS)'}`); }
}

/* ================= Interaksi ================= */
function currentTarget() {

  if (view.v === 'row') { const e = S.entries[view.id]; const r = e && (e.tables[view.t] || [])[view.i]; return r && { obj: r, e }; }

let armed = null;
function arm(btn, key, text) {
  if (armed === key) { armed = null; return true; }
  armed = key; btn.classList.add('armed'); const old = btn.textContent; btn.textContent = text;
  setTimeout(() => { if (armed === key) { armed = null; btn.classList.remove('armed'); btn.textContent = old; } }, 3500);

function newEntry(fid, from) {
  const form = FORM[fid];
  const e = { id: rid(), form: fid, created: Date.now(), updated: Date.now(), by: S.profile.device, header: {}, tables: {} };
  form.header.forEach(f => { const d = from ? from.header[f.k] : defaultFor(f); if (d !== '' && d != null) e.header[f.k] = Array.isArray(d) ? [...d] : d; });
  if (from) { form.header.forEach(f => { if (f.def === 'today') e.header[f.k] = today(); }); }
  form.tables.forEach(t => { e.tables[t.id] = []; });
  S.entries[e.id] = e; save();
  if (!from && form.header.some(f => f.k === 'koordinat')) autoGPS(e.id, () => S.entries[e.id] && S.entries[e.id].header);
  return e;
}
function newRow(e, tid, base) {
  const form = FORM[e.form]; const t = form.tables.find(x => x.id === tid);
  const rows = e.tables[tid] = e.tables[tid] || [];
  const r = { _id: rid(), _auto: [] };
  t.fields.forEach(f => { const d = defaultFor(f); if (d) { r[f.k] = d; r._auto.push(f.k); } });
  if (t.numbered) { r[t.numbered] = String(rows.length + 1); r._auto.push(t.numbered); }
  if (base && t.carry) t.carry.forEach(k => { if (base[k]) { r[k] = Array.isArray(base[k]) ? [...base[k]] : base[k]; r._auto.push(k); } });
  rows.push(r); touch(e); save();
  pendingNew = { id: e.id, t: tid, rowId: r._id };
  if (t.fields.some(f => f.k === 'koordinat')) autoGPS(e.id, () => (S.entries[e.id] && S.entries[e.id].tables[tid] || []).find(x => x._id === r._id));
  return rows.length - 1;
}
/* Koordinat otomatis: setiap lembar/baris baru langsung meminta posisi GPS dan mengisi kolom

function autoGPS(eid, find) {

  const showHint = (txt) => { const o = find(), tg = currentTarget(); if (o && tg && tg.obj === o) { const h = app.querySelector('[data-acc="koordinat"]'); if (h) h.textContent = txt; } };
  setTimeout(() => showHint('Mengambil koordinat GPS otomatis…'), 0);
  navigator.geolocation.getCurrentPosition(p => {
    const o = find(); if (!o || o.koordinat) return;
    const v = `${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}`, acc = Math.round(p.coords.accuracy);
    o.koordinat = v; o.koordinatAcc = acc;
    if (o._auto) o._auto.push('koordinat', 'koordinatAcc');
    touch(S.entries[eid]); save();
    const tg = currentTarget();
    if (tg && tg.obj === o) { const inp = app.querySelector('input[data-k="koordinat"]'); if (inp && !inp.value) inp.value = v; showHint(`Otomatis dari GPS HP · akurasi ±${acc} m`); }
  }, () => showHint('GPS belum didapat. Ketuk "Ambil GPS" di tempat terbuka, atau ketik manual.'),
  { enableHighAccuracy: true, timeout: 30000, maximumAge: 15000 });

function getGPS(k, btn) {
  if (!navigator.geolocation) { toast('GPS tidak tersedia di browser ini. Ketik koordinat dari unit GPS.'); return; }
  const tg = currentTarget(); if (!tg) return;
  btn.classList.add('busy'); btn.textContent = 'Mencari…';

    const v = `${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}`;
    tg.obj[k] = v; tg.obj[k + 'Acc'] = Math.round(p.coords.accuracy); markEdited(tg.obj, k); touch(tg.e); save();
    const inp = app.querySelector(`[data-k="${k}"]:not(button)`); if (inp) inp.value = v;
    const h = app.querySelector(`[data-acc="${k}"]`); if (h) h.textContent = `Akurasi ±${Math.round(p.coords.accuracy)} m`;
    btn.classList.remove('busy'); btn.textContent = 'Ambil GPS';

  }, err => {

    toast(err.code === 1 ? 'Izin lokasi ditolak. Aktifkan izin lokasi untuk situs ini di pengaturan browser.' : 'Sinyal GPS belum didapat. Coba lagi di tempat terbuka atau ketik manual.');
  }, { enableHighAccuracy: true, timeout: 30000, maximumAge: 5000 });

/* Di aplikasi Android (Capacitor) unduhan browser tidak jalan: simpan ke folder Documents atau bagikan lewat plugin bawaan. */

    try {

      toast(`Tersimpan di Documents/SurveiCemara/${name}`); return;
    } catch (e) { /* lanjut ke bagikan */ }
  }
  const res = await Filesystem.writeFile({ path: name, data, directory: 'CACHE' });
  try { await Share.share({ title: name, text: 'Data Survei Pantai Cemara', files: [res.uri], dialogTitle: 'Kirim data survei' }); }
  catch (e) { if (!/cancel/i.test(String(e && e.message))) toast('Gagal membagikan file. Coba "Simpan ZIP ke HP".'); }
}

  setTimeout(() => URL.revokeObjectURL(url), 4000); toast(`${name} diunduh`);
}

function importFile(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const obj = JSON.parse(rd.result); const d = obj.data || obj;
      if (!d.entries) throw new Error('format');
      let add = 0, upd = 0;
      Object.values(d.entries).forEach(e => {
        const cur = S.entries[e.id];
        if (!cur) { S.entries[e.id] = e; add++; }
        else if ((e.updated || 0) > (cur.updated || 0)) { S.entries[e.id] = e; upd++; }
      });
      ['keg', 'jadwal', 'alat'].forEach(sec => Object.entries(d[sec] || {}).forEach(([k, v]) => {
        if (!S[sec][k] || (v.t || 0) > (S[sec][k].t || 0)) S[sec][k] = v;
      }));
      save(); render(); toast(`Digabung: ${add} lembar baru, ${upd} diperbarui`);
    } catch (e) { toast('File ini bukan cadangan Survei Cemara (.json). Pilih file hasil "Unduh cadangan".'); }
  };
  rd.readAsText(file);
}

    ? '<p class="note">Pasang agar Survei Cemara muncul di daftar aplikasi dan terbuka layar penuh tanpa bar Chrome.</p><button type="button" class="btn block" data-act="install">Pasang aplikasi Survei Cemara</button>'
    : '<p class="note">Pasang agar Survei Cemara muncul di daftar aplikasi dan terbuka layar penuh tanpa bar Chrome.</p>') + offline + help;
}
async function doInstall() {
  if (!installEvt) { toast('Gunakan menu ⋮ → Instal aplikasi di Chrome.'); return; }
  const ev = installEvt; installEvt = null; document.getElementById('installbar').hidden = true;
  try { ev.prompt(); const r = await ev.userChoice; if (r && r.outcome === 'accepted') toast('Memasang Survei Cemara…'); } catch (e) {}
  if (view.v === 'data') render();
}
function installDismissed() { try { return Date.now() - (+localStorage.getItem('survei-cemara-installX') || 0) < 3 * 86400000; } catch (e) { return false; } }
window.addEventListener('beforeinstallprompt', ev => {
  ev.preventDefault(); installEvt = ev;
  if (!isStandalone() && !installDismissed()) document.getElementById('installbar').hidden = false;
  if (view.v === 'data') render();
});
window.addEventListener('appinstalled', () => { installEvt = null; document.getElementById('installbar').hidden = true; toast('Survei Cemara terpasang. Buka dari ikon di layar utama atau daftar aplikasi.'); if (view.v === 'data') render(); });
document.getElementById('installBtn').addEventListener('click', doInstall);
document.getElementById('installX').addEventListener('click', () => { document.getElementById('installbar').hidden = true; try { localStorage.setItem('survei-cemara-installX', Date.now()); } catch (e) {} });

/* ================= Mulai ================= */
applyTheme(); updateNet(); render();
/* ================= Pembaruan otomatis =================
   Service worker memeriksa server setiap kali aplikasi dibuka, saat kembali ke
   aplikasi, dan tiap 15 menit. Bila ada versi baru, halaman dimuat ulang sendiri
   saat aman (tidak sedang merekam track atau mengisi lembar); bila tidak aman,
   muncul tombol Perbarui. Posisi halaman dipulihkan setelah dimuat ulang. */
function safeToReload() {
  const a = document.activeElement;
  const typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  return !REC && !typing && !['row', 'entry'].includes(view.v);
}
function applyUpdate() {
  save();
  try { sessionStorage.setItem('survei-cemara-resume', JSON.stringify(view)); sessionStorage.setItem('survei-cemara-updated', '1'); } catch (e) {}
  location.reload();
}
function onUpdateReady() {
  updateReady = true;
  if (safeToReload()) { applyUpdate(); return; }
  document.getElementById('updbar').hidden = false;
}
function checkUpdate() {
  if (!navigator.onLine || !navigator.serviceWorker || !navigator.serviceWorker.controller) return;
  navigator.serviceWorker.controller.postMessage({ type: 'check' });
  navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
}
document.getElementById('updBtn').addEventListener('click', applyUpdate);
try {
  const resume = JSON.parse(sessionStorage.getItem('survei-cemara-resume') || 'null');
  sessionStorage.removeItem('survei-cemara-resume');
  if (resume && resume.v && (!resume.id || S.entries[resume.id])) { view = resume; history.replaceState(view, ''); render(); }
  if (sessionStorage.getItem('survei-cemara-updated')) { sessionStorage.removeItem('survei-cemara-updated'); toast('Aplikasi diperbarui ke versi terbaru'); }
} catch (e) {}
if (!NATIVE && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('message', ev => { if (ev.data && ev.data.type === 'updated') onUpdateReady(); });
  // Service worker baru mengambil alih (mis. sw.js sendiri berubah): muat versi baru juga.
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) onUpdateReady(); });
  navigator.serviceWorker.register('sw.js').catch(() => {});
  // Kunjungan pertama: beri tahu bahwa aplikasi sudah tersimpan dan bisa dipakai tanpa sinyal.
  if (!hadController) navigator.serviceWorker.ready.then(() => { try { if (!localStorage.getItem('survei-cemara-offline-ok')) { localStorage.setItem('survei-cemara-offline-ok', '1'); toast('Aplikasi tersimpan di HP: bisa dipakai tanpa sinyal.'); } } catch (e) {} }).catch(() => {});
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
  window.addEventListener('online', checkUpdate);
  setInterval(checkUpdate, 15 * 60 * 1000);
}
</script>
